name: Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CI 环境没有本地 Gradle 文件，覆盖为网络 URL
      - name: Use network Gradle distribution
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 || true

      # 签名密钥（v2.36.0 起双模式）：
      #   - 模式 A（正式签名）：仓库 Secrets 配置了 SIGNING_KEYSTORE_BASE64 等四个值时，
      #     base64 解码出 release-key.jks，配合 SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS /
      #     SIGNING_KEY_PASSWORD 签名——产出与本地一致的正式发布 APK。
      #   - 模式 B（fallback）：未配置 secrets 时，临时生成 throwaway ci-keystore.jks，
      #     只用于 CI 验证「能编译 + 签名通过」，APK 不可覆盖安装到已有数据的设备。
      # S1 阶段 A+：release 打包 guard 要求 cryptoPassphrase 非空。
      # 优先取仓库 secret（与正式发布一致）；未配置时回退占位值，保证 CI 仍可构建。
      # 注：用占位值时产出的 APK 加密密钥与正式包不同，仅供 CI 验证，不可覆盖安装到已有数据的设备。
      - name: Set up signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          CRYPTO_PASSPHRASE: ${{ secrets.CRYPTO_PASSPHRASE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Using release keystore from GitHub Secrets"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release-key.jks
            {
              echo "storeFile=release-key.jks"
              echo "storePassword=$SIGNING_STORE_PASSWORD"
              echo "keyAlias=$SIGNING_KEY_ALIAS"
              echo "keyPassword=$SIGNING_KEY_PASSWORD"
              echo "cryptoPassphrase=${CRYPTO_PASSPHRASE:-ci-build-only-placeholder}"
            } > keystore.properties
          else
            echo "No signing secrets found, falling back to throwaway CI keystore"
            keytool -genkey -v -keystore ci-keystore.jks -alias ci -keyalg RSA -keysize 2048 -validity 3650 -storepass ci-pass -keypass ci-pass -dname "CN=CI,OU=CI,O=CI,L=CI,S=CI,C=CI"
            {
              echo "storeFile=ci-keystore.jks"
              echo "storePassword=ci-pass"
              echo "keyAlias=ci"
              echo "keyPassword=ci-pass"
              echo "cryptoPassphrase=${CRYPTO_PASSPHRASE:-ci-build-only-placeholder}"
            } > keystore.properties
          fi
          echo "=== keystore.properties (passwords redacted) ==="
          sed 's/\(storePassword\|keyPassword\)=.*/\1=<redacted>/' keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_DASHED=$(echo "$VERSION" | tr '.' '-')
          echo "APK_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_VERSION_DASHED=$VERSION_DASHED" >> $GITHUB_ENV
          ls -la app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NASMusicTV-release-v${{ env.APK_VERSION_DASHED }}
          path: app/build/outputs/apk/release/

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # 获取上一个 release 的版本号
          LATEST_TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || echo "")
          if [ "$LATEST_TAG" = "$TAG" ]; then
            # 最新 release 就是当前 tag，取前一个
            PREV_TAG=$(gh release list --limit 2 --json tagName --jq '.[1].tagName' 2>/dev/null || echo "")
          else
            PREV_TAG="$LATEST_TAG"
          fi
          # 清理无效值
          if [ "$PREV_TAG" = "null" ] || [ -z "$PREV_TAG" ]; then PREV_TAG=""; fi
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ] && grep -q "^## \[$PREV_TAG\]" CHANGELOG.md; then
            echo "Previous release: $PREV_TAG, current: $TAG"
            # 从 CHANGELOG 开头取到上一个 release 那一节（不含）
            # = 「上一个 release 之后 → 当前 tag」之间的**全部**小节说明
            #   （补打多个版本时，中间几版的说明会一并带上，这是期望行为）
            awk -v prev="$PREV_TAG" -v maxsec=5 '
              /^## \[/ {
                started = 1
                sec++
                if ($0 ~ "^## \\[" prev "\\]") exit
                # 双保险：prev 已在上面 grep 过，这里再挡一次，绝不扫到文件尾
                if (sec > maxsec) exit
              }
              started { print }
            ' CHANGELOG.md > release_notes.md
          else
            echo "Previous release not present in this CHANGELOG, extracting current version only"
            # ⛔ 上一个 release 的版本号在这份 CHANGELOG 里**没有对应小节**
            #   （tag 对应的提交早于该 release —— 例如补打旧版本 tag）。
            #   旧写法此时会让 awk 一路扫到文件尾，把整份 CHANGELOG（36 万字节）
            #   倒进 notes → 超过 GitHub release body 上限 125000 字符 → HTTP 422。
            #   这里退化为只取当前 tag 自己那一节，天然有界。
            awk -v tag="$TAG" '
              $0 ~ "^## \\[" tag "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release_notes.md
          fi
          # 兜底 1：没取到内容时给个占位，避免空 notes
          if [ ! -s release_notes.md ]; then
            echo "Release $TAG（详见仓库 CHANGELOG.md）" > release_notes.md
          fi
          # 兜底 2：GitHub release body 硬上限 125000 字符，留 5000 余量
          head -c 120000 release_notes.md > release_notes.md.trim
          mv release_notes.md.trim release_notes.md
          echo "=== Release notes ($(wc -c < release_notes.md) bytes) ==="
          cat release_notes.md
          echo "=== End ==="

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          APK="app/build/outputs/apk/release/NASMusicTV-release-v${{ env.APK_VERSION_DASHED }}.apk"
          # 删除已存在的 release（如果有），重新创建
          if gh release view "$TAG" --json tagName &>/dev/null; then
            echo "Deleting existing release $TAG..."
            gh release delete "$TAG" --yes
          fi
          echo "Creating release $TAG..."
          ARGS=("--notes-file" "release_notes.md" "--title" "NASMusicTV $TAG")
          if [ -f "$APK" ]; then
            gh release create "$TAG" "${ARGS[@]}" "$APK"
          else
            gh release create "$TAG" "${ARGS[@]}"
          fi

  # 修复（M-11）：CI 原先只构建不测试；补充单元测试步骤
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use network Gradle distribution
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      # testDebugUnitTest 需 Android SDK（android.jar）；runner 上的 SDK 不保证持续可用，
      # 与 build job 显式安装保持一致，避免依赖 runner 预装的隐含状态。
      - name: Set up Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 || true
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

  # 静态检查（新增）：项目此前未配置 lint，先以"非阻塞 + 上传报告"方式引入，
  # 积累一段时间的告警清单、清理后再改为阻塞（去掉 continue-on-error）。
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use network Gradle distribution
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 || true
      - name: Run lint
        # 2026-09-14：lint 错误已清零（105 → 0），此 job 转为阻塞门禁。
        # 警告（约 256 条，UnusedResources/TypographyEllipsis/UseKtx 等）不影响结果。
        # 若新增 error 导致此处失败，请修复而非加 continue-on-error。
        run: ./gradlew lintDebug --stacktrace
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
