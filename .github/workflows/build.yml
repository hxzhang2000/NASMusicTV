name: Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CI 环境没有本地 Gradle 文件，覆盖为网络 URL
      - name: Use network Gradle distribution
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 || true

      # 签名密钥 - 生成临时 keystore 供 CI 签名（仅用于 CI 构建，非正式发布签名密钥）
      - name: Create keystore for CI
        run: |
          keytool -genkey -v -keystore app/ci-keystore.jks -alias ci -keyalg RSA -keysize 2048 -validity 3650 -storepass ci-pass -keypass ci-pass -dname "CN=CI,OU=CI,O=CI,L=CI,S=CI,C=CI"
          echo "storeFile=ci-keystore.jks" > keystore.properties
          echo "storePassword=ci-pass" >> keystore.properties
          echo "keyAlias=ci" >> keystore.properties
          echo "keyPassword=ci-pass" >> keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_DASHED=$(echo "$VERSION" | tr '.' '-')
          echo "APK_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_VERSION_DASHED=$VERSION_DASHED" >> $GITHUB_ENV
          ls -la app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NASMusicTV-release-v${{ env.APK_VERSION_DASHED }}
          path: app/build/outputs/apk/release/

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # 获取上一个 release 的版本号
          LATEST_TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || echo "")
          if [ "$LATEST_TAG" = "$TAG" ]; then
            # 最新 release 就是当前 tag，取前一个
            PREV_TAG=$(gh release list --limit 2 --json tagName --jq '.[1].tagName' 2>/dev/null || echo "")
          else
            PREV_TAG="$LATEST_TAG"
          fi
          # 清理无效值
          if [ "$PREV_TAG" = "null" ] || [ -z "$PREV_TAG" ]; then PREV_TAG=""; fi
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            echo "Previous release: $PREV_TAG, current: $TAG"
            # 从 CHANGELOG 开头提取到上一个版本之前
            awk -v prev="$PREV_TAG" '
              /^## \[/ { found=1 }
              found && $0 ~ "^## \\[" prev "\\]" { exit }
              found { print }
            ' CHANGELOG.md > release_notes.md
          else
            echo "No previous release found, extracting current version only"
            # 没有上一个 release，只提取当前版本
            awk -v tag="$TAG" '
              $0 ~ "^## \\[" tag "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release_notes.md
          fi
          echo "=== Release notes ==="
          cat release_notes.md
          echo "=== End ==="
          echo "File size: $(wc -c < release_notes.md) bytes"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          APK="app/build/outputs/apk/release/NASMusicTV-release-v${{ env.APK_VERSION_DASHED }}.apk"
          # 删除已存在的 release（如果有），重新创建
          if gh release view "$TAG" --json tagName &>/dev/null; then
            echo "Deleting existing release $TAG..."
            gh release delete "$TAG" --yes
          fi
          echo "Creating release $TAG..."
          ARGS=("--notes-file" "release_notes.md" "--title" "NASMusicTV $TAG")
          if [ -f "$APK" ]; then
            gh release create "$TAG" "${ARGS[@]}" "$APK"
          else
            gh release create "$TAG" "${ARGS[@]}"
          fi
