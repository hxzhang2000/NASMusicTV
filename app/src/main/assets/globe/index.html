<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>WorldGlobe</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #globe-container {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <!--
    NASMusicTV「世界」可视化 — 3D 地球（完全离线）。
    仅加载本地相对路径脚本，运行时零网络。
    three.js r160 UMD（r161+ 起 npm 不再发布 UMD 构建；r160 是 ≤r162 中
    最后一个带 UMD three.min.js 的版本，WebGL1 兜底支持完好）。
    three-globe 2.45.2 UMD（peerDependency three >=0.154，兼容 r160）。
  -->
  <!--
    加载顺序不可调换：
      1) polyfill.es5.js      —— Chrome 39 缺失的 ES2015+ API（Object.assign / Array.from /
                                Object.values / Object.entries / String.includes /
                                String.startsWith / Array.includes / Array.find）
      2) three.es5.js         —— 上游 three.min.js（r160 UMD）的 ES5 降级产物
      3) three-globe.es5.js   —— 上游 three-globe.min.js（2.45.2 UMD）的 ES5 降级产物
      4) globe.js             —— 本项目渲染逻辑，**本身已是纯 ES5**，未参与转译
    polyfill 必须最先：Babel 的 useBuiltIns:false 只降语法不注入内建 API，
    降级后的库依然会调用 Object.assign / Array.from 等。
    ⛔ three.min.js / three-globe.min.js（ES6 原版）：**永久保留、永不删除、永不加载**。
       它们是 three.es5.js / three-globe.es5.js 的**比对基线**——转译产物出问题时，
       必须能逐字节 diff 回上游，以确认差异只来自「ES6→ES5 降级」而不来自库的版本漂移
       或误改。删掉它们就永久丧失这个能力；同理也**不要修改这两个文件的内容**，
       改了就失去比对意义。体积代价约 1.9MB 源资源（压缩后增量远小于此），换可回溯性。
    详见同目录 downlevel_libs.mjs（转译脚本 + 完整文件清单）与
         docs/technical-overview.md §10.201
  -->
  <div id="globe-container"></div>

  <script src="./polyfill.es5.js"></script>
  <script src="./three.es5.js"></script>
  <script src="./three-globe.es5.js"></script>
  <script src="./globe.js"></script>
</body>
</html>
