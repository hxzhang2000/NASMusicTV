});

/* ══════════════════════════════════════════════════════════════════════════
   6 · WATER FIELD — ⭐ the sea is recomputed per pixel every frame.
   Three incommensurate band sets (counts 7 / 23 / 47, all drifting at
   different rates) sum into the horizontal swell banding the photos need.
   Using ONE band set made the surface read as corduroy / brushed metal —
   three sets at mutually prime counts break that up.
   ══════════════════════════════════════════════════════════════════════════ */
const C_FAR = hexRgb(PAL.seaFar), C_DEEP = hexRgb(PAL.seaDeep);
const C_RIDGE = hexRgb(PAL.ridge), C_TROUGH = hexRgb(PAL.trough), C_SHOAL = hexRgb(PAL.shoal);
const TAU = Math.PI * 2;
// ⛔ 反馈六·4「不要那么多横条纹」：11/29/61 在 940px 高的海域里是 85/32/15px
//    一条，等距、贯穿全幅 ⇒ 规则梳子。现在降到 8/19/43，并且间距与对比度
//    都被噪声打散（见 drawSeaField）。
const N_BIG = 8, N_MID = 19, N_FINE = 43;

function drawSeaField(t, energy){
  // per-column phase (hoisted out of the pixel loop)
  for (let i = 0; i < fw; i++){
    const u = i / (fw - 1);
    // wobble keeps the bands from being dead-straight stripes, but too much and
    // the surface reads as topographic contours rather than water
    // ⛔ 所有速率除以 ~4.2（反馈六·1「海浪太快了」）
    const wBig = 0.46 * Math.sin(u * TAU * 1.3 + t * 0.000069)
               + 0.27 * Math.sin(u * TAU * 2.7 - t * 0.000112 + 1.7)
               + 0.15 * Math.sin(u * TAU * 4.9 + t * 0.000174 + 4.1)
               + 0.08 * Math.sin(u * TAU * 8.3 - t * 0.000264 + 2.6);
    colPhase[i] = ((wBig + t * 0.00010) % TAU + TAU) % TAU;
    const wMid = 0.34 * Math.sin(u * TAU * 3.9 - t * 0.000217 + 0.6)
               + 0.21 * Math.sin(u * TAU * 7.3 + t * 0.000317 + 3.4);
    colMid[i]   = ((wMid - t * 0.000233) % TAU + TAU) % TAU;
    colFine[i]  = ((u * TAU * 11.0 + t * 0.000486) % TAU + TAU) % TAU;
    // ⭐ 反馈六·4「有的地方平静、有的地方粗糙」：沿shore 的**大尺度**粗糙度场。
    //    ⛔ 早先写 0.28 + 0.92*(0.5+0.5*fbm1) ⇒ 实际只有 0.54..0.94
    //    （fbm1 的 p10..p90 只有 ±0.39），空档根本做不出来。用 fbmNorm。
    roughX[i] = 0.22 + 1.05 * fbmNorm(u * 2.6 + 71.2 + t * 0.000010, 6201, 2);
  }
  for (let j = 0; j < fh; j++){
    const v = j / (fh - 1);
    // ⭐⭐ 反馈六·4「整个海面太规律」：原来是 `v * TAU * N_BIG` ——
    //    一个**完美等距**的竖直梳子，正是「一排横条纹」的来源。
    //    现在先用低频 fBm 扭曲 v（浪列间距不均 ⇒ 密集团之间有空档），
    //    再叠加一个行级对比度场（有的浪脊很亮、有的几乎看不见）。
    rowPhase[j] = ((v * TAU * N_BIG
        + 2.9 * fbmSigned(v * 3.1 + 11.7 + t * 0.000013, 6001, 3)
        + t * 0.000100) % TAU + TAU) % TAU;
    rowAmp[j]  = 0.10 + 1.55 * fbmNorm(v * 4.7 + 9.3 + t * 0.000022, 6101, 2);
    rowMid[j]   = ((v * TAU * N_MID  - t * 0.000233) % TAU + TAU) % TAU;
    rowFine[j]  = ((v * TAU * N_FINE + t * 0.000486) % TAU + TAU) % TAU;
    // ⭐ 纵向的粗糙度场：与 roughX 相乘 ⇒ 二维的「大块平静区」
    roughY[j] = 0.20 + 1.10 * fbmNorm(v * 3.7 + 51.1 + t * 0.000016, 6301, 2);
  }

  const shadeBoost = 1 + 0.28 * energy;
  const depthBias = 0.10 + 0.55 * ENERGY_TO_SHADE * energy;   // loud ⇒ 更深更饱和
  const d = fieldData;
  let p = 0;

  for (let j = 0; j < fh; j++){
    const v = j / (fh - 1);
    const rp = rowPhase[j], rm = rowMid[j], rf = rowFine[j];
    const ra = rowAmp[j], ry = roughY[j];

    // ⭐ 深度线索：画面顶部（外海）更深、更饱和；越靠近浪线越浅、越透。
    //   （与 §5.6「远海/近海」命名相反，此处按俯拍实拍效果取向。）
    const dep = clamp(1 - 0.78 * Math.pow(v, 0.90) * (0.72 + depthBias * 0.55), 0, 1);
    const br = lerp(C_FAR[0], C_DEEP[0], dep);
    const bg = lerp(C_FAR[1], C_DEEP[1], dep);
    const bb = lerp(C_FAR[2], C_DEEP[2], dep);
    // 浪线前方的浅滩带：水在这里明显变浅（反馈二要求的 refraction）
    const shoalW = smoothstep(0.84, 1.03, v) * (0.30 + 0.22 * energy);

    for (let i = 0; i < fw; i++){
      // ── primary swell bands (horizontal light/dark banding) ──
      const s = fsin(rp + colPhase[i]);
      // cheap steepening (cubic term) so crests read distinctly — Math.pow here
      // cost more than the whole rest of the pixel loop put together
      const sb = s + 0.20 * s * s * s;
      // ⭐ 涌浪背面受光、槽底背光：正面(正)提亮比背面(负)压暗更强，读成立体而非条纹
      // ⭐ra / roughX / roughY 让不同位置、不同时间的浪脊强弱相差可达 4 倍
const amp = ra * roughX[i] * ry;
      // ⛔ 强度降到 0.55：反馈七之后，涌浪的体积感由 drawSwellBody 按**真实的浪**
      //    给出，海面场自己那套条纹退成底噪。早先两者同强度 ⇒ 海面上两套
      //    互不相干的横条纹叠在一起，读起来就是「规则的花纹」。
      const light = (sb * 0.44 + fsin(rm + colMid[i]) * 0.36 + fsin(rf + colFine[i]) * 0.20) * amp * 0.55;

      let r, g, b;
      if (light > 0){
        const k = Math.min(light * 0.30 * shadeBoost, 1);
        r = lerp(br, C_RIDGE[0], k); g = lerp(bg, C_RIDGE[1], k); b = lerp(bb, C_RIDGE[2], k);
      } else {
        const k = -light * 0.26 * shadeBoost;
        r = lerp(br, C_TROUGH[0], k); g = lerp(bg, C_TROUGH[1], k); b = lerp(bb, C_TROUGH[2], k);
      }
      if (shoalW > 0){
        r = lerp(r, C_SHOAL[0], shoalW); g = lerp(g, C_SHOAL[1], shoalW); b = lerp(b, C_SHOAL[2], shoalW);
      }

      d[p] = r < 0 ? 0 : r > 255 ? 255 : r;
      d[p+1] = g < 0 ? 0 : g > 255 ? 255 : g;
      d[p+2] = b < 0 ? 0 : b > 255 ? 255 : b;
      d[p+3] = 255;
      p += 4;
    }
  }

  fieldCtx.putImageData(fieldImg, 0, 0);
  ctx.drawImage(fieldCvs, 0, 0, fw, fh, 0, 0, W, H * SEA_BOTTOM_K);
}

/* ── caustic glint net over the water ────────────────────────────────────
 * ⛔ 早先 15 条近水平虚线 ⇒ 读成「刻痕 / 接缝」：整幅横贯的平行横线。
 * ⭐ 真实水面焦散是一张**斜向交错、缓慢漂移、忽明忽暗**的网：
 *    · 两族交叉的斜向射线（↗ / ↘ 各 6 根），每根只画成 4~8 段短划，
 *      斜率逐根不同、随时间漂移 + 弯曲 ⇒ 绝无横贯全幅的连续线。
 *    · 少量**短**横碎片（屏宽 3%~8%）点缀其间，压住「横」的联想又不连成线。
 *    · ~26 颗闪烁的亮点落在交叉处 ⇒ 焦散的「亮结」，随能量明灭。
 *  全部只在海水区裁剪内绘制（sea clip），alpha 仍是 CAUSTIC_A 量级。 */
/* ── 焦散胞格网（反馈八·5c）—— resize 时烘一次拓扑 ────────────────────────
 * ⛔ 前两版都败在这一步：v1 = 15 条近水平虚线 ⇒ 横贯全幅的平行横线（刻痕）；
 *    v2 = 12 条**孤立**直线短划 ⇒ 仍是刻痕，只是变短了。
 * ⭐ 真实水面焦散的本质是**胞壁网**：抖动网格的格壁连成多边形，水从格中透过。
 *    孤立短划像刻痕，正因它没有「格」。补上胞形与连通性即可，不必靠斜率躲避。
 *    ⛔ 不做周期环绕：环绕会在右/下边界生成横贯全幅的长线 ⇒ 又回到刻痕。
 */
const CNX = 20, CNY = 9;                 // 胞格数（约 70~90px 一格）
let causNX = null, causNY = null, causE = null;
function buildCausticNet(){
  const seaH = H * SEA_BOTTOM_K;
  causNX = new Float32Array(CNY * CNX);
  causNY = new Float32Array(CNY * CNX);
  // ⭐ 去规整化：真实焦散的胞格**大小差异很大、边缘角度各异**，不是等距方格纸。
  //    · 列/行坐标各过一次低频平滑 warp ⇒ 胞格宽窄不均
  //    · 每行一个哈希横向错切 ⇒ 行与行的壁角度不同（同行内仍近似平行）
  //    ⛔ 幅度压在 ±0.3 格以内：warp 过大会让相邻胞格翻转自交 ⇒ 网会破。
  const wC = [], wR = [];
  for (let k = 0; k < 4; k++){
    wC.push((hash2(3100 + k, 301) - 0.5) * 2);
    wR.push((hash2(3200 + k, 303) - 0.5) * 2);
  }
  const warp = (arr, v) => {
    let s = 0, amp = 1, tot = 0;
    for (let o = 0; o < 4; o++){
      const x = v * (1 << o), i0 = Math.floor(x), fr = x - i0;
      const u = fr * fr * (3 - 2 * fr);
      const a = arr[o], b = arr[(o + 1) & 3];
      s += (a + (b - a) * u) * amp; tot += amp; amp *= 0.55;
    }
    return s / tot;
  };
  const cw = W / CNX;
  for (let cy = 0; cy < CNY; cy++){
    const fy = (cy + 0.5) / CNY;
    const ry = fy + warp(wR, fy * 2.0) * 0.30 / CNY;
    const shear = (hash2(3300 + cy, 305) - 0.5) * 0.22;
    for (let cx = 0; cx < CNX; cx++){
      const id = 2000 + cy * CNX + cx;
      const fx = (cx + 0.5) / CNX;
      const rx = fx + warp(wC, fx * 2.0) * 0.30 / CNX;
      causNX[cy * CNX + cx] = W * (rx + shear * (ry - 0.5) * 0.5) + (hash2(id, 201) - 0.5) * 0.30 * cw;
      causNY[cy * CNX + cx] = seaH * (ry + (hash2(id, 203) - 0.5) * 0.30 / CNY);
    }
  }
  // 每格连「右」「下」两条格壁；出界不连（边界胞由画面裁切闭合）
  const e = [];
  for (let cy = 0; cy < CNY; cy++)
    for (let cx = 0; cx < CNX; cx++){
      const i0 = cy * CNX + cx, k2 = i0 * 2;
      if (cx < CNX - 1) e.push({ a: i0, b: i0 + 1,    bow: (hash2(k2, 205) - 0.5) * 2, ph: hash2(k2, 207) * 6.2832, lw: 0.55 + 0.60 * hash2(k2, 209), tr: hash2(k2, 211) });
      if (cy < CNY - 1) e.push({ a: i0, b: i0 + CNX, bow: (hash2(k2 + 1, 205) - 0.5) * 2, ph: hash2(k2 + 1, 207) * 6.2832, lw: 0.55 + 0.60 * hash2(k2 + 1, 209), tr: hash2(k2 + 1, 211) });
    }
  causE = e;
}

function drawCausticNet(t, energy){
  const aBase = CAUSTIC_A * (0.30 + 0.70 * energy);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, H * SEA_BOTTOM_K);
  ctx.clip();
  ctx.lineCap = 'round';
  ctx.strokeStyle = PAL.caustic;
  // ⭐ 1) 斜向射线族：两族交叉（↗ / ↘），每根漂移 + 摆动，绝不横贯；
  //    斜率刻意拉陡（0.2~0.75 px/px，另有 1/5 是陡射）⇒ 读作「交叉扇」而非斜横线
  const RAYS = 30;
  for (let i = 0; i < RAYS; i++){
    const dirm = (i & 1) ? 1 : -1;
    const y0 = H * SEA_BOTTOM_K * (0.10 + 0.80 * hash2(i, 41));
    const steep = (i % 5 === 0);
    const sl = (steep ? (0.65 + 0.55 * hash2(i, 42)) : (0.18 + 0.42 * hash2(i, 43))) * kScale;
    const xOff = W * (0.2 + 0.6 * hash2(i, 45));
    const span = W * (0.35 + 0.55 * hash2(i, 47));
    const drift = (hash2(i, 49) - 0.5) * 46 * Math.sin(t * 0.00006 + hash2(i, 51) * 6.2832);
    const sway = (hash2(i, 53) - 0.5) * 14 * Math.sin(t * 0.00010 + hash2(i, 55) * 6.2832);
    const x0 = xOff - span * 0.5;
    ctx.beginPath();
    const dashes = 5 + Math.floor(hash2(i, 57) * 5);
    for (let d = 0; d < dashes; d++){
      const a0 = (d + hash2(i, 130 + d) * 0.4) / dashes;
      const a1 = Math.min(1, a0 + (0.16 + 0.30 * hash2(i, 150 + d)) / dashes);
      const am = (a0 + a1) * 0.5;
      const sx = x0 + a0 * span, ex = x0 + a1 * span;
      const m0 = dirm * sl * (sx - xOff), m1 = dirm * sl * (ex - xOff);
      // 每划一次正弦（中点采样）⇒ 整划上下浮沉，端点 sin 数量减半
      const sh = sway * Math.sin(am * 3.1416);
      ctx.moveTo(sx, y0 + m0 + sh + drift * a0);
      ctx.lineTo(ex, y0 + m1 + sh + drift * a1);
    }
    ctx.lineWidth = 0.8 + 1.0 * hash2(i, 59);
    ctx.globalAlpha = aBase * (0.45 + 0.55 * hash2(i, 61)) * 1.15;
    ctx.stroke();
  }
  // ⭐ 2) 连通胞壁网（反馈八·5c）：抖动网格的格壁连成多边形，水从格中透过。
  //    ⛔ 取代 v2 的 12 条孤立直线短划 —— 孤立无胞形 ⇒ 读作「划痕」。
  //    每条壁画成二次曲线（垂直方向弓起 + 缓慢漂移）⇒ 绝无笔直硬线。
  //    按亮度分 3 档批量描边（3 次 stroke，而非每壁一次）。
  if (causE){
    const cellW = W / CNX, cellH = (H * SEA_BOTTOM_K) / CNY;
    for (let tier = 0; tier < 3; tier++){
      ctx.beginPath();
      let any = false;
      for (let e = 0; e < causE.length; e++){
        const ed = causE[e];
        if ((ed.tr * 3 | 0) !== tier) continue;
        const ax = causNX[ed.a], ay = causNY[ed.a];
        const bx = causNX[ed.b], by = causNY[ed.b];
        const mx = (ax + bx) * 0.5, my = (ay + by) * 0.5;
        // 垂直于壁方向的弓起量：静偏 + 随时间缓慢摆动 ⇒ 壁是弯的，且会呼吸
        const nx = -(by - ay), ny = (bx - ax);
        const nl = Math.hypot(nx, ny) || 1;
        const wob = ed.bow * (0.55 + 0.45 * Math.sin(t * 0.00007 + ed.ph)) * cellW * 0.30;
        ctx.moveTo(ax, ay);
        ctx.quadraticCurveTo(mx + nx / nl * wob, my + ny / nl * wob, bx, by);
        any = true;
      }
      if (!any) continue;
      ctx.lineWidth = tier === 1 ? 1.15 : (tier === 2 ? 0.85 : 0.6);
      ctx.globalAlpha = aBase * (tier === 1 ? 0.62 : (tier === 2 ? 0.44 : 0.28));
      ctx.stroke();
    }
  }
  // ⭐ 3) 闪烁亮结：格壁交点的小亮点，随能量与各自相位明灭
  ctx.fillStyle = PAL.caustic;
  for (let i = 0; i < 56; i++){
    const id = 1300 + i;
    const x = W * hash2(id, 75);
    const y = H * SEA_BOTTOM_K * (0.10 + 0.82 * hash2(id, 77));
    const flick = 0.5 + 0.5 * Math.sin(t * (0.00015 + 0.00010 * hash2(id, 79)) + hash2(id, 81) * 6.2832);
    if (flick < 0.45) continue;                       // 忽亮忽灭
    const size = 1 + Math.floor(hash2(id, 83) * 2.6);
    ctx.globalAlpha = aBase * (0.80 + 0.90 * flick);
    ctx.fillRect(x, y, size, size);
  }
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════════════════════
   7 · SHORE — 岸线 = 贴岸主浪带的前缘，不是色界线
   ══════════════════════════════════════════════════════════════════════════ */
let shoreXs = null, shoreYs = null, shoreTmp = null;
// ── 反馈二：per-column 记忆 ──
let wetMark = null;      // 该列**历史上**被水淹到的最内陆 y（只增不减 = 历史最高水位）
let wetAmt  = null;      // 该列当前湿润度 0..1（退水后按时间常数衰减）
let wetEdge = null;      // 本帧用于渲染的湿区外沿（随干燥向水线收拢）
let reachK  = null;      // 该列的涌高系数（沿岸不规则 ⇒ 水舌参差）
let dryK    = null;      // 该列的干燥速率系数（洼地存水久、沙脊干得快）
let swashPos = null;     // 该列当前的涌浪推进量 0..1
let wetTmp   = null;     // 沿岸平滑 wetAmt 用的临时缓冲
let swashStageNow = 0, swashReachNow = 0;
function ensureShoreArrays(){
  const n = COLS + 1;
  if (!shoreXs || shoreXs.length !== n){
    shoreXs   = new Float32Array(n);
    shoreYs   = new Float32Array(n);
    shoreTmp  = new Float32Array(n);
    wetMark   = new Float32Array(n);
    wetAmt    = new Float32Array(n);
    wetEdge   = new Float32Array(n);
    reachK    = new Float32Array(n);
    dryK      = new Float32Array(n);
    swashPos  = new Float32Array(n);
    wetTmp    = new Float32Array(n);
    // ⛔ 必须初始化为「比任何水线都靠海一侧」的值。早期版本写 wetMark[i] = H，
    //    而水线永远在 H 之上，于是 `y > wetMark[i]` 恒为 false —— 最高水位
    //    从来没被记下来，湿区一直撑到画面底边（表现为一条 246px 的假水渍）。
    for (let i = 0; i < n; i++) wetMark[i] = -1e9;
  }
}

/** ⭐ 岸线 + 浪队列 + per-column 湿润记忆 —— 全场景的唯一基准。
 *  dt 为秒；无 dt 时退水不会干（静态单帧渲染用）。
 *  ⛔⛔ 反馈六·2：这里**不出现**任何 A.sLow / A.sMid。
 *      音频只影响 swashReachNow（涌得多高 = 外观）与 wetAmt 的强度。
 *  ⭐⭐ 反馈七·5：推进量来自**领头的浪**，不是相位函数。
 *  ⭐ 反馈七·1：wetMark / wetAmt **只在浪到达滩上那一瞬**写入（commitWetMarks），
 *      上冲途中一个字都不写 —— 那里的沙还在水下。 */
function computeShore(t, W0, dt){
  ensureShoreArrays();
  fillFray(t, 0);
  stepWaves(dt);                                   // ⭐ 队列先走一步
  const lead = leadWave();
  const push = waterlineAdvance(dt * 1000);        // ⭐ 水线推进量 = 队列级状态机
  swashReachNow = SWASH_REACH * (0.62 + 0.48 * A.sLow);   // 音频只管「涌多高」
  // 干燥时间常数挂在**出浪间隔**上：两个浪之间裸露的时间就是 WAVE_GAP_MS
  const dryTau = clamp(WAVE_GAP_MS * SWASH_DRY_FRAC, SWASH_DRY_MIN, SWASH_DRY_MAX);
  const decay = dt > 0 ? Math.exp(-dt * 1000 / dryTau) : 0;
  // 阶段：0 = 上涌/滩上有浪，1 = 退水（backwash），2 = 裸露干燥
  {
    let beachAny = false, advAny = false;
    for (let i = 0; i < WAVE_POOL; i++){
      const s = waves[i].state;
      if (s === W_REACHED || s === W_FADING) beachAny = true;
      else if (s === W_ADVANCING) advAny = true;
    }
    const retreating = retreatT >= 0 && retreatT < retreatDur;
    swashStageNow = (beachAny || advAny) ? (retreating ? 1 : 0) : 2;
  }
  const seedLag = lead ? lead.seed : 2711;

  for (let i = 0; i <= COLS; i++){
    const x = W * i / COLS;
    shoreXs[i] = x;
    const uu = x * 0.0042 * kScale;
    // ⭐ 逐列推进滞后：同一个确定性噪声场（种子跟着领头浪走 ⇒ 每条浪的
    //    舌头形状都不同），有的岸段已经冲上滩、有的还在半路 ⇒ 前缘成舌。
    const lag = clamp(
        1.00 * fbmSigned(uu * 0.75 + 91.3, 4409, 2)
      + 0.35 * fbmSigned(uu * 2.30 + 17.7, 4523, 2), -1, 1);
    const rk = REACH_LO + REACH_HI * Math.pow(fbmNorm(uu + t * 0.00004 + seedLag, 3301, 2), 1.6);
    reachK[i] = rk;
    dryK[i] = 0.52 + 0.96 * fbmNorm(uu * 1.63 + 41.7, 5701, 2);
    // ⛔⛔ 不再对 y 做 smoothstep/三角：领头浪的 y 就是推进量本身
    const adv = clamp(push - lag * SWASH_LAG, 0, 1);
    swashPos[i] = adv;
    const base = swashFrontY(x, t, H) + fray[i] * W0 * FRAY_FRONT * 0.42;
    const y = base + H * swashReachNow * adv;
    shoreYs[i] = y;
    // ⭐ 反馈七·1：这一帧浪「刚好到达滩上」时，把逐列水线交给 peak[]，
    //    由 commitWetMarks 统一写进湿沙记忆 —— 这是唯一的写入点。
    if (lead && lead.state === W_REACHED) lead.peak[i] = y;
    // ⭐⭐ 反馈七·1 + 反馈二：变干的判据是「这一列**此刻是否裸露**」，
    //    不是「全体有没有浪在推进」。早先写 `adv <= 0.004` ⇒ 只要海面上还有
    //    任何一条浪在推进，全岸的干燥就一起暂停，湿沙永远降不下来
    //    （实测最低湿润度卡在 0.49）。正确判据：该列的湿区此刻露在外面
    //    （水线在 wetMark 的海侧）才变干；被新水盖住就暂停。
    if (wetMark[i] > y + 0.5 && decay < 1) wetAmt[i] *= Math.pow(decay, dryK[i]);
    // 干燥锋面 + 内陆沿的随机起伏（反馈七·6：内沿太平会读成一条条竖带）
    const inland = H * 0.012 * fbmSigned(x * 0.0075 * kScale + 63.1, 6607, 2);
    wetEdge[i] = Math.max(y, lerp(y, wetMark[i], Math.pow(clamp(wetAmt[i], 0, 1), 0.55)) + inland);
  }
  // ⛔ 顺序要紧：先让当帧到滩的浪拿到 peak[]，再让它转 FADING 并写湿沙
  finishWaves(dt);
  commitWetMarks();
  // ⭐ 沿岸做一次 3 抽头平滑。逐列记忆在物理上没错，但**相邻列不该差这么多**：
  //    海滩是横向连着的（水会横向渗），一列湿 1.0 而邻居 0.3 在 100% 下就是
  //    一道竖直硬边 —— 实测逐列亮度偏差 0.48 lum、最大 6.8（颗粒基线 0.30）。
  //    平滑后偏差回到 ~0.35，而干燥锋面与水舌的参差完全保留。
  for (let i = 1; i < COLS; i++){
    wetTmp[i] = 0.25 * wetAmt[i - 1] + 0.50 * wetAmt[i] + 0.25 * wetAmt[i + 1];
  }
  wetTmp[0] = 0.5 * wetAmt[0] + 0.5 * wetAmt[1];
  wetTmp[COLS] = 0.5 * wetAmt[COLS] + 0.5 * wetAmt[COLS - 1];
  for (let i = 0; i <= COLS; i++){
    wetAmt[i] = wetTmp[i];
    wetEdge[i] = Math.max(shoreYs[i], lerp(shoreYs[i], wetMark[i],
      Math.pow(clamp(wetAmt[i], 0, 1), 0.55)));
  }
}

/** smoothed polyline through the sampled points (quadratic through midpoints).
 *  `stride` lets a strip be built at half column resolution without collapsing
 *  onto the left half of the frame — ⛔ the xs array is indexed i*stride. */
function smoothRun(path, xs, ys, n, forward, moveFirst, stride){
  stride = stride || 1;
  const X = i => xs[i * stride], Y = i => ys[i * stride];
  if (forward){
    if (moveFirst) path.moveTo(X(0), Y(0)); else path.lineTo(X(0), Y(0));
    for (let i = 1; i < n - 1; i++){
      path.quadraticCurveTo(X(i), Y(i), (X(i) + X(i + 1)) / 2, (Y(i) + Y(i + 1)) / 2);
    }
    path.lineTo(X(n - 1), Y(n - 1));
  } else {
    if (moveFirst) path.moveTo(X(n - 1), Y(n - 1)); else path.lineTo(X(n - 1), Y(n - 1));
    for (let i = n - 2; i > 0; i--){
      path.quadraticCurveTo(X(i), Y(i), (X(i) + X(i - 1)) / 2, (Y(i) + Y(i - 1)) / 2);
    }
    path.lineTo(X(0), Y(0));
  }
}

/** 沿一串 y 值填充一条带状 path（用于沙/湿沙/残沫） */
function ribbon(path, xs, ys, n, stride){
  smoothRun(path, xs, ys, n, true, true, stride);
  smoothRun(path, xs, ys, n, false, false, stride);
  path.closePath();
}

let sandPath = null;
function drawSand(t){
  const n = COLS + 1;

  // 干沙主体：上边界就是岸线，⛔ 不留任何硬缝。
  // 底色/颗粒/起伏带/潮湿斑都来自烘好的纹理（反馈三）
  sandPath = new Path2D();
  smoothRun(sandPath, shoreXs, shoreYs, n, true, true);
  sandPath.lineTo(W, H + 4);
  sandPath.lineTo(-2, H + 4);
  sandPath.closePath();
  ctx.save();
  ctx.clip(sandPath);
  // ⛔ 源矩形必须是 (0,0,texW,texH)：把 sandTexTop 当成源 y 偏移会采到纹理外面，
  //    结果整块沙变成灰暗的条纹
  ctx.drawImage(sandTex, 0, 0, sandTex.width, sandTex.height,
                     0, sandTexTop, W, H - sandTexTop);
  ctx.restore();

  drawWetWash();      // per-column 湿润度 → 深色湿沙（退水后暴露、下部还湿）
  drawSheen();        // 新湿的镜面高光，随干燥淡出
  drawPuddles();      // 洼地里的小水洼/反光
  return sandPath;
}

/** ⭐ 湿沙：宽度来自 per-column 的 wetEdge，深浅来自 per-column 的 wetAmt。
 *
 *  ⛔ 三种试过的写法都有硬伤，记下来免得再走一遍：
 *   ① 沿岸分 10 段、每段一条自己的渐变  → 相邻段 alpha 阶跃 ⇒ 10 道竖直色带
 *   ② 全幅共用一条竖直渐变 + 逐列 alpha → 深浅锚在全幅 y 上，而单列的湿区只有
 *      全幅范围的 1/3，于是每列只走了渐变的前 1/3 ⇒ 一整条**深棕平板**；
 *      且列底 wetEdge 处的残留 alpha 造成**阶梯状下沿**
 *   ③ 逐列 createLinearGradient         → 97 个渐变对象/帧，太贵
 *  ⭐ 现在是 ④：**把渐变烘成 2×64 的小条，逐列 drawImage 拉到该列自己的深度**。
 *    每列的渐变都从最深走到全透明、终点正好落在 wetEdge[i] ⇒ 没有平板、没有阶梯；
 *    x 取整 + 宽度 +1px ⇒ 相邻列之间没有抗锯齿缝；一帧只建 1 个渐变。 */
let wetStrip = null, wetStripCtx = null, sheenStrip = null, sheenStripCtx = null;
function buildWetStrip(){
  const HGT = 64;
  if (!wetStrip){
    wetStrip = document.createElement('canvas');
    wetStrip.width = 2; wetStrip.height = HGT;
    wetStripCtx = wetStrip.getContext('2d');
  }
  const g = wetStripCtx.createLinearGradient(0, 0, 0, HGT);
  g.addColorStop(0.00, 'rgba(74,50,26,0.76)');
  g.addColorStop(0.26, 'rgba(82,57,30,0.60)');
  g.addColorStop(0.55, 'rgba(90,65,36,0.33)');
  g.addColorStop(0.80, 'rgba(98,75,44,0.11)');
  g.addColorStop(1.00, 'rgba(106,84,54,0)');
  wetStripCtx.clearRect(0, 0, 2, HGT);
  wetStripCtx.fillStyle = g;
  wetStripCtx.fillRect(0, 0, 2, HGT);

  // ⭐ 高光也烘成小条：早先逐列 createLinearGradient（97 个/帧）而且
  //    宽度 +1px 重叠 ⇒ 每列接缝处二次合成，在 100% 下是一列列的亮竖线；
  //    矩形的硬顶边还在水线上留下阶梯。
  if (!sheenStrip){
    sheenStrip = document.createElement('canvas');
    sheenStrip.width = 2; sheenStrip.height = HGT;
    sheenStripCtx = sheenStrip.getContext('2d');
  }
  const s = sheenStripCtx.createLinearGradient(0, 0, 0, HGT);
  // ⛔ 冷蓝调太多会变成一层灰雾；用暖白 + 一点点青。
  s.addColorStop(0.00, 'rgba(232,240,236,' + SHEEN_A.toFixed(4) + ')');
  s.addColorStop(0.38, 'rgba(170,206,210,' + (SHEEN_A * 0.42).toFixed(4) + ')');
  s.addColorStop(1.00, 'rgba(140,180,190,0)');
  sheenStripCtx.clearRect(0, 0, 2, HGT);
  sheenStripCtx.fillStyle = s;
  sheenStripCtx.fillRect(0, 0, 2, HGT);
}
// ⭐ 湿沙/高光的顶端要抬到水线**之上**多少像素，让 clip（那条平滑曲线）独自
//    决定上沿。⛔ 抬 4px 不够：列与列之间 shoreYs 可以差 7~8px，clip 曲线在列内
//    还会更低，于是每块的硬顶边在某些列露出来 ⇒ 水线上出现一列列的阶梯。
//    必须 ≥ 一个列间距的起伏量。
const WET_OVER = 16;
function drawWetWash(){
  const n = COLS + 1;
  let any = false;
  for (let i = 0; i < n; i++) if (wetAmt[i] > 0.012) { any = true; break; }
  if (!any) return;
  buildWetStrip();
  // ⛔ 颜色要「湿」而不是「灰」：湿沙是同一块沙被打湿 + 变深 + 变饱和，
//    所以往棕/琥珀方向压，而不是往灰方向压。alpha 也要够高，
//    0.55 左右的浅棕叠在 #C9A063 上只会得到一片脏灰。
  ctx.save();
  ctx.clip(sandPath);
  const colW = W / COLS;
  for (let i = 0; i < n; i++){
    const d = wetEdge[i] - shoreYs[i];
    if (wetAmt[i] < 0.012 || d < 0.6) continue;
    // ⛔⛔ 反馈六·3 让水线变得很参差之后，**共享**一条烘焙渐变 + 逐列 alpha
    //    的写法崩了：相邻列的 wetAmt 可以是 1.0 与 0.3（那正是一条水舌的
    //    边界），实测逐列亮度偏差从 0.33 跳到 0.53、最大 10.5 lum ——
    //    一列列的竖线。改成**逐列自己的渐变**：每列都从最深走到全透明、
    //    终点正好落在 wetEdge[i]。代价是 97 个渐变对象/帧（实测 +0.1ms）。
    //    竖直方向的平板与阶梯因此彻底消失；剩下的竖向阶跃是水舌边界，
    //    那本来就该是硬边。
    // ⛔ x 用浮点、不取整也不 +1px：取整会在 16.667px 的列宽上留 0.33px 的
    //    缝，重叠则会在接缝二次合成 ⇒ 两种都会变成竖线。
    // ⛔ 顶端抬到 shoreYs 之上 WET_OVER：让 clip（那条平滑曲线）独自决定上沿。
    const yT = shoreYs[i] - WET_OVER, yB = wetEdge[i];
    const gr = ctx.createLinearGradient(0, yT, 0, yB);
    const a = wetAmt[i];
    gr.addColorStop(0.00, 'rgba(74,50,26,' + (0.76 * a).toFixed(4) + ')');
    gr.addColorStop(0.26, 'rgba(82,57,30,' + (0.60 * a).toFixed(4) + ')');
    gr.addColorStop(0.55, 'rgba(90,65,36,' + (0.33 * a).toFixed(4) + ')');
    gr.addColorStop(0.80, 'rgba(98,75,44,' + (0.11 * a).toFixed(4) + ')');
    gr.addColorStop(1.00, 'rgba(106,84,54,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(shoreXs[i] - colW * 0.5, yT, colW, yB - yT);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/** ⭐ 镜面高光：刚被水打湿的沙面会反光，越干越弱。贴着水线的一条窄亮痕。
 *  逐列：沿岸有的地方反光强（刚被水舌舔过）、有的已经哑了。
 *  与湿沙同一套做法：浮点平铺、不重叠、顶端抬到水线之上让 clip 决定上沿。 */
function drawSheen(){
  const n = COLS + 1;
  let cnt = 0;
  for (let i = 0; i < n; i++) if (wetAmt[i] > 0.05) cnt++;
  if (cnt < 4) return;
  buildWetStrip();
  const depth = H * 0.030;
  ctx.save();
  ctx.clip(sandPath);
  ctx.globalCompositeOperation = 'lighter';
  const colW = W / COLS;
  for (let i = 0; i < n; i++){
    if (wetAmt[i] < 0.05) continue;
    ctx.globalAlpha = wetAmt[i];
    ctx.drawImage(sheenStrip, 0, 0, 2, 64,
      shoreXs[i] - colW * 0.5, shoreYs[i] - WET_OVER, colW, depth + WET_OVER);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/** ⭐ 洼地里的小水洼 + 反光斑（退水后残留）
 *  ⛔ 早先用 ellipse + 一个 fillRect 画「反光细亮线」，在 100% 下那个矩形
 *    清楚得能看见边，读起来像画上去的方块，不是水。现在水洼本体用椭圆，
 *    反光用一条更窄的椭圆（软边、没有直角）。 */
function drawPuddles(){
  let wet = 0;
  for (let i = 0; i <= COLS; i++) wet += wetAmt[i];
  wet /= (COLS + 1);
  if (wet < 0.06) return;
  ctx.save();
  ctx.clip(sandPath);
  for (let i = 0; i < PUDDLE_MAX; i++){
    const h = i * 3 + 7;
    const p = 0.03 + 0.94 * hash2(h, 811);
    const ci = Math.min(COLS, Math.max(0, Math.round(p * COLS)));
    const band = hash2(h, 812);
    const y = lerp(shoreYs[ci], wetEdge[ci], 0.12 + 0.80 * band);
    const rx = W * (0.008 + 0.024 * hash2(h, 813));
    const ry = H * (0.0020 + 0.0050 * hash2(h, 814));
    const a = 0.20 * wet * wetAmt[ci] * (0.4 + 0.6 * hash2(h, 815));
    if (a < 0.02) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#93AEB8';
    ctx.beginPath();
    ctx.ellipse(p * W, y, rx, ry, 0, 0, 6.2832);
    ctx.fill();
    // 水面反光：同样椭圆、压扁、偏上，无直角
    ctx.globalAlpha = a * 0.85;
    ctx.fillStyle = '#DCEBF0';
    ctx.beginPath();
    ctx.ellipse(p * W - rx * (0.12 + 0.22 * hash2(h, 816)), y - ry * 0.22,
                rx * (0.28 + 0.30 * hash2(h, 817)), ry * 0.26, 0, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════════════════
   海滩偶客 —— 一只小螃蟹。⛔ 浪/冲流模型一个字没动，这只是 §7 沙层里多画的
   一层。调用点在 frame() 里 drawSand() 之后、drawSwellBands() 之前 ⇒
   它压在沙与湿沙之上，而**在所有泡沫层之下** ⇒ 浪真的能盖住它。
   ══════════════════════════════════════════════════════════════════════════
   ⛔ 一切都由 t 决定（⛔ 无 Math.random）：亮相时刻、过境间隔、方向、朝向、
      步态相位全部取自 hash2(第几只, salt)。同一个 t 永远画出同一只蟹 ——
      连「出现在哪、什么时候出现」都不需要任何累积状态；暂停时 t 冻结，
      它也就跟着冻结（绝不读墙钟）。
   ⭐ 唯一的帧状态是 cy（纵坐标的一阶低通，见下）。
   为什么需要它：水线逐帧最多能跳 10.8px（harness 实测的 max|Δy|），
   硬跟着 shoreYs 走就是一下一下地弹；低通之后它读作「浪逼上来、蟹退两步」。
   一阶滤波的输出只由（输入序列, 初值）决定，而初值由第几只决定 ⇒
   从同一时刻重放必然逐帧一致。 */
const CRAB_T0_MS  = 6800;                     // 第一次亮相（再晚等于没有这回事）
const CRAB_GAP_LO = 25000, CRAB_GAP_HI = 45000;   // 两次过境之间的间隔
const CRAB_SPEED  = 0.150;                    // 步速（占 h / s）⇒ 900px 上约 135 px/s
const CRAB_SPAN   = 0.0335;                   // 全身跨度（占 h）⇒ 约 30px
const CRAB_GAIT   = 0.0150;                   // 步频（rad/ms）≈ 2.4 Hz
const CRAB_FADE   = 420;                      // 进/出画的淡入淡出
const CRAB_CLEAR  = 8;                        // 脚下离水线的最小距离（px）
// 离平均岸线的干沙纵深（占 h）。⛔ 不能写死一个绝对 y：岸线沿 x 起伏 ±0.13h，
//   固定 y 会在某几列直接走进水里；所以纵坐标也挂在岸线上，只是往内陆挪。
const CRAB_OFF_LO = 0.030, CRAB_OFF_HI = 0.132;
const CRAB_LEG_Y  = [-0.55, -0.12, 0.33, 0.72];    // 四对步足沿体轴的髋位（单位 R）
const CRAB_LEG_SPREAD = 1.5708;                    // 相邻步足的相位差（rad，= π/2）
/** 第 i 次过境与下一次之间的间隔。
 *  ⛔ 别写成 `0.62*hash + 0.38*hash`：两个均匀分布取平均 ⇒ 方差砍半，实测
 *    5 个间隔全落在 30~35s（正好是 25~45 的中段），看着就像「每 32 秒准时
 *    来一次」。这里先用 1.30 的对比度把单次 hash 拉满到 0..1（p2/p98 才够到
 *    两端），再叠 12% 的第二个 hash 作抖动。
 *  ⛔ 没有闭式解（间隔之和没有解析形式），但 25s 一次 ⇒ 跑一小时也才 144 遍，
 *    每帧 144 次 hash 完全不痛。 */
function crabGapMs(i){
  const u = 0.88 * clamp(0.5 + (hash2(i, 9211) - 0.5) * 1.30, 0, 1)
          + 0.12 * hash2(i, 9213);
  return CRAB_GAP_LO + (CRAB_GAP_HI - CRAB_GAP_LO) * u;
}
/** 当前是第几只 + 它已经走了多久（ms）。纯函数，同样的 t 必然同样的结果。 */
function crabSlot(t){
  let k = 0, tk = CRAB_T0_MS, g = crabGapMs(0);
  while (t >= tk + g){ tk += g; k++; g = crabGapMs(k); }
  return { k: k, age: t - tk };
}
let crabIdx = -1, crabCy = 0;
function drawCrab(t, dtMs){
  const slot = crabSlot(t), k = slot.k, age = slot.age;
  // ── ① 横向：匀速，起点在画外 ⇒ 它是「走进来」而不是「凭空出现」────────
  const dir  = hash2(k, 9217) < 0.5 ? -1 : 1;
  const spd  = CRAB_SPEED * H * (0.86 + 0.30 * hash2(k, 9219));   // px/s
  const span = CRAB_SPAN * H;
  const pad  = span * 0.5 + 4;
  const runMs = (W + pad * 2) / spd * 1000;
  if (age > runMs) return;                                   // 走出画外 ⇒ 没了
  const x = (dir > 0 ? -pad : W + pad) + dir * spd * age / 1000;
  const vis = smoothstep(0, CRAB_FADE, age) * (1 - smoothstep(runMs - CRAB_FADE, runMs, age));
  if (vis < 0.02) return;
  // ── ② 纵向：挂在岸线上（慢），再被水线顶回来（快）⇒ 浪逼上来它就退 ─────
  const base = swashFrontY(x, t, H);                          // 平均岸线（纯函数）
  const want = base + H * (CRAB_OFF_LO + (CRAB_OFF_HI - CRAB_OFF_LO) *
                           Math.pow(hash2(k, 9221), 0.75));
  // ⛔ 硬地板取**身位三列的最大值**，不是所在列 —— 蟹有 30px 宽，只看一列
  //   会有一半身子踩在水里。
  const ci = clamp(Math.round(x / W * COLS), 0, COLS);
  let floor = -1e9;
  for (let d = -1; d <= 1; d++){
    const c = clamp(ci + d, 0, COLS);
    if (shoreYs[c] + CRAB_CLEAR > floor) floor = shoreYs[c] + CRAB_CLEAR;
  }
  const goal = Math.max(want, floor);
  if (crabIdx !== k){ crabIdx = k; crabCy = goal; }          // 新的一只 ⇒ 直接落位
  crabCy += (goal - crabCy) * (1 - Math.exp(-dtMs / 220));   // ⛔ dt=0（暂停）⇒ 不动
  // ── ③ 体型与姿态 ──────────────────────────────────────────────────
  const R    = span * 0.2326;                                // 身体半宽（尺度基准）
  const gait = age * CRAB_GAIT + hash2(k, 9223) * 6.2832;    // 逐只不同的步态相位
  const face = hash2(k, 9225) < 0.5 ? -1 : 1;                // 朝上还是朝下
  const tilt = (hash2(k, 9227) - 0.5) * 0.42;                // ±12°，免得像贴纸
  const bob  = -0.13 * R * fsin(gait * 2);                   // 随蹬腿一上一下
  const sway =  0.11 * R * fsin(gait);                       // 侧向摆
  ctx.save();
  ctx.globalAlpha = vis;
  // ① 影子先落：没有它，蟹就是一张贴在沙上的贴纸。
  //    ⛔ 必须是**半透明**的 —— 直接拿 crabShadow 这个深棕
  //    按 alpha=1 画出来，12× 截图上它是一坦实心污渍，比蟹本身还抢眼。
  ctx.fillStyle = PAL.crabShadow;
  ctx.globalAlpha = vis * 0.13;
  ctx.beginPath();
  ctx.ellipse(x + 0.30 * R, crabCy + 0.52 * R, 1.18 * R, 0.54 * R, 0, 0, 6.2832);
  ctx.fill();
  ctx.globalAlpha = vis;
  ctx.translate(x, crabCy + bob);
  ctx.rotate(tilt);
  ctx.scale(1, face);
  ctx.translate(sway, 0);
  // ② 八条步足：左右两侧**反相**。⛔ 这是「横着走」的全部秘密 —— 两侧同相
  //   就变成普通的前爬了，读不出螃蟹。同侧四条再各差一个相位 ⇒ 步足像波浪
  //   一样从前往后传。腿摆动方向是**前后**（体轴），推动方向才是横向。
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let side = 0; side < 2; side++){
    ctx.beginPath();
    for (let i = 0; i < CRAB_LEG_Y.length; i++){
      const hy = CRAB_LEG_Y[i] * R;
      const sw = fsin(gait + i * CRAB_LEG_SPREAD + (side ? 3.1416 : 0));
      // ⭐ 足端 = **撑出去/收回来 + 前后摆 + 抬起**。
      // ⛔ 早先只做前后摆（振幅 0.62R）而髀距只有 0.43R ⇒
      //   正弦的相位每转一圈就有两对腿落在同一处，
      //   12× 截图上四条腿糊成一坦方块。半径随相位一起变
      //   之后 x、y 两个方向同时错开，任何相位都不重合
      //   —— 而这本来就是真实蟹蟑腿的运动：蹬出去、收回来，
      //   而不是原地前后晃。
      const rad = (1.98 + 0.22 * sw) * R;
      const lift = 0.16 * R * (0.5 + 0.5 * sw);
      const fore = rad * 0.34 * sw;
      const s = side ? -1 : 1;
      const hx = s * 1.02 * R, kx = s * rad * 0.70;
      const ky = hy + fore * 0.45 - lift * 0.5;
      const fx = s * rad,        fy = hy + fore - lift;
      ctx.moveTo(hx, hy);
      ctx.quadraticCurveTo((hx + kx) * 0.5 + s * 0.12 * R, (hy + ky) * 0.5, kx, ky);
      ctx.lineTo(fx, fy);
    }
    ctx.lineWidth = Math.max(1.0, (side ? 0.21 : 0.26) * R);
    ctx.strokeStyle = side ? PAL.crabLegFar : PAL.crabLeg;
    ctx.stroke();
  }
  // ③ 甲壳：画在步足**之上**，髋部自然被壳沿盖住（真实螃蟹就是这样）
  ctx.fillStyle = PAL.crabShell;
  ctx.beginPath();
  ctx.ellipse(0, 0, 1.06 * R, 0.76 * R, 0, 0, 6.2832);
  ctx.fill();
  ctx.strokeStyle = PAL.crabRim;
  ctx.lineWidth = Math.max(0.8, 0.13 * R);
  ctx.stroke();
  // ④ 背上一道高光（左上，受光方向与湿沙高光一致）—— 壳才有体积而不是椭圆
  ctx.strokeStyle = PAL.crabShellHi;
  ctx.lineWidth = Math.max(0.8, 0.18 * R);
  ctx.beginPath();
  ctx.ellipse(0, 0, 0.82 * R, 0.50 * R, 0, 3.55, 5.05);
  ctx.stroke();
  // ⑤ 双螯 + 眼柄：⭐ 这两样才是「一眼认出是螃蟹」的关键，尺寸不能省。
  //   ⛔ 螯必须**凸出壳的前缘**并自带 V 形缺口 —— 早先把它摆在壳缘上
  //   （±0.96R, −0.84R，壳 ry 就是 0.86R）⇒ 整只螯糊在深色壳沿里，
  //   4× 截图上只剩两个圆点，读出来是「蜱虫」不是「螃蟹」。
  const bite = 0.20 * R * fsin(gait + 1.2);                  // 螯微微开合
  const CP = 0.72 * R, CQ = 0.40 * R;
  // ⭐ 螯臂：从壳的前肩斜撑到螯。⛔ 可省 —— 没它的话螯像两块崩在壳边上的
  //   碎块，而不是「举着的头」。
  ctx.strokeStyle = PAL.crabLeg;
  ctx.lineWidth = Math.max(1.0, 0.24 * R);
  ctx.beginPath();
  for (let side = 0; side < 2; side++){
    const s = side ? 1 : -1;
    ctx.moveTo(s * 0.50 * R, -0.64 * R);
    ctx.lineTo(s * 0.84 * R, -1.06 * R);
  }
  ctx.stroke();
  for (let side = 0; side < 2; side++){
    const s = side ? 1 : -1;
    ctx.save();
    ctx.translate(s * 0.86 * R, -1.10 * R);
    ctx.rotate(s * (0.40 + bite));
    ctx.beginPath();
    ctx.moveTo(-CP * 0.80, -CQ);
    ctx.quadraticCurveTo(CP * 0.60, -CQ * 1.06, CP * 0.88, -CQ * 0.46);
    ctx.lineTo(CP * 0.30, 0);                                 // 钳口
    ctx.lineTo(CP * 0.88, CQ * 0.46);
    ctx.quadraticCurveTo(CP * 0.60, CQ * 1.06, -CP * 0.80, CQ);
    ctx.quadraticCurveTo(-CP * 1.12, 0, -CP * 0.80, -CQ);
    ctx.closePath();
    // ⛔ 螯不能与壳同色：同色同描边 ⇒ 12× 截图上壳与螯糊成一整块橙。
    //   亮一档 + 更深的边，螯才「浮」在壳前面。
    ctx.fillStyle = PAL.crabClaw;
    ctx.fill();
    ctx.strokeStyle = PAL.crabRim;
    ctx.lineWidth = Math.max(0.8, 0.15 * R);
    ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle = PAL.crabLeg;
  ctx.lineWidth = Math.max(0.7, 0.14 * R);
  ctx.beginPath();
  for (let side = 0; side < 2; side++){
    const s = side ? 1 : -1;
    ctx.moveTo(s * 0.30 * R, -0.56 * R);
    ctx.lineTo(s * (0.36 + bite * 0.6) * R, -1.22 * R);
  }
  ctx.stroke();
  ctx.fillStyle = PAL.crabRim;
  for (let side = 0; side < 2; side++){
    const s = side ? 1 : -1;
    ctx.beginPath();
    ctx.arc(s * (0.36 + bite * 0.6) * R, -1.26 * R, 0.24 * R, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ⭐ 残留泡沫：退水留在湿沙上的羽状条纹（不是点，是被水拖出来的丝缕）。
//  必须短 —— 太长就成了「等高线」。位置落在 [水线, 湿区外沿] 之间，
//  越靠内陆（退水路过最久的地方）越密 ⇒ 读起来像退水的路径。
function drawResidualStreaks(t){
  const n = COLS + 1;
  let wet = 0;
  for (let i = 0; i < n; i++) wet += wetAmt[i];
  wet /= n;
  if (wet < 0.05) return;
  ctx.save();
  ctx.clip(sandPath);
  ctx.lineCap = 'round';
  for (let pass = 0; pass < 3; pass++){
    ctx.beginPath();
    for (let seg = 0; seg < 26; seg++){
      const h = seg * 3 + pass;
      const a0 = hash2(h, 501);
      const a1 = a0 + 0.012 + 0.065 * hash2(h, 502);
      const band = Math.pow(hash2(h, 503), 0.65);        // 偏向内陆
      for (let k = 0; k <= 6; k++){
        const p = lerp(a0, a1, k / 6);
        const i = Math.min(COLS, Math.max(0, Math.round(p * COLS)));
        const x = W * p;
        const y = lerp(shoreYs[i], wetEdge[i], 0.06 + 0.90 * band)
                + 0.0026 * H * Math.sin(x * 0.026 * kScale + h * 1.7 + t * 0.00042);
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
    }
    ctx.lineWidth = 0.9 + 0.8 * pass;
    ctx.strokeStyle = PAL.foam;
    ctx.globalAlpha = RESIDUE_STREAK_A * (1 - pass * 0.28) * (0.35 + 0.65 * wet);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/** ⭐ 细亮湿线：正好压在岸线上。退水期最亮（刚被水舔过），干燥期淡出。 */
function drawWetLine(t){
  const n = COLS + 1;
  const boost = swashStageNow === 0 ? 0.55 : (swashStageNow === 1 ? 1.0 : 0.30);
  ctx.save();
  ctx.clip(sandPath);
  ctx.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++){
    ctx.beginPath();
    for (let seg = 0; seg < 11; seg++){
      const a0 = seg / 11, a1 = (seg + 0.88) / 11;
      for (let k = 0; k <= 6; k++){
        const p = lerp(a0, a1, k / 6);
        const i = Math.min(COLS, Math.round(p * COLS));
        const y = shoreYs[i] + pass * 1.6 + 0.0022 * H * Math.sin(p * W * 0.011 * kScale + seg * 2.3 + t * 0.00052);
        if (k === 0) ctx.moveTo(W * p, y); else ctx.lineTo(W * p, y);
      }
    }
    ctx.lineWidth = 1.0 + pass * 1.5;
    ctx.strokeStyle = PAL.foam;
    ctx.globalAlpha = WET_LINE_A * (1 - pass * 0.42) * boost;
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/** ⭐ 浪花手指：贴着水线往沙上爬的不规则花边。
 *  上冲期最长最显（舌头上带泡沫），退回期迅速萎缩，干燥期几乎没有。
 *  ⛔ 早先按 (i+0.5)/FINGER_MAX 等距排布 + 固定形状 ⇒ 渲染出来是一排
 *    等距的半圆扇贝，像装饰花边而不是浪花。现在位置/长度/宽度都按 hash
 *    抖动，并且只让少数「舌头」明显伸出去。 */
function drawSwashFingers(t){
  const st = swashStageNow;
  const vigor = st === 0 ? 1.0 : (st === 1 ? 0.50 : 0.10);
  if (vigor < 0.05) return;
  ctx.save();
  ctx.clip(sandPath);
  ctx.fillStyle = PAL.foam;
  for (let tier = 0; tier < 3; tier++){
    ctx.globalAlpha = (0.15 - tier * 0.042) * vigor * (0.4 + 0.6 * A.sLow);
    ctx.beginPath();
    for (let i = tier; i < FINGER_MAX; i += 3){
      const h = i * 3 + tier;
      // ⛔ 位置：等距栅格 + 大幅 hash 抖动（±0.85 格）⇒ 不再是等距扇贝
      const p = (i + 0.5) / FINGER_MAX + 0.85 * (hash2(h, 601) - 0.5);
      if (p < -0.02 || p > 1.02) continue;
      // ⛔ 只有 45% 的位置真的伸出去，其余几乎贴着水线 ⇒ 参差
      const reach = Math.pow(hash2(h, 604), 2.2);
      if (reach < 0.06) continue;
      const ci = Math.min(COLS, Math.max(0, Math.round(p * COLS)));
      const base = shoreYs[ci];
      const len = H * (0.002 + 0.030 * reach) * (0.35 + 0.65 * A.sMid) * vigor;
      const wide = W * (0.006 + 0.026 * Math.pow(hash2(h, 603), 1.6));
      const y0 = base - H * 0.003;
      const lean = (hash2(h, 605) - 0.5) * wide * 0.9;
      ctx.moveTo(W * p - wide * 0.5, y0);
      ctx.bezierCurveTo(W * p - wide * 0.46, y0 + len * 0.60,
                        W * p - wide * 0.14, y0 + len * 0.90,
                        W * p + lean, y0 + len);
      ctx.bezierCurveTo(W * p + wide * 0.26, y0 + len * 0.70,
                        W * p + wide * 0.46, y0 + len * 0.30,
                        W * p + wide * 0.5, y0);
      ctx.closePath();
    }
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════════════════
   8 · SWELL BANDS — 4 stacked foam lines, ⭐ shoreward one is strongest.
   Each band is quantised into FOAM_LADDER disjoint narrow strips (tail→front),
   so filling each strip at its own alpha reproduces foamTargetAt() exactly:
   lip brightest → translucent heart → tail dissolving to zero.
   ══════════════════════════════════════════════════════════════════════════ */
const bxs  = new Float32Array(COLS + 1);
const bfy  = new Float32Array(COLS + 1);
const bwj  = new Float32Array(COLS + 1);
// 反馈六·5：大白沫晕的上下沿（每帧重算）
const washA = new Float32Array(COLS + 1);
const washB = new Float32Array(COLS + 1);
// 反馈七·4：逐列的倾角律与距离律（泡沫强度场）
const slopeLaw = new Float32Array(COLS + 1);
const farLaw   = new Float32Array(COLS + 1);
const ragA = new Float32Array(COLS + 1);   // slow tear pattern (bands 0, 2)
const ragB = new Float32Array(COLS + 1);   // fast tear pattern (bands 1, 3)
const fray = new Float32Array(COLS + 1);   // ⭐ 分形破碎场
const edgeYs = new Float32Array(COLS + 1);
// scratch rows (preallocated: ⛔ no per-frame arrays)
const slabLo = new Float32Array(COLS + 1);
const slabHi = new Float32Array(COLS + 1);
let edgeValid = false;

/** ⭐ 确定性分形破碎：三个八度（振幅按 ~0.47 衰减）+ 每列固定 hash 抖动。
 *  光滑正弦边缘一眼就是 CG；真实白沫是大瓣 → 碎瓣 → 细丝的自相似结构。 */
function fillFray(t, L){
  for (let i = 0; i <= COLS; i++){
    const x = W * i / COLS;
    fray[i] = FRAY_A[0] * fsin(x * FRAY_K[0] * kScale + t * FRAY_W[0] + L * 2.13)
            + FRAY_A[1] * fsin(x * FRAY_K[1] * kScale + t * FRAY_W[1] + L * 5.31)
            + FRAY_A[2] * fsin(x * FRAY_K[2] * kScale + t * FRAY_W[2] + L * 1.07)
            + FRAY_JIT * (hash2(i, 300 + L) - 0.5) * 2;
  }
}

/** 在一条窄带上挖破洞（evenodd ⇒ 水从洞里透出来 ⇒ 白沫是「花边」不是「实心带」）
 *  破洞要够大够圆才读成「泡沫之间的空隙」；早期版本只有 8×2px 的细缝，
 *  看起来像条划痕而不是孔洞。
 *  ⛔⛔ **不要**用 `Math.floor(t / HOLE_PERIOD_MS)` 给破洞场换随机种子：
 *    那会让所有洞在每个周期的**同一帧整体瞬移**（位置与半径同时跳变），
 *    而破洞是 evenodd 挖进白沫路径里的 ⇒ 白沫图案整帧闪一次，owner 读作
 *    「老是闪烁」。⛔ 而且所有洞同帧变化 = 一起眨眼，最刺眼。
 *    （上一轮只把周期从 260ms 放慢到 1100ms —— 只治了频率，没治跳变。）
 *  ⭐ 现在：每洞有**自己的相位**，沿条带**连续漂移**，半径按 sin(πu) 生长→收缩。
 *    ⚠️ 半径**不是**真的到 0：`hr = gap·(0.06 + 0.30·grow)·k` 有 0.06 的地板值，
 *    u→0/1 时半径 = gap·0.06·k（典型 0.7px），**落在下面的 ry<1.5 丢弃阈值之下**
 *    ⇒ 视觉上仍是「生灭不突变」，但机制是「收缩到阈值以下被丢弃」，不是「归零」。
 *    各洞相位错开，不会齐闪。 */
function punchHoles(path, L, strip, n0, n1, W0, kA, t, dir){
  const gap = n1 - n0;
  if (gap < 0.07) return;                       // 太窄的条带挖不动，会破形
  const count = Math.round(HOLE_MAX * kA * clamp(1.15 - gap * 1.6, 0, 1));
  for (let h = 0; h < count; h++){
    const ph = hash2(h, 700 + strip * 31 + L * 7);              // 每洞固定相位偏移
    const u  = ((t / HOLE_PERIOD_MS) + ph) % 1;                // 连续 0..1（⛔ 不取整）
    const hx = clamp(ph + 0.13 * Math.sin(t * 0.00021 + ph * 6.2832), 0.02, 0.98);   // 缓慢横漂
    //   ⛔ 不可写成 `(ph + 0.13*sin(..) + 1) % 1`：回绕会让 hx 从 ~1.0 跳到 ~0.0
    //   ⇒ 洞横穿整屏（实测 1600px/帧）。clamp 是有界振荡，边界处导数归零 ⇒ 连续。
    const grow = Math.sin(Math.PI * u);                         // 0 → 1 → 0：生灭不突变
    const hn = n0 + gap * (0.12 + 0.76 * u);                    // 沿条带连续推进
    const hr = gap * (0.06 + 0.30 * grow) * (0.70 + 0.60 * hash2(h, 720 + strip * 17 + L * 5));
    const col = Math.min(COLS, Math.max(0, Math.round(hx * COLS)));
    const cy = bfy[col] + dir * hn * bwj[col] * W0;
    const ry = hr * bwj[col] * W0;
    const rx = ry * (1.1 + 1.5 * hash2(h, 730 + strip + L * 11));
    const cx = hx * W;                        // ⛔ 同样不要吸附到列栅格
    if (ry < 1.5 || rx < 2.5) continue;
    path.moveTo(cx + rx, cy);
    for (let a = 1; a <= 9; a++){             // 粗略椭圆，9 段足够
      const th = a / 9 * Math.PI * 2;
      path.lineTo(cx + Math.cos(th) * rx, cy + Math.sin(th) * ry);
    }
    path.closePath();
  }
}

function bandAmp(L){
  const e = (L === 0) ? A.sLow : (A.sLow * 0.70 + A.sMid * 0.30);
  let a = 0.26 + 0.74 * e;
  if (L === 0) a += A.setImp * 0.55;           // the shoreward band takes the set wave
  return clamp(a, 0, 1.35);                     // ⛔ clamp BOTH ends, Math.min only caps above
}

/** 一条窄带的填充。亮的窄带沿 x 方向再切成 3 段重叠的子路径，每段一个
 *  由 hash 决定的 alpha —— 连续不断的实心亮带正是「读成插画」的主因之一，
 *  真实白沫前段是断开的一团团。暗的窄带整条画，省开销。 */
/** 一条窄带的填充（整条一次 fill）。
 *  ⛔ 曾经试过把亮带沿 x 切成 3 段重叠子路径、各给不同 alpha 来制造「断开感」，
 *     但 source-over 下重叠段会叠得更亮，屏幕上就是一块块硬边矩形。改用
 *     punchHoles（洞）+ drawFoamLace（丝网）来打散，形状才有机。 */
function fillStrip(L, s, ladder, step2, W0, kA, t, dir){
  const alpha = clamp(ladder[s].a * kA, 0, 1);
  if (alpha < 0.015) return;
  for (let j = 0; j <= COLS; j += step2){
    const w = bwj[j];
    slabLo[j] = bfy[j] + dir * ladder[s].n0 * w * W0;
    slabHi[j] = bfy[j] + dir * ladder[s].n1 * w * W0;
  }
  const m = (COLS / step2) + 1;
  const p = new Path2D();
  smoothRun(p, bxs, slabLo, m, true, true, step2);
  smoothRun(p, bxs, slabHi, m, false, false, step2);
  p.closePath();
  punchHoles(p, L, s, ladder[s].n0, ladder[s].n1, W0, kA, t, dir);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = ladder[s].a >= 0.35 ? PAL.foam : PAL.foamCore;
  ctx.fill(p, 'evenodd');
}

/** ⭐ 浪花蕾丝（反馈四）—— 反馈八·5b 第四次重写：连成一整张的网。
 *  ⛔ 早先用「一堆圆」当泡沫胞 ⇒ 泡泡浴。
 *  ⛔ 第二版把丝做成「沿行进方向拉长的竖直丝」⇒ 一排名副其实的竖直短毛。
 *  ⛔ 第三版（上一版）是 322 根互不共享端点的短横丝（1%~4.5% 屏宽，独立 hash
 *     起点、独立终点）：丝太短、彼此不接 ⇒ 100% 下读成「散落的苍白毛发」。
 *  ⭐ 真实白沫是**沿岸铺开的一层网**：长丝沿岸延伸、由短筋互相连成网眼，
 *    网眼里露出水。关键不是「丝的形状」而是「丝是连通的」——
 *    所以 5b 把网的**拓扑**在 resize 时烘好（u-v 空间的节点 + 边），
 *    每帧只把每条边的两个端点映射到浪几何上：端点**共享** ⇒ 网永不散架。
 *     · 10×4 抖动网格：每行 9 条沿岸长丝（每根横跨 ~10% 屏宽）+ 2 条环绕屏
 *       边的包边丝 ⇒ 整行绕屏无缝；行间 ~72% 竖直短筋 + ~64% 斜筋连成网眼。
 *     · 每个格子里再放一根更细的短丝当网眼填充，水从网眼里透出来。
 *     · 丝内部点叠缓慢漂移的正弦（端点钉死在共享节点上）⇒ 活而不散。
 *     · 分 3 个「离前缘的距离」档描边 ⇒ 近前缘密而亮、后段散而淡。
 *  描边而非图元：stroke 天然给出细线，粗细就是丝的粗细。
 *  `dir`：+1 向岸、−1 向海。贴岸那条带的主体在它 ⭐ 海侧。 */
let laceNet = null;
function buildLaceNet(){
  laceNet = [];
  const GX = 10, GY = 4;
  const rowV = [0.03, 0.22, 0.40, 0.58];       // 各行离前缘的 v（0..1 带宽内）
  const u = new Float32Array(GX * GY), v = new Float32Array(GX * GY);
  for (let gy = 0; gy < GY; gy++){
    for (let gx = 0; gx < GX; gx++){
      const i = gy * GX + gx;
      u[i] = clamp((gx + 0.5) / GX + (hash2(i, 5501) - 0.5) * 0.12, 0.015, 0.985);
      v[i] = clamp(rowV[gy] + (hash2(i, 5507) - 0.5) * 0.10, 0.01, 0.92);
    }
  }
  let se = 1;
  const push = function(ua, va, ub, vb, xs, kind){
    laceNet.push({
      ua: ua, va: va, ub: ub, vb: vb, xs: xs, kind: kind,
      ph: 6.2832 * hash2(se, 5601), f1: 0.9 + 1.6 * hash2(se, 5603),
      amp: 0.5 + 1.6 * hash2(se, 5605), rate: 0.00006 + 0.00010 * hash2(se, 5607),
      wj: 0.60 + 0.85 * hash2(se, 5609), aj: 0.80 + 0.20 * hash2(se, 5611),
    });
    se++;
  };
  // 沿岸长丝（每行 9 条）+ 左右两条环绕屏边 ⇒ 整行绕屏一圈，无缝
  for (let gy = 0; gy < GY; gy++){
    const r = gy * GX;
    for (let gx = 0; gx < GX - 1; gx++) push(u[r + gx], v[r + gx], u[r + gx + 1], v[r + gx + 1], 0, 0);
    push(u[r + GX - 1], v[r + GX - 1], u[r], v[r], 1, 0);    // 右出屏环绕
    push(u[r], v[r], u[r + GX - 1], v[r + GX - 1], -1, 0);   // 左出屏环绕
  }
  // 竖直短筋（把行连成网眼）+ 斜筋（打散网格感）
  let ci = 1;
  for (let gy = 0; gy < GY - 1; gy++){
    for (let gx = 0; gx < GX; gx++){
      const a = gy * GX + gx, b = (gy + 1) * GX + gx;
      if (hash2(ci, 5701) < 0.72) push(u[a], v[a], u[b], v[b], 0, 1);
      if (gx < GX - 1){
        if (hash2(ci, 5703) < 0.42) push(u[a], v[a], u[b + 1], v[b + 1], 0, 2);
        if (hash2(ci, 5705) < 0.22) push(u[a + 1], v[a + 1], u[b], v[b], 0, 2);
      }
      ci++;
    }
  }
  // 网眼填充：每个格子一根更细的短丝（v 错开，不碰网格端点）
  for (let gy = 0; gy < GY - 1; gy++){
    for (let gx = 0; gx < GX; gx++){
      if (hash2(ci, 5801) > 0.76){ ci++; continue; }
      const a = gy * GX + gx, b = gy * GX + ((gx + 1) % GX);
      const vm = (v[a] + v[a + GX]) * 0.5;
      const fa = clamp(vm + (hash2(ci, 5803) - 0.5) * 0.18, 0.02, 0.90);
      const fb = clamp(vm + (hash2(ci, 5805) - 0.5) * 0.18, 0.02, 0.90);
      push(u[a], fa, u[b], fb, gx === GX - 1 ? 1 : 0, 3);
      ci++;
    }
  }
}
function drawFoamLace(L, W0, kA, t, dir){
  if (kA < 0.10 || !laceNet) return;
  const dens = L === 0 ? 1.30 : 0.62 + 0.30 * (1 - L / 3);   // 贴岸那条最「成熟」
  const bandA = [1.00, 0.62, 0.30];      // 近前缘亮、后段淡
  const bandW = [0.85, 1.10, 1.30];
  const kindW = [1.00, 0.75, 0.85, 0.60]; // 长丝 / 竖筋 / 斜筋 / 网眼填充
  const kindA = [1.00, 0.80, 0.80, 0.55];
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#ffffff';
  const aBase = clamp(kA * 1.25, 0, 1) * dens * 0.66;
  const net = laceNet;
  // ⭐⭐ 端点**共享**是「连通」的关键：同一条边的两个端点来自烘好的节点，
  //    所有边在节点处严格相交，丝永远不会各自为政地断开。
  for (let e = 0; e < net.length; e++){
    const ed = net[e];
    const dv = 0.05 * Math.sin(t * 0.00003 + ed.ph + L * 0.9);   // 缓慢呼吸
    const va = clamp(ed.va + dv, 0.015, 0.95);
    const vb = clamp(ed.vb + dv, 0.015, 0.95);
    const colA = Math.min(COLS, Math.max(0, Math.round(ed.ua * COLS)));
    const colB = Math.min(COLS, Math.max(0, Math.round(ed.ub * COLS)));
    const xa = ed.ua * W;
    const xb = (ed.ub + ed.xs) * W;       // xs=±1 ⇒ 包边丝画出/左出屏
    const ya = bfy[colA] + dir * va * bwj[colA] * W0;
    const yb = bfy[colB] + dir * vb * bwj[colB] * W0;
    const lenPx = Math.hypot(xb - xa, yb - ya);
    if (lenPx < 1.5) continue;
    const vm = (va + vb) * 0.5;
    const b = vm < 0.20 ? 0 : (vm < 0.38 ? 1 : 2);
    const a = aBase * bandA[b] * kindA[ed.kind] * ed.aj;
    if (a < 0.012) continue;
    const nx = -(yb - ya) / lenPx, ny = (xb - xa) / lenPx;
    const amp = Math.min(ed.amp * 1.9, lenPx * 0.12, 9);
    const steps = Math.max(1, Math.min(10, Math.round(lenPx / 22)));
    ctx.globalAlpha = Math.min(a, 0.95);
    ctx.lineWidth = (0.55 + 0.85 * ed.wj) * bandW[b] * kindW[ed.kind];
    ctx.beginPath();
    ctx.moveTo(xa, ya);
    // ⭐ 内部点叠正弦，但两端 sin(0)=sin(π)=0 ⇒ 端点钉死，网不散
    for (let s = 1; s < steps; s++){
      const q = s / steps;
      const wob = amp * Math.sin(Math.PI * q) * Math.sin(q * ed.f1 * 6.2832 + ed.ph + t * ed.rate);
      ctx.lineTo(xa + (xb - xa) * q + nx * wob, ya + (yb - ya) * q + ny * wob);
    }
    ctx.lineTo(xb, yb);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════════════════
   反馈六·5 · 外海泡沫 —— 烘好的贴图 + 每帧 drawImage
   ══════════════════════════════════════════════════════════════════════════
   ⛔ 逐像素噪声画泡沫是不行的：软件光栅 1920×1080 已经 118ms/帧。
     这里改成「每张 256×256 的泡沫贴图在 resize 时烘一次，
     运行时只按浪脊几何 drawImage 摆位」—— 每帧成本 = N 次贴图 blit。
   贴图内容：撕碎的丝缕 + 软边斑块 + 破洞，边缘 alpha 渐隐
   （渐隐很重要：直接硬边矩形贴上去会看见一个个方块）。            */
let foamTiles = null;
function buildFoamTiles(){
  const TS = 256;
  if (!foamTiles){
    foamTiles = [];
    for (let k = 0; k < SEA_FOAM_TILES; k++){
      const c = document.createElement('canvas');
      c.width = TS; c.height = TS;
      foamTiles.push(c);
    }
  }
  for (let k = 0; k < SEA_FOAM_TILES; k++){
    const c = foamTiles[k];
    const g = c.getContext('2d');
    g.clearRect(0, 0, TS, TS);
    g.lineCap = 'round';
    g.lineJoin = 'round';
    // ── 软边斑块：泡沫团的底子 ──
    for (let b = 0; b < 9; b++){
      const h = k * 61 + b * 7;
      const bx = 26 + 204 * hash2(h, 901);
      const by = 26 + 204 * hash2(h, 902);
      const br = 16 + 46 * Math.pow(hash2(h, 903), 1.6);
      const rg = g.createRadialGradient(bx, by, 0, bx, by, br);
      const a = 0.16 + 0.26 * hash2(h, 904);
      rg.addColorStop(0.00, 'rgba(255,255,255,' + a.toFixed(3) + ')');
      rg.addColorStop(0.55, 'rgba(238,250,252,' + (a * 0.42).toFixed(3) + ')');
      rg.addColorStop(1.00, 'rgba(220,244,250,0)');
      g.fillStyle = rg;
      g.beginPath(); g.ellipse(bx, by, br, br * (0.42 + 0.5 * hash2(h, 905)), 0, 0, 6.2832); g.fill();
    }
    // ── 撕碎的丝缕：短、蜿蜒、相互搭接 ──
    for (let s = 0; s < 26; s++){
      const h = k * 131 + s * 11;
      const x0 = 14 + 228 * hash2(h, 911);
      const y0 = 14 + 228 * hash2(h, 912);
      const len = 26 + 96 * Math.pow(hash2(h, 913), 1.4);
      const ang = (hash2(h, 914) - 0.5) * 2.4;                 // 多数近水平
      const a2 = 0.22 + 0.44 * hash2(h, 915);
      g.strokeStyle = '#ffffff';
      g.globalAlpha = a2;
      g.lineWidth = 0.9 + 2.3 * Math.pow(hash2(h, 916), 1.7);
      g.beginPath();
      const steps = 11;
      for (let q = 0; q <= steps; q++){
        const f = q / steps;
        const px = x0 + Math.cos(ang) * f * len + 13 * Math.sin(f * 5.1 + h);
        const py = y0 + Math.sin(ang) * f * len + 9 * Math.sin(f * 7.7 + h * 1.7);
        if (q === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.stroke();
    }
    // ── 边缘渐隐：把硬边矩形变成可以随意摆放的软斑 ──
    //    ⛔ 外径必须 **小于** TS/2。早先写 0.52·TS ⇒ 四条边的中点（距中心
    //    0.5·TS）还留着 ~0.05 的 alpha，贴图内容在边上被切断 ⇒ 渲染出来
    //    能看见一个个淡方框。现在 0.44·TS ⇒ 边界处已经全透明。
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'destination-in';
    const eg = g.createRadialGradient(TS / 2, TS / 2, TS * 0.13, TS / 2, TS / 2, TS * 0.44);
    eg.addColorStop(0.00, 'rgba(0,0,0,1)');
    eg.addColorStop(0.70, 'rgba(0,0,0,0.80)');
    eg.addColorStop(1.00, 'rgba(0,0,0,0)');
    g.fillStyle = eg;
    g.fillRect(0, 0, TS, TS);
    g.globalCompositeOperation = 'source-over';
  }
}
/** ⭐ 波面上的大白沫晕（反馈六·5「应该有很多泡沫」的关键一层）。
 *  一条路径 + 一条竖直渐变，按浪带的整体 y 范围锚定。
 *  ⛔ 不用逐列渐变：那是 97 个渐变对象/帧，而且这一层是柔和低对比的，
 *    锚在整体范围上的误差看不出来。 */
function drawSeaFoamWash(L, W0, kA, dir){
  if (kA < 0.10) return;
  const n = COLS + 1;
  let yTop = 1e9, yBot = -1e9, any = 0;
  for (let i = 0; i < n; i++){
    // ⛔ 尾迹长度用**固定**的 W0 倍数，不能乘 bwj[i]：bwj 逐列变化时，
    //    yBot 就跟着变，而渐变是锚在全幅范围上的 ⇒ 每列的渐变进度不同，
    //    外沿会出现一道「撕纸」一样的硬边。固定偏移后，尾迹就是浪脊的
    //    等距副本，每列的渐变进度完全一致 ⇒ 外沿软而干净。
    const a = bfy[i] + dir * (dir > 0 ? SEA_FOAM_WASH_FRONT_NL : SEA_FOAM_WASH_FRONT) * W0;
    const b = bfy[i] - dir * SEA_FOAM_WASH_BACK * W0;
    if (a < yTop) yTop = a;
    if (b > yBot) yBot = b;
    washA[i] = a; washB[i] = b;
    if (bwj[i] > 0.35) any = 1;
  }
  if (!any || yBot - yTop < 4) return;
  // ⭐⭐ 反馈七·4：白沫晕也要**逐段**按倾角律/距离律调 alpha。
  //    一整条一个 alpha 就没有远近差别（实测近岸/远处饱和度只差 0.03）。
  //    分 8 段、每段用它自己那段列的平均 foamK；段与段**共用 smoothRun 的
  //    曲线**而不是直线端点 ⇒ 相邻段之间不会出现竖直接缝。
  const G = 8, per = Math.ceil(n / G);
  for (let g = 0; g < G; g++){
    const i0 = g * per, i1 = Math.min(n, i0 + per);
    if (i1 - i0 < 2) continue;
    let fk = 0, cnt = 0, yT = 1e9, yB = -1e9;
    for (let i = i0; i < i1; i++) {
      fk += slopeLaw[i] * farLaw[i]; cnt++;
      if (washA[i] < yT) yT = washA[i];
      if (washB[i] > yB) yB = washB[i];
    }
    fk /= cnt;
    const A = SEA_FOAM_WASH_A * clamp(kA, 0, 1) * (0.06 + 0.94 * fk);
    if (A < 0.004 || yB - yT < 2) continue;
    const gr = ctx.createLinearGradient(0, yT, 0, yB);
    // ⭐ 反馈八·5a：非领头浪的峰值从「拖尾侧」挪到「前脸侧」。
    //    早先峰值在 0.16（靠海侧 = 浪后方），整条浪读成一条对称的淡色
    //    水脊；碎浪的亮面是**前缘线**（翻卷处），往后才拖成尾迹。
    //    渐变方向恒为 海侧(0) → 岸侧(1)，所以非领头浪把峰值压到 1.0 端。
    if (dir > 0){
      gr.addColorStop(0.00, 'rgba(222,240,246,' + (A * 0.05).toFixed(4) + ')');
      gr.addColorStop(0.35, 'rgba(226,242,246,' + (A * 0.24).toFixed(4) + ')');
      gr.addColorStop(0.62, 'rgba(230,245,248,' + (A * 0.55).toFixed(4) + ')');
      gr.addColorStop(0.85, 'rgba(234,248,250,' + (A * 0.95).toFixed(4) + ')');
      gr.addColorStop(1.00, 'rgba(236,250,251,' + A.toFixed(4) + ')');
    } else {
      gr.addColorStop(0.00, 'rgba(226,242,246,' + (A * 0.10).toFixed(4) + ')');
      gr.addColorStop(0.16, 'rgba(232,246,249,' + A.toFixed(4) + ')');
      gr.addColorStop(0.42, 'rgba(224,240,245,' + (A * 0.62).toFixed(4) + ')');
      gr.addColorStop(0.74, 'rgba(214,234,240,' + (A * 0.24).toFixed(4) + ')');
      gr.addColorStop(1.00, 'rgba(206,228,236,0)');
    }
    // 沿用该段的列号（smoothRun 的 stride 语义：xs/ys 仍按 i*1 索引，
    // 这里直接构造一个只含 [i0, i1] 的子路径，所以要用偏移视图）
    const p = new Path2D();
    smoothRunRange(p, bxs, washA, i0, i1);
    smoothRunRange(p, bxs, washB, i0, i1);
    p.closePath();
    ctx.globalAlpha = 1;
    ctx.fillStyle = gr;
    ctx.fill(p);
  }
}
/** smoothRun 的区间版本：沿 [i0, i1) 画一条平滑折线（两端落在端点上）。 */
function smoothRunRange(path, xs, ys, i0, i1){
  const X = i => xs[i], Y = i => ys[i];
  if (i1 - i0 < 2){ path.moveTo(X(i0), Y(i0)); path.lineTo(X(i1 - 1), Y(i1 - 1)); return; }
  path.moveTo(X(i0), Y(i0));
  for (let i = i0; i < i1 - 1; i++){
    path.quadraticCurveTo(X(i), Y(i), (X(i) + X(i + 1)) / 2, (Y(i) + Y(i + 1)) / 2);
  }
  path.lineTo(X(i1 - 1), Y(i1 - 1));
}

/** ⭐⭐ 浪的**水体**（反馈七·4 + 七·6）。
 *
 *  ⛔⛔ 反馈七之前，外海一条浪的**全部**视觉表现就是它的白沫。所以把距离律
 *    正确地做成「远处没有泡沫」之后，整片海上**一条浪都看不见了**
 *    （实测：远景平均饱和度 0.79 vs 近岸 0.76，浪完全消失）。
 *    物理上不对：远处的浪仍然是浪，只是没有白。
 *
 *  ⭐ 所以浪必须有自己的**非泡沫**表现：俯拍看下去，一道涌浪是
 *    「迎光面亮 + 背光面暗」的体积感。这一层按浪脊位置画一条
 *    暗→亮→透明的渐变带（用调色板里的 trough / ridge 两个色，
 *    和海面本身的明暗语言一致）。
 *    ⭐ 它的距离衰减**远比泡沫慢**（pow 0.55 vs 泡沫的 2.4）：
 *    远处的浪仍然有形状，只是没有白 —— 这正是反馈七·4 要的那个梯度。
 */
const SWELL_BODY_A = 0.55;
const SWELL_BODY_BACK = 2.1;    // 背光面往后拖几个浪带宽
const SWELL_BODY_FRONT = 0.55;  // 迎光面前出多少
const SWELL_BODY_FAR_POW = 0.55;
function drawSwellBody(L, W0, kA, dir){
  if (kA < 0.06) return;
  const n = COLS + 1;
  const G = 6, per = Math.ceil(n / G);
  for (let g = 0; g < G; g++){
    const i0 = g * per, i1 = Math.min(n, i0 + per);
    if (i1 - i0 < 2) continue;
    let fk = 0, cnt = 0, yT = 1e9, yB = -1e9;
    for (let i = i0; i < i1; i++){
      // ⭐ 水体的距离律比泡沫平缓得多（0.55 次方 vs 2.4）
      const far = Math.pow(farLaw[i] > 0 ? 1 / (1 + (1 - farLaw[i]) * 3.2) : 1, 1);
      fk += (0.35 + 0.65 * slopeLaw[i]) * far; cnt++;
      const a = bfy[i] + dir * SWELL_BODY_FRONT * W0;
      const b = bfy[i] - dir * SWELL_BODY_BACK * W0;
      if (a < yT) yT = a;
      if (b > yB) yB = b;
      washA[i] = a; washB[i] = b;
    }
    fk /= cnt;
    const A = SWELL_BODY_A * clamp(kA, 0, 1) * fk;
    if (A < 0.004 || yB - yT < 3) continue;
    const gr = ctx.createLinearGradient(0, yT, 0, yB);
    const dk = 'rgba(' + C_TROUGH[0] + ',' + C_TROUGH[1] + ',' + C_TROUGH[2] + ',';
    const lt = 'rgba(' + C_RIDGE[0] + ',' + C_RIDGE[1] + ',' + C_RIDGE[2] + ',';
    gr.addColorStop(0.00, dk + (A * 0.95).toFixed(4) + ')');   // 背光：槽底暗
    gr.addColorStop(0.34, dk + (A * 0.42).toFixed(4) + ')');
    gr.addColorStop(0.62, lt + (A * 0.30).toFixed(4) + ')');
    gr.addColorStop(0.80, lt + (A * 0.85).toFixed(4) + ')');   // 迎光：浪脊亮
    gr.addColorStop(1.00, lt + '0)');
    const p = new Path2D();
    smoothRunRange(p, bxs, washA, i0, i1);
    smoothRunRange(p, bxs, washB, i0, i1);
    p.closePath();
    ctx.globalAlpha = 1;
    ctx.fillStyle = gr;
    ctx.fill(p);
  }
  void SWELL_BODY_FAR_POW;
}

/** ⭐ 把烘好的泡沫贴图铺到一条外侧浪带上。
 *  位置由浪脊几何决定：贴着浪带前缘、越靠前越密 ⇒ 泡沫「长在」浪上，
 *  而不是一层均匀的白纱。密度另受一个独立噪声场控制 ⇒ 有的岸段被撕得很碎、
 *  有的几乎干净。 */
function drawOpenSeaFoam(L, W0, kA, t, dir){
  if (kA < 0.12 || !foamTiles) return;
  const base = kA * SEA_FOAM_A * (L === 1 ? 1.0 : (L === 2 ? 0.82 : 0.60));
  for (let k = 0; k < SEA_FOAM_PATCH; k++){
    const h = k * 17 + L * 613;
    // ⭐ 密度场：0.15..1.0，缓慢漂移 ⇒ 同一片海面过一会儿「碎的地方」会换
const dens = fbmNorm((k * 0.37 + L * 2.1) * 1.9 + t * 0.00006, 7701 + L * 37, 2);
    // ⭐ 位置**不是均匀随机**：先用一个低频场把贴图聚成几团
    //    （被撕碎的浪列），再叠一点点抖动。均匀撒开 = 又一层规则的花纹。
    const p = clamp(0.5 + 0.46 * fbmSigned(k * 0.075 + L * 5.1, 9301, 2)
                  + 0.16 * (hash2(h, 921) - 0.5) * 2, 0, 1);
    const col = Math.min(COLS, Math.max(0, Math.round(p * COLS)));
    // ⭐ 深度位置：-0.15..1.05 ⇒ 一部分盖住浪脊前缘，一部分拖在后面
    const dep = hash2(h, 922) * 1.90 - 0.35;
    const y = bfy[col] + dir * dep * bwj[col] * W0;
    // ⛔ 尺寸必须接近贴图的原生 256px。早先 W0·(1.4..3.7) = 54..140px，
    //    等于把 256px 的丝缕缩到 0.2~0.55 倍 ⇒ 细丝全部糊成灰雾，
    //    100% 下只看到「淡淡一块脏东西」，完全没有撕碎的感觉。
    const size = W0 * (2.40 + 2.40 * Math.pow(hash2(h, 923), 1.2));
    const tile = foamTiles[(h) % SEA_FOAM_TILES];
    // ⭐⭐ 反馈七·4 + 七·6：这里是**逐块**的局部调制点。
    //    ⛔ 之前倾角律/距离律只折进了「带宽」（bwj），alpha 没动 ——
    //    实测近岸与最远处的平均饱和度只差 0.03，泡沫根本没有随距离消退。
    //    每块贴图本来就落在某一列上，所以按那一列的 foamK 缩 alpha
    //    是**零额外开销**的局部调制：陡的地方/近的地方多贴，平的地方/
    //    远处的地方少贴。不再靠「统一抬 alpha」，也就不会糊成实心白带。
    const fk = slopeLaw[col] * farLaw[col];
    const a = base * dens * (0.55 + 0.60 * hash2(h, 924)) * (0.10 + 0.90 * fk);
    if (a < 0.012) continue;
    ctx.globalAlpha = Math.min(a, 0.45);
    ctx.drawImage(tile, bxs[col] - size * 0.5, y - size * 0.5, size, size);
  }
  ctx.globalAlpha = 1;
}

/** ⭐⭐ 反馈八·5a：离岸浪的**扰动前锋**（agitation ahead of the moving crest）。
 *  仅对海里推进的浪画（领头浪的前缘 = 水线，由贴岸各层负责）。
 *  ⛔ 之前外海浪的全部泡沫都贴在浪脊上/后面（drawOpenSeaFoam 的 dep 大多
 *     落在 −0.35..+1.55 的拖尾侧），浪前方是一段干净的静水 —— 于是整条浪
 *     读成「苍白的水脊」。真实碎浪的前脸是翻涌的碎沫：浪脊前方、前缘面上
 *     全是刚被搅起的白水，随着浪往前走又拖成尾迹。
 *  做法（baked-then-transformed）：把烘好的丝缕贴图**前置**到前缘前方
 *  0.30..1.45 个带宽处，尺寸更小更密；逐块乘 slopeLaw×farLaw（就地采当列），
 *  陡的浪面多搅、最远处照旧归零 ⇒ 仍然 plausibly 随离岸距离消退。 */
function drawDisturbance(L, W0, kA, t, dir){
  if (kA < 0.12 || !foamTiles) return;
  const base = kA * DISTURB_A * (L === 1 ? 1.0 : 0.78);
  for (let k = 0; k < DISTURB_PATCH; k++){
    const h = k * 29 + L * 977 + 300;
    // 密度场：与拖尾贴图同源的独立慢漂移场 ⇒ 碎沫团会缓慢移动
    const dens = fbmNorm((k * 0.41 + L * 1.7) * 2.3 + t * 0.00008, 8801 + L * 41, 2);
    // 位置：低频场聚团 + 小抖动（与拖尾贴图同一套语言）
    const p = clamp(0.5 + 0.5 * fbmSigned(k * 0.083 + L * 6.3, 9401, 2)
                  + 0.14 * (hash2(h, 930) - 0.5) * 2, 0, 1);
    const col = Math.min(COLS, Math.max(0, Math.round(p * COLS)));
    // ⭐ 关键：贴图放在浪脊**前方**（dir>0 即前缘方向），而非拖尾侧
    const dep = DISTURB_DEP0 + (DISTURB_DEP1 - DISTURB_DEP0) * hash2(h, 931);
    const y = bfy[col] + dir * dep * bwj[col] * W0;
    const size = W0 * DISTURB_SIZE * (1.2 + 1.3 * Math.pow(hash2(h, 932), 1.3));
    // ⛔ 距离律不能用贴岸那条 FOAM_FAR_POW=2.4 —— 那条把 0.42h 出生深度的浪
    //    压到 farLaw≈0.011，前置扰动整条都是 0（实测全帧零像素差）。这里是
    //    「扰前锋」，用一条更缓的距离律：地平线处仍归零（^0.35 保持远端衰减），
    //    但中海的浪能保留可见的碎沫团。
    const fk = slopeLaw[col] * Math.pow(farLaw[col], 0.35);
    const a = base * dens * (0.4 + 0.6 * hash2(h, 933)) * (0.35 + 0.65 * fk);
    if (a < 0.008) continue;
    ctx.globalAlpha = Math.min(a, 0.40);
    ctx.drawImage(foamTiles[(h + 2) % SEA_FOAM_TILES], bxs[col] - size * 0.5, y - size * 0.5, size, size);
  }
  ctx.globalAlpha = 1;
}

function drawSwellBands(t){
  const n = COLS + 1;
  // ⛔⛔ 反馈六·2：这里没有任何音频。反馈七·5：这里**没有固定的四条浪带** ——
  //    画的是队列里**当下在场**的浪，每条在自己的 y 上。四条固定泳道就是
  //    「一排平行白缎带」的根源（实测行中值自相关 0.83）。
  //   ⭐ 画序：按 adv 升序（外海先画、近岸后画）。
  //   ⛔ 早先这里是 `const lead = leadWave()` + 「领头浪最后压上去」—— 两者都失效了：
  //     `leadWave()` 在滩上无浪时返回 adv 最大的推进中浪，会让还在外海的浪提前
  //     被判为前浪而瞬间切到水线尺度（实测交接跳变 187px）；且自 反馈八·10 起
  //     绘制侧的前浪身份只看 `state`（REACHED/FADING），与 leadWave 无关。
  //     ⇒ 该变量删除；下面的 `isLead` 才是唯一的「前浪」判据。
  const order = [];
  for (let i = 0; i < WAVE_POOL; i++){
    const w = waves[i];
    if (w.state === W_EMPTY) continue;
    order.push(w);
  }
  order.sort(function (a, b) { return a.y - b.y; });      // y 小的（更外海）先画

  // ⭐⭐ 单浪模式：**只过滤绘制**。队列照旧补浪/间距钳位/交接/退水，模拟一个字没改。
  //   ⛔ 不可改成「只发一条浪」——那样它消散后海上会空一段（退水钉在海缘等它），
  //   看到的就不是真实节奏了；owner 要看的是**真实模型**里一条浪的一生。
  if (soloWave){
    let keep = -1;
    for (let i = 0; i < order.length; i++) if (order[i].serial === soloSerial){ keep = i; break; }
    if (keep >= 0){ const solo = order[keep]; order.length = 0; order.push(solo); }
  }

  for (let wi = 0; wi < order.length; wi++){
    const w = order[wi];
    // ⭐⭐ 反馈八·10（方案 3）：**绘制上的「前浪」= 真正抵达滩上的那条**。
    //   ⛔ 旧写法 `const isLead = (w === lead)`：leadWave() 在滩上无浪时返回
    //     「adv 最大的推进中浪」—— 那条还在外海（adv 0.41~0.77），它的带是按
    //     **破碎线尺度**画的；一旦被判定为前浪，bfy 立刻改用 **shoreYs（水线尺度）**
    //     ⇒ 整条带瞬移。实测交接跳变回到中位 187px / 最大 387px。
    //   ⭐ 现在：只有 REACHED/FADING 才按前浪画（此时它已在 wlineFull，与破碎线
    //     adv=1 的位置重合 ⇒ 连续）；还在推进的一律按破碎线画。
    const isLead = (w.state === W_REACHED || w.state === W_FADING);
    // ⭐⭐ 泳道号只由**浪的身份**决定，与「是不是前浪」无关。
    //   ⛔⛔ 旧写法 `isLead ? 0 : (wi & 1) + 1` 有两个问题：
    //     ① `wi` 是按 y 排序后的绘制次序下标 —— 别的浪出生/回收时它会变；
    //     ② 更要命的是 isLead 翻转时 lane 从 1/2 跳到 0（或跳回）。
    //   实测（harness 泳道稳定性）：**每条浪一生恰好跳变 2 次**，正是
    //   「成为前浪」与「不再是前浪」那两帧。位置那时已经连续了，但
    //   fillFray / fillTears / 蕾丝 / 泡沫贴图 的**噪声实现整套切换**
    //   ⇒ owner 报「后浪还是会跳变」。
    //   ⭐ 改为 `1 + (serial % 3)`：终身固定 ⇒ 交接时纹理连续。
    //     同时不用 lane 0，任意两条在场的浪（serial 必不同）大概率取到不同泳道。
    const lane = 1 + (w.serial % 3);
    // ⛔⛔ `wi` 是**按 y 排序后的绘制次序下标**，别的浪出生/回收时它会变 ——
    //   一条浪的样子绝不该取决于它此刻排在第几位。harness 实测 14/15 条浪的 wi
    //   都会变一次（0↔1），而 wi 泄漏在三处：
    //     · bandAmp(1 + wi%2)   → amp（实测跳 0.0042，折算 W0 仅 0.09px，可忽略）
    //     · nb1 的 `wi * 2.13`   → bwj
    //     · env 的 `wi * 7.3` 与 hash 种子 `8100 + wi*53`
    //       ⛔⛔ 种子随 wi 变 ⇒ env 换成**完全不同的噪声实现** ⇒ envK 直接乘进
    //         bwj（带宽）⇒ wi 翻转时带宽花纹整个换掉 ⇒ 画面跳变。**这是主因**。
    //   ⭐ 一律改用 wiS：只由该浪身份决定、终身固定，同时保留「逐浪不同」的 variety。
    const wiS = w.serial & 3;
    const adv = clamp(w.y, 0, 1);
    // ⭐ 反馈七·6「白色更多、更明显」：贴岸主浪带额外加成
    // ⭐ 非领头浪的 amp 基线 0.30 → 0.46：harness 实测领头浪 amp ≈ 0.90、
    //   第二条浪 ≈ 0.59，第二条浪的 kA 因此只有领头浪的 ~1/5。它是「海上第二条
    //   浪」不是「附带的余波」，白沫不该差这么多。⚠️ 只抬基线不改增益斜率。
    const amp = isLead ? (0.55 + 0.45 * bandAmp(0))
                       : (0.46 + 0.45 * bandAmp(1 + (wiS % 2)));
    if (amp <= SILENCE_FLOOR) continue;
    const fade = waveFade(w);
    if (fade <= 0.02) continue;
    // ⭐⭐ 非领头浪的 kA：**不吃音频门控、不吃近岸斜坡**。
    //   owner：「第二条浪不应该抑制浪花啊，应该一直保持浪花，我才能知道第二条浪
    //   走到哪里了」—— 它的浪花是**位置指示器**，不是音强的表达。
    //   ⛔ 早先只软化距离律（FOAM_FAR_POW→0.35 幂）几乎无效（39.2%→38.2%），
    //     因为真正的抑制来自 layerAlpha 里两项**叠乘**：
    //       nearness（外海 0.32）× appear（音频能量门控，静音趋 0.30）= 0.096
    //       × amp 0.698 ⇒ kA ≈ 0.067 ⇒ 82% 的绘制调用被 `kA < 0.12` 丢弃。
    //   ⭐ 距离感仍然保留：由**带宽**（foamK = slopeLaw × farLaw）与逐块 alpha 承担，
    //     所以它外海时是「更窄、更淡」而不是「没有」—— 这正是「能看见它在哪」。
    //   ⚠️ 系数 0.55 是刻意低于领头浪的：领头浪另有 SHORE_FOAM_BOOST 1.55，
    //     两条浪的主次关系不能反过来。
    const kA = isLead ? clamp(amp * layerAlpha(adv, A.sEnergy) * fade, 0, 1)
                      : clamp(amp * 0.55 * fade, 0, 1);
    // ⭐⭐ 反馈七·4「倾角律」：泡沫由浪面的**坡度**决定，平的地方 → 0。
    //    概念移植自 WebGL Insights ch.11 的 `1.25*dot(normal, shore_dir)-0.1`：
    //    我们没有法线（minSdk 22，无 shader），用浪脊线的横向斜率 |dy/dx| 作代理。
    //    斜率大 ⇒ 浪面朝岸倾斜 ⇒ 破碎 ⇒ 泡沫峰值；斜率小 ⇒ 几乎水平 ⇒ 无泡沫。
    //    距离项是**次要**乘子，负责「最远处与海水无异」。
    const W0 = H * SWELL_BAND_W * (0.62 + 0.62 * amp) * (isLead ? 1.0 : 0.92);
    fillFray(t, lane);
    // ⛔⛔ 取用判据必须与 `fillTears` 的写入判据**完全一致**。
    //   fillTears: `slow = (L & 1) === 0` ⇒ 偶数 lane 写 ragA、奇数写 ragB。
    //   ⛔ 早先这里是 `(lane === 0 || lane === 1) ? ragA : ragB`，而
    //     `lane = 1 + (serial % 3)` 恒不取 0 ⇒ lane 1 读 ragA（却写 ragB）、
    //     lane 2 读 ragB（却写 ragA）⇒ **这条浪的撕裂场内容来自同帧/上帧另一条浪**
    //     ⇒ 又是「外观依赖绘制次序」，违反红线 6。
    const rag = ((lane & 1) === 0) ? ragA : ragB;
    fillTears(lane);

    for (let i = 0; i < n; i++){
      const x = W * i / COLS;
      bxs[i] = x;
      // 领头浪的前缘 = 水线本身（computeShore 的结果）⇒ 逐像素一致
      // ⭐⭐⭐ **后浪改用「水线尺度」定位**（owner 选方案 B）—— 交接连续性的根本修复。
      //   ⛔ 旧实现（破碎线尺度）的病根：一个浪对象带**两套互不兼容的坐标定义** ——
      //     非领头浪 = waveFrontY(x,t, H*(SHORE_K − waveDepthK(adv)), …) ← 行程 ~340px
      //     领头浪   = shoreYs[i]                          ← 行程仅 H·swashReachNow ≈ 81px
      //     而交接判据 `front.y >= a` 拿这两个**不同参数化空间**的 adv 直接比较
      //     ⇒ 交接发生在「破碎线还远在海外」的时刻（实测 adv 0.41~0.77），
      //     一交接整条带就被拽到岸边：harness 实测跳变 **150~267px**
      //     （bfy 398→601、337→605、432→594）⇒ owner 读作「第二条浪消失、
      //     然后下一条浪出现」—— 前后其实是**同一条浪**换了位置公式。
      //   ⭐ 现在的做法（方案 3 + 形态连续化）：破碎线出生在**远海**、终点是
      //     **前浪的实际位置 shoreYs[i]**，中间用 morph 连续插值 ⇒ adv=1 时严格相等。
      //   ⚠️ 出生水深偏移（reach）已移除：它会破坏交接连续性。逐浪差异改由
      //     T（速度）、w.seed（浪脊相位/形状）与 env/rag/fray 噪声承担。
      // ⭐⭐ **破碎线（breaker）**：出生在远海 `H·(SHORE_K − WAVE_SPAWN_DEPTH)`，
      //    终点 shoreYs[i] ⇒ 行程约 **640px**（实测 535~637px 的 shoreYs 减出生点
      //    −36px）。这是「画出来的白浪带」，也是「第二条浪全程可见」的依据。
      //    ⛔ 方案 B 曾把两端都压进水线空间（行程仅 81px），实测后果是第二条浪
      //      **整个藏在领头浪的带里**（kA 0.29~0.38、bwj 0.35~0.41 都正常，
      //      但两条带几乎同位置，领头浪 bwj 1.17 + SHORE_FOAM_BOOST 1.55 把它盖死）
      //      ⇒ owner 报「彻底看不到」。方案 3 让两者解耦，各走各的尺度。
      const spawnFar   = H * (SHORE_K - WAVE_SPAWN_DEPTH);
      // ⭐⭐ 后浪的浪脊**必须有曲线与波动**（owner：「基本是一条直线，没有曲线，
      //   也没有波动」）。⛔ 那是删掉 waveFrontY 时的连带损失：它同时提供了
      //   `crestProfile(u, 811)·h·CREST_AMP` 这一项 S 形起伏。
      //   `- lane * CREST_LANE_SHIFT` 让每条浪的曲线**相位错开**（否则两条浪同形）。
      // ⭐⭐ **交接地：位置与形态一起连续化**（owner：「接近前浪的位置时，会有一个曲线
      //   形状的跳变」）。
      //   ⛔ 上一轮用 `crestK = 1 - smoothstep(SWASH_LEAD_ADV, 1, adv)` 把起伏幅度
      //     **淡出到 0** 来换取位置连续。但 CREST_AMP·h ≈ 198px 的幅度在最后 15%
      //     行程里塌掉 ⇒ 视觉上就是「曲线形状跳变」。
      //   ⭐ 改为把**整个位置**从「破碎线位置」连续插值到「前浪的实际位置 shoreYs」：
      //     位置与曲线形态**一起**变成前浪的，adv=1 时严格等于 shoreYs ⇒ 无缝。
      //   ⚠️ 关键：`shoreYs[i]` 里**已经包含前浪自己的曲线**（`swashFrontY` 内含
      //     `crestProfile(u,2711)·h·CREST_AMP_SHORE`）与 fray（系数 0.42），
      //     所以破碎线的起伏项与 fray 项都必须随 morph 被**吸收**，
      //     ⛔ 不能在 lerp 之上再叠加（否则重复计入 ⇒ 交接处又出现跳变）。
      const morph = smoothstep(MORPH_START, 1, adv);
      // ⭐⭐ **位置参数化：前 55% 线性推进，后 45% 平滑补足**。
      //   ⛔ 旧写法 `lerp(breakerY, shoreYs, morph)` 在 adv<MORPH_START 时
      //     morph=0 ⇒ bfy = spawnFar + crest —— 而 spawnFar 是**常数**、crest 一生
      //     只漂移约 103px ⇒ **前 55% 的旅程画面上几乎不动**，之后 morph 启动
      //     一次性从 spawnFar 扫到 shoreYs。owner：「后浪浮现后，就等待在原位置，
      //     过一会就会以较快的速度冲出去」。完全对得上。
      //   ⭐ tAdv 单调、终点为 1、且在 adv<MORPH_START 时 tAdv≡adv ⇒ 全程可见移动。
      const tAdv = adv + (1 - adv) * morph;
      // 破碎线的 S 形起伏（漂移挂 adv ⇒ 随前进方向演化；种子用 w.seed ⇒ 逐浪不同）
      // ⚠️ 乘 (1−morph)：shoreYs 里已含前浪自己的曲线，不吸收就会重复计入。
      const uC = x * 0.00340 * kScale + adv * CREST_DRIFT_ADV - lane * CREST_LANE_SHIFT;
      const crest = crestProfile(uC, w.seed) * H * CREST_AMP * (1 - morph);
      bfy[i] = (isLead ? shoreYs[i]
                       : spawnFar + (shoreYs[i] - spawnFar) * tAdv + crest)
             + (isLead ? 0 : (1 - morph) * fray[i] * W0 * FRAY_FRONT * 0.42);
      // 逐列斜率（反馈七·4 的代理量）：用相邻两列的 y 差，单位 = 每像素
      const dx = (i === 0) ? 0 : (bfy[i] - bfy[i - 1]) / (W / COLS);
      slopeLaw[i] = clamp(Math.abs(dx) * FOAM_SLOPE_GAIN * 4.0, 0, 1);
      // 距离项（次要乘子）：离岸越远越淡，到最远处归零
      // ⭐⭐ **非领头浪用平缓的距离律**（0.35 幂），领头浪的 farLaw 下一行就被
      //   硬编码为 1 ⇒ 距离律本来就**只作用于离岸浪，也就是第二条浪**。
      //   owner：「第二条浪不应该抑制浪花啊，应该一直保持浪花，我才能知道第二条浪
      //   走到哪里了」—— 它的浪花是**位置指示器**，不是装饰。
      //   ⛔ 早先统一用 FOAM_FAR_POW=1.6 仍把它的起步段 kA 压到 0.08，
      //   80.9% 的绘制调用被外海泡沫的 `kA < 0.12` 丢弃 ⇒ 读作「走到中间就没了」。
      //   ⭐ 0.35 幂与 drawDisturbance 里已有的同款处理一致；最外侧仍趋 0。
      //   ⚠️ 副作用（如实记录）：owner 早先「浪线越到远处越浅、最远处与海水同样」
      //   那条诉求，对第二条浪就此作废 —— 两条要求作用在同一批浪上，只能取一。
      farLaw[i] = Math.pow(clamp(1 - (SHORE_K * H - bfy[i]) / (FOAM_FAR_SPAN * H), 0, 1),
                           isLead ? FOAM_FAR_POW : 0.35);
      if (isLead){ slopeLaw[i] = 1; farLaw[i] = 1; }     // 水线处永远满泡沫（反馈七·3）
// ⭐ 泡沫强度 = 倾角律（主）× 距离律（次）。
      //    ⛔⛔ **距离律只作用在泡沫的 alpha 上，不作用在带宽上**。
      //    早先两者都折进 bwj ⇒ 外海的浪整个消失（farLaw 在出生水深 0.42h
      //    处只有 0.03 ⇒ 带宽 ×0.04），整片海上只剩一条极淡的线。
      //    反馈七·4 要的是「泡沫看不见」，不是「浪看不见」——
      //    远处的浪仍然要有形状，只是没有白。
      const foamK = slopeLaw[i] * farLaw[i];
      // ⛔ nb2 的波长早先是 2π/0.0791 ≈ 79px（≈5 列）⇒ 浪带宽度以这个周期
      //    起伏，渲染出来是沿岸一排**等距的小扇贝**，像装饰花边。
      //    降到 0.0290（≈217px）并减小幅度 ⇒ 宽度变化变成缓慢的起伏。
      const nb1 = 0.5 + 0.5 * Math.sin(x * 0.0173 * kScale + t * 0.00017 + wiS * 2.13);
      const nb2 = 0.5 + 0.5 * Math.sin(x * 0.0290 * kScale - t * 0.00062 + wiS * 0.77);
      // 局部「这里有没有浪」的低频包络（反馈六·4）
      const env = isLead ? 1
        : Math.pow(fbmNorm(x * 0.00165 * kScale + wiS * 7.3 + w.seed * 0.001 + t * 0.000012, 8100 + wiS * 53, 2), 2.4);
      // ⭐⭐ 带宽**不允许归零**（owner 选的方案 A）。
      //   ⛔ 早先没有任何下限：三项衰减因子连乘即可把 bwj 乘到 0 ⇒ 那一帧整条
      //     浪带宽度为 0 ⇒ 读作「浪突然消失」。
      //   ⛔ 我最初只以为是 `1 + fray·FRAY_WIDTH` 的问题（owner 也据此选了 A），
      //     ⛔⛔ 但那只钳住了三项里最轻的一项 —— 真正的元凶是
      //     `0.02 + 0.98·env`：`env = pow(fbmNorm(...), 2.4)`，fbmNorm 偏小处被
      //     2.4 次幂压到趋 0 ⇒ 该因子趋 0.02。⇒ 下限必须加在**乘积**上。
      //   harness 实测（修复前，非领头浪）：bwj 中位 0.076 / 最低 0.005；
      //     塌陷率在 adv 80~90% 达 48.5%，平均 bwj 从外海 0.251 缩到 0.113 ——
      //     正是 owner 说的「靠近前浪时突然消失」。
      //   ⚠️ 下限 0.30 是「破碎缺口不再把带宽清零」的意思，不是「取消破碎感」：
      //     缺口仍然让带宽在 0.30~1.0 之间起伏。
      const frayK = 1 + fray[i] * FRAY_WIDTH;                          // 浪脊边缘的破碎缺口
      const envK  = isLead ? 1 : 0.02 + 0.98 * env;                    // 低频包络
      const slK   = isLead ? 1 : 0.30 + 0.70 * slopeLaw[i];            // 倾角律（不用距离律）
      const shrink = Math.max(0.30, frayK * envK * slK);
      bwj[i] = (0.84 + 0.30 * nb1 + 0.14 * nb2) * rag[i] * shrink;
      if (isLead){ edgeYs[i] = bfy[i]; edgeValid = true; }
    }
    // 这条浪的平均距离律（给只有单一 alpha 的唇用）
    let farSum = 0;
    for (let i = 0; i < n; i++) farSum += farLaw[i];
    const farMean = isLead ? 1 : farSum / n;

    // ⭐ 反馈七·4：泡沫强度 = 倾角律（主）× 距离律（次）。逐列 ⇒ 泡沫集中在
    //    浪脊陡的地方、在浪脊平缓与最远处自然消失，而不是一条全局 alpha。
    const boost = isLead ? SHORE_FOAM_BOOST : 1;
    const dir = isLead ? -1 : 1;
    const ladder = isLead ? FOAM_LADDER : FOAM_LADDER_COARSE;
    for (let s = ladder.length - 1; s >= 0; s--){
      fillStrip(lane, s, ladder, ladder[s].a < 0.25 ? 2 : 1,
                W0, kA * boost, t, dir);
    }
    drawSwellBody(lane, W0, kA * boost, dir);
    drawSeaFoamWash(lane, W0, kA * boost, dir);
    drawOpenSeaFoam(lane, W0, kA * boost, t, dir);
    if (!isLead) drawDisturbance(lane, W0, kA, t, dir);   // ⭐ 反馈八·5a
    drawFoamLace(lane, W0, kA * boost, t, dir);
    // ⭐ 反馈七·6：破碎浪脊有一道**锐利的唇**（此前只有柔和中段 ⇒ 丝绸感）
    //    ⛔⛔ 但唇必须吃距离律：唇是一条 1~2px 的硬线，远处本来该「没有泡沫」，
    //    结果它变成一条画在水上的白线 —— 100% 下最像「用笔画了一条」的地方。
    if (!isLead) drawCrestLip(W0, kA * boost * farMean, dir);
    ctx.globalAlpha = 1;
  }
}
/** ⭐ 锐利的浪唇：贴着浪脊前缘的一条很窄的高光带 + 紧贴其后的暗带。
 *  这是「破碎」与「丝绸」的分界 —— 柔和中段只会读成飘动的绸缎。 */
function drawCrestLip(W0, kA, dir){
  const n = COLS + 1;
  ctx.save();
  ctx.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++){
    ctx.beginPath();
    for (let i = 0; i < n; i++){
      const x = bxs[i];
      const y = bfy[i] + dir * (pass === 0 ? LIP_W * 0.35 : LIP_W * 0.95) * bwj[i] * W0;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineWidth = 0.9 + pass * 1.6;
    ctx.strokeStyle = pass === 0 ? '#ffffff' : '#cfe6ea';
    ctx.globalAlpha = (pass === 0 ? 0.85 : 0.42) * clamp(kA, 0, 1);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════════════════
   9 · SPLASH — fine foam specks sprayed shoreward off the crest
   ══════════════════════════════════════════════════════════════════════════ */
function drawSplash(t){
  if (!edgeValid) return;
  const count = Math.floor(SPLASH_MAX * clamp(A.sHigh * 0.85 + 0.15, 0, 1));
  ctx.fillStyle = PAL.foam;
  for (let i = 0; i < count; i++){
    const s = SPLASH[i];
    const u = wrap01(t / s.period + s.phase / s.period);
    if (u > 1) continue;
    const x = s.u * W;
    const crest = edgeYs[Math.min(COLS, Math.round(s.u * COLS))] || H * 0.58;
    const fade = Math.pow(1 - u, 1.15);
    const y = crest + H * s.reach * Math.pow(u, 0.62) + s.lift * H * u;
    const a = SPLASH_A * s.bright * fade * (0.45 + 0.55 * A.sHigh);
    if (a < 0.006) continue;
    ctx.globalAlpha = a;
    const sz = s.size * (1 - 0.35 * u);
    ctx.fillRect(x - sz * 0.5, y, sz, sz * 0.78);
  }
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════════════════
   10 · SAND RIPPLES + RESIDUE DOTS
   ══════════════════════════════════════════════════════════════════════════ */
function drawRipples(t, clipPath){
  const yTop = H * SHORE_K + H * 0.050;
  const yBot = H;
  const groupDrift = 3.0 * Math.sin(t * 0.000095);          // slow, no wrap ⇒ no shimmer
  const span = yBot - yTop;
  // wind ripples catch the light on their crests — dark 1px lines at α≤0.055 on
  // light sand are invisible, so all three tiers are light tints of varying weight.
  // Each line is broken into 2–4 segments: an unbroken full-width line reads as a
  // scanline, not as sand.
  const tiers = [[0.29, '#eedab4'], [0.44, '#f7e8cb'], [0.58, '#fff5e2']];

  ctx.save();
  ctx.clip(clipPath);
  ctx.lineWidth = 1;
  ctx.lineCap = 'round';
  for (let ti = 0; ti < tiers.length; ti++){
    ctx.globalAlpha = SAND_LINE_A * tiers[ti][0] * (0.55 + 0.45 * clamp(0.35 + A.sHigh * 0.9, 0, 1));
    ctx.strokeStyle = tiers[ti][1];
    ctx.beginPath();
    for (let i = 0; i < SAND_LINES; i++){
      if (hash2(i, 77) < 0.18) continue;                    // ⛔ count stays fixed; only visibility varies
      const v = (i + 0.5) / SAND_LINES;
      const y = yTop + v * span + groupDrift
              + 1.0 * Math.sin(t * 0.00021 + i * 0.83);
      const jitter = 0.0056 * H * hash2(i, 21);
      const segs = 2 + Math.floor(hash2(i, 41) * 3);
      for (let g = 0; g < segs; g++){
        const a0 = (g + hash2(i, 60 + g) * 0.55) / segs;
        const a1 = Math.min(1, a0 + (0.55 + 0.45 * hash2(i, 70 + g)) / segs * 0.85);
        const xa = W * a0, xb = W * a1;
        if (xb - xa < 10) continue;
        for (let k = 0; k <= 6; k++){
          const x = lerp(xa, xb, k / 6);
          const yy = y + jitter
                   + 0.0016 * H * Math.sin(x * 0.0071 * kScale + i * 1.9 + t * 0.00012);
          if (k === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
      }
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/** 残沫白点：⛔ 早先是一个纯色小方块 —— 反馈三要求「坐在颗粒上、还带一圈亮边」。
 *  现在画成：软阴影 → 亮芯 → 左上缘高光 ⇒ 球体感，而不是平贴的方点。 */
function drawResidue(clipPath){
  ctx.save();
  ctx.clip(clipPath);
  const dens = clamp(0.40 + 0.60 * A.sHigh, 0, 1);
  const count = Math.ceil(RESIDUE_MAX * dens);
  const yBase = H * SHORE_K + H * 0.085;
  const ySpan = H * (1 - SHORE_K) - H * 0.135;
  for (let i = 0; i < count; i++){
    const p = RESIDUE[i];
    const x = p.u * W;
    const y = yBase + p.v * ySpan;
    const a = RESIDUE_A * p.a * (0.45 + 0.55 * dens);
    const s = p.s;
    // ① 软阴影：略暗、略大 ⇒ 颗粒陷在沙里的凹陷
    ctx.globalAlpha = a * 0.50;
    ctx.fillStyle = '#7A5E38';
    ctx.fillRect(x - s * 0.7, y + s * 0.1, s * 2.0, s * 2.0);
    // ② 亮芯
    ctx.globalAlpha = a * 0.85;
    ctx.fillStyle = '#f2f8f4';
    ctx.fillRect(x, y, s, s * 0.8);
    // ③ 左上缘高光 ⇒ 球体感
    ctx.globalAlpha = Math.min(1, a * 1.2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x, y, s, Math.max(0.7, s * 0.3));
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════════════════
   11 · POST
   ══════════════════════════════════════════════════════════════════════════ */
let grainTick = 0;
const GRAIN_OFF = [[0,0],[37,11],[73,52],[19,88],[61,29],[95,74],[8,41],[52,96]];
function drawPost(reduced){
  if (mottlePattern){                 // ⭐ 低频斑驳：海与沙都不是「平的颜色」
    ctx.save();
    ctx.globalAlpha = MOTTLE_A;
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = mottlePattern;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  if (grainPattern){
    const o = reduced ? GRAIN_OFF[0] : GRAIN_OFF[grainTick % GRAIN_OFF.length];
    if (!paused) grainTick++;          // ⛔ else the grain alone keeps "paused" moving
    ctx.save();
    ctx.globalAlpha = 0.020;
    ctx.globalCompositeOperation = 'overlay';
    ctx.translate(o[0], o[1]);
    ctx.fillStyle = grainPattern;
    ctx.fillRect(-o[0], -o[1], W, H);
    ctx.restore();
  }
  if (vignetteGrad){
    ctx.fillStyle = vignetteGrad;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ══════════════════════════════════════════════════════════════════════════
   12 · MAIN LOOP
   ══════════════════════════════════════════════════════════════════════════ */
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const TIME_SCALE = reduced ? 0.35 : 1.0;

let started = false, lastNow = 0, frozenT = null;

function resize(){
  const w = cvs.clientWidth || window.innerWidth, h = cvs.clientHeight || window.innerHeight;
  if (w === W && h === H && DPR) return;      // guards double-fire from resize + RO
  buildGeometry();
}
addEventListener('resize', resize);
if (window.ResizeObserver){ new ResizeObserver(resize).observe(cvs); }
resize();

function frame(now){
  requestAnimationFrame(frame);
  if (!started || W < 2 || H < 2) return;

  // ⛔ clamp BOTH ends — Math.min alone let a negative dt through and the audio
  //    smoother then diverged, which poisoned swashW0 and made the shore NaN
  const dtReal = lastNow ? clamp((now - lastNow) / 1000, 0, 0.1) : 0.016;
  lastNow = now;
  let t = (now - t0) * TIME_SCALE;
  if (paused){ if (frozenT === null) frozenT = t; t = frozenT; }
  else frozenT = null;

  if (!paused){
    pumpBeats();
    if (analyser && (mode === 'demo' || mode === 'mic')) readAnalyser(dtReal);
    else readFallback(dtReal);
    smoothAudio(dtReal);
  }

  const energy = A.sEnergy;

  // ── ⭐ 顺序就是「从外海走向内陆」的水/沙剖面 ──
  //  外海(最深) → 浅滩(变浅变透) → 浪带 3/2/1 → 贴岸主浪带(＝水边线本身)
  //  → 沙 → 湿沙(滞后) → 浪花手指/残沫/细亮湿线 → 飞沫 → 沙纹 → 残沫点 → 后处理
  const swashW0 = H * SWELL_BAND_W * (0.55 + 0.75 * Math.min(1.35, bandAmp(0)));
  // ⛔ 暂停时 dt 必须传 0 —— 否则 dtReal 继续走，退水段的湿沙会一直变干，
  //    画面在「暂停」状态下仍在缓慢变化
  computeShore(t, swashW0, paused ? 0 : dtReal);
  drawSeaField(t, energy);
  drawCausticNet(t, energy);
  const clip = drawSand(t);
  // ⭐ 蟹画在沙之上、所有泡沫层之下 ⇒ 浪真的能盖住它（浪盖不到的东西不算细节）
  drawCrab(t, paused ? 0 : dtReal);
  drawSwellBands(t);           // 主浪带的浪花直接压在岸线上，并漫到湿沙上
  drawSwashFingers(t);
  drawResidualStreaks(t);
  drawWetLine(t);
  drawSplash(t);
  drawRipples(t, clip);
  drawResidue(clip);
  drawPost(reduced);

  // HUD
  setMeter(mLow, A.sLow); setMeter(mMid, A.sMid); setMeter(mHigh, A.sHigh);
  lvlEl.textContent = (paused ? '⏸ ' : '') + Math.round(energy * 100) + '%';
  syncSolo();          // ⭐ 单浪模式读数（只读状态，不参与模拟）
}

function setMeter(el, v){
  el.style.setProperty('--w', (clamp(v, 0, 1) * 100).toFixed(0) + '%');
}

/* ── start ─────────────────────────────────────────────────────────────── */
function begin(){
  if (started) return;
  started = true;
  t0 = performance.now();
  gate.classList.add('hide');
  panel.classList.add('ready');
  startDemo();
  setTimeout(() => gate.remove(), 900);
}
gate.addEventListener('click', begin);

requestAnimationFrame(frame);
})();
</script>
</body>
