<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>海边 · SEASIDE — 频谱效果原型</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b1214; color: #e8f2f0;
    font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── Control strip ────────────────────────────────────────────── */
  .panel {
    position: fixed; left: 20px; bottom: 20px; z-index: 20;
    display: flex; flex-direction: column; gap: 9px;
    padding: 11px 13px 10px;
    border-radius: 15px;
    background: rgba(11, 20, 22, .42);
    border: 1px solid rgba(242, 247, 245, .13);
    box-shadow: 0 10px 34px rgba(0, 0, 0, .34);
    -webkit-backdrop-filter: blur(15px) saturate(1.25);
    backdrop-filter: blur(15px) saturate(1.25);
    opacity: 0; transform: translateY(10px);
    transition: opacity .8s ease, transform .8s cubic-bezier(.2,.8,.25,1);
    pointer-events: none;
  }
  .panel.ready { opacity: 1; transform: none; pointer-events: auto; }
  .row { display: flex; gap: 6px; }
  .btn {
    appearance: none; border: 1px solid transparent; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    font: inherit; font-size: 12px; letter-spacing: .02em;
    color: rgba(232, 242, 240, .68);
    background: rgba(255, 255, 255, .045);
    padding: 6px 11px; border-radius: 9px;
    transition: background .22s ease, color .22s ease, border-color .22s ease;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(255, 255, 255, .10); color: rgba(232, 242, 240, .92); }
  .btn:focus-visible { outline: 2px solid rgba(242, 247, 245, .55); outline-offset: 2px; }
  .btn.on {
    background: rgba(242, 247, 245, .16); color: #f2f7f5;
    border-color: rgba(242, 247, 245, .30);
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(232, 242, 240, .30);
    transition: background .22s ease, box-shadow .22s ease;
  }
  .btn.on .dot { background: #8fe3d2; box-shadow: 0 0 8px rgba(143, 227, 210, .75); }
  kbd {
    font: inherit; font-size: 9.5px; letter-spacing: .06em;
    color: rgba(232, 242, 240, .42);
    border: 1px solid rgba(232, 242, 240, .16);
    border-radius: 4px; padding: 0 4px; line-height: 14px;
  }
  .meters { display: flex; align-items: center; gap: 10px; padding: 0 2px; }
  .m { display: inline-flex; align-items: center; gap: 5px; }
  .m em {
    font-style: normal; font-size: 9.5px; letter-spacing: .08em;
    color: rgba(232, 242, 240, .40);
  }
  .m b {
    display: block; width: 30px; height: 3px; border-radius: 2px;
    background: rgba(255, 255, 255, .10); position: relative; overflow: hidden;
  }
  .m b::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 0;
    right: var(--w, 100%);
    background: linear-gradient(90deg, #7fd6cf, #f2f7f5);
    transition: right .06s linear;
  }
  .lvl {
    font-size: 9.5px; letter-spacing: .08em; margin-left: auto;
    color: rgba(232, 242, 240, .34); font-variant-numeric: tabular-nums;
  }
  .note {
    font-size: 10px; letter-spacing: .03em; color: #ffbf9c;
    max-width: 250px; opacity: 0; transition: opacity .3s ease;
  }
  .note.show { opacity: 1; }

  /* ── 单浪模式读数（键 1）─────────────────────────────────────────────
     ⛔ 不复用 .note：那是给橙色闪动提示用的，max-width 250px + 短文案。
     这里是一行长遥测，需要更宽、更暗、等宽感，且**常驻可见**（不用 opacity）。 */
  .solo {
    font-size: 10.5px; letter-spacing: .02em; line-height: 1.55;
    color: #cfe6ea; opacity: .92;
    font-variant-numeric: tabular-nums;
    max-width: none; margin-top: 6px;
    padding-top: 6px; border-top: 1px solid rgba(160,220,230,.16);
  }
  .solo b { color: #8fe3d6; font-weight: 600; }
  .solo[hidden] { display: none; }

  /* ── Start gate ───────────────────────────────────────────────── */
  #gate {
    position: fixed; inset: 0; z-index: 40;
    display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 40%, rgba(8,16,18,.42), rgba(6,12,14,.80));
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    transition: opacity .7s ease, -webkit-backdrop-filter .7s ease, backdrop-filter .7s ease;
    cursor: pointer;
  }
  #gate.hide { opacity: 0; pointer-events: none; backdrop-filter: blur(0); }
  .gate-in { text-align: center; padding: 24px; transform: translateY(-2vh); }
  .overline {
    font-size: 10px; letter-spacing: .42em; text-transform: uppercase;
    color: rgba(242, 247, 245, .40); margin-bottom: 20px;
  }
  .title {
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC",
                 "SimSun", Georgia, "Times New Roman", serif;
    font-size: clamp(46px, 8vw, 88px); font-weight: 400;
    letter-spacing: .22em; margin: 0 0 6px; color: #f4faf8;
    text-shadow: 0 4px 40px rgba(0, 0, 0, .45);
  }
  .sub {
    font-size: 12px; letter-spacing: .20em; color: rgba(232, 242, 240, .44);
    margin-bottom: 40px;
  }
  .cta {
    display: inline-flex; align-items: center; gap: 11px;
    font-size: 12.5px; letter-spacing: .20em; color: #f2f7f5;
    border: 1px solid rgba(242, 247, 245, .28);
    border-radius: 999px; padding: 12px 26px;
    background: rgba(242, 247, 245, .07);
    animation: breathe 3.4s ease-in-out infinite;
  }
  .cta .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: #8fe3d2;
    box-shadow: 0 0 0 0 rgba(143, 227, 210, .55);
    animation: ping 2.4s ease-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0); background: rgba(242,247,245,.07); }
    50%      { transform: translateY(-3px); background: rgba(242,247,245,.13); }
  }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(143,227,210,.55); }
    70%  { box-shadow: 0 0 0 11px rgba(143,227,210,0); }
    100% { box-shadow: 0 0 0 0 rgba(143,227,210,0); }
  }
  .keys {
    margin-top: 34px; font-size: 10.5px; letter-spacing: .10em;
    color: rgba(232, 242, 240, .32);
  }
  @media (prefers-reduced-motion: reduce) {
    .cta, .cta .pulse { animation: none; }
  }
  @media (max-width: 560px) {
    .panel { left: 12px; bottom: 12px; padding: 9px 10px 8px; }
    kbd { display: none; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="panel" id="panel">
  <div class="row">
    <button class="btn on" data-act="demo"><span class="dot"></span>演示 <kbd>D</kbd></button>
    <button class="btn" data-act="mic"><span class="dot"></span>麦克风 <kbd>M</kbd></button>
    <button class="btn" data-act="pause"><span class="dot"></span>暂停 <kbd>Space</kbd></button>
    <button class="btn" data-act="solo"><span class="dot"></span>单浪 <kbd>1</kbd></button>
  </div>
  <div class="solo" id="solo" hidden></div>
  <div class="meters">
    <i class="m"><b id="mLow"></b><em>低</em></i>
    <i class="m"><b id="mMid"></b><em>中</em></i>
    <i class="m"><b id="mHigh"></b><em>高</em></i>
    <span class="lvl" id="lvl">—</span>
  </div>
  <div class="note" id="note"></div>
</div>

<div id="gate">
  <div class="gate-in">
    <div class="overline">E43 · Audio Spectrum</div>
    <h1 class="title">海边</h1>
    <div class="sub">SEASIDE — aerial shoreline</div>
    <div class="cta"><span class="pulse"></span>点击开始 · Tap to start</div>
    <div class="keys">D 演示 &nbsp;·&nbsp; M 麦克风 &nbsp;·&nbsp; Space 暂停</div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ══════════════════════════════════════════════════════════════════════════
   0 · PARAMETERS — 全部对应方案 §5 的初值，Kotlin 端口可逐项对照
   ══════════════════════════════════════════════════════════════════════════ */
// ⭐ 岸线就是 0 号浪带（贴岸主浪带）的前缘。水与沙之间没有一条「色界线」，
//    交界处本身就是那层浪花 —— 这是反馈二的要点。
// ⭐ 反馈七·2：所有者决定把水线抬到 ~0.62h（海略过半屏，同时留够沙滩给颗粒）。
//    0.740 → 0.620。随之：
//      · SEA_BOTTOM_K 必须 ≥ 水线的最大上冲（0.62 + 0.105·1.40 = 0.767）
//        再留破碎余量 ⇒ +0.20 = 0.820（原 +0.13 是按旧的 0.740 定的）
//      · 沙滩从 0.26h 变成 0.38h，多了 1.46 倍，所以 SWASH_REACH 反而**上调**
//        0.095 → 0.105：水线跑 0.105h，留 0.275h 的干沙滩
//      · 干燥时间常数改挂到「出浪间隔」而不是固定周期（见下）
const SHORE_K        = 0.620;   // 岸线的平均位置（占 h）
// the sea field is painted a little past the waterline (the waterline itself
// swings) so no unpainted seam can ever show
const SEA_BOTTOM_K   = SHORE_K + 0.20;

// ══════════════════════════════════════════════════════════════════════════
// 反馈七·5 ⭐⭐ 浪是**离散的个体**，排成队列一轮一轮替换，不是相位三角。
// ══════════════════════════════════════════════════════════════════════════
const WAVE_POOL    = 6;       // 同时在册的浪数上限
// ⭐⭐ 反馈八：T 的散布必须 < 出浪间隔 ⇒ 先后次序永不翻转（后面的浪永远
//    追不上前面的，也就不需要「追上替换」）。存活数 ≈ (T̄ + FADE)/GAP
//    = (5000 + 900)/2360 ≈ 2.5 条在场（稳态 2~3 条）。
const WAVE_GAP_MS  = 2360;    // 出浪间隔（决定海面上同时有 ~2.5 条浪）
const WAVE_T_MIN   = 4200;    // 最快的一条浪从外海跑到滩上所需时间（ms）
const WAVE_T_MAX   = 5800;    // 最慢的（T 散布 1600 < GAP 2360 ⇒ 次序稳定）
// ⛔ 已删除 `WAVE_REACH_Y`（与下面的 `W_REACH_Y` 同值 1.00、零引用的重复声明）。
// ⭐⭐ 反馈八：浪不再「出生在固定水深再上滩」—— 统一前缘公式里前缘深度
//    = H·swashReachNow·(5·adv−4)：adv=0 出生在外海约 0.42h、adv=0.8 越过
//    平均岸线、adv=1 涌到滩顶（+SWASH_REACH）。出生水深与上滩距离因此
//    天然解耦，浪列分散在整个海域，不需要独立的 WAVE_SPAWN_K。
const WAVE_FADE_MS = 900;     // 消散时泡沫在滩上原地淡出的时长
const WAVE_SPAWN_RAMP_MS = 700; // 出生后泡沫淡入时长（不「啪」地出现）
const SWASH_RETREAT_MS = 440;  // 退水时长**下限**（前浪消散后水线向海后退）
// ⭐ 退水时长**上限**。owner：「前浪回退不应该退到中间就停止了，应该继续回退，
//   直到碰到后浪」⇒ 不该固定 440ms 退完就静止等后浪（实测要等 ~2s）。
//   ⛔ 但完全按后浪 ETA 自适应会把退水拉到 ~5.7s（94.5px/5.7s ≈ 17px/s），
//   实测中位后退只剩 6.1px —— 那已经不叫退水了。⇒ 在 [下限, 上限] 间自适应。
const SWASH_RETREAT_MAX = 1600;
let retreatDur = SWASH_RETREAT_MS;   // 本帧实际选定的退水时长（阶段判定/HUD 共用同一值）
const SWELL_BAND_W = 0.042;   // 浪带宽度（占 h）
const SWASH_REACH  = 0.105;   // 浪完全涌上滩时，水线高出平均岸线的距离（占 h）
// ── 反馈八·10「破碎线 / 冲流线解耦」（owner 选方案 3）────────────────────────
// ⭐ 一条浪带**两个位置量**，各管一件事：
//   · 破碎线（breaker）：H·(SHORE_K − WAVE_SPAWN_DEPTH) → shoreYs[i]，行程约 **640px**。
//     这是**画出来的白浪带**，也是「第二条浪全程可见」的依据。
//   · 冲流线（swash）：swashFrontY → wlineFull，行程只有 H·SWASH_REACH ≈ 81px。
//     这是**水在沙滩上的边缘**，驱动湿沙/退水/干燥。
//   交接不再是「位置突变」，而是**职责增加**：破碎线走到滩上（adv→1）时，它的位置
//   本来就等于冲流线满位 ⇒ 无跳变；且它**不消失**，只是开始同时定义冲流线。
// ⛔ 早先把两者塞进一个 adv（破碎线 ~640px vs 冲流线 81px），交接判据
//   `front.y >= a` 拿两个参数化空间直接比较 ⇒ 瞬移 150~387px（已修，见下）。
//   ⚠️ 出生水深 WAVE_SPAWN_DEPTH 决定破碎线**总行程**：改它会同时改「海面铺开多远」
//     与「进入画面的角度」，交接连续性不受影响（终点恒为 shoreYs[i]）。
// ⭐ 破碎线的出生水深（占 h）。owner：「后浪直接浮现在上面 1/6 左右的位置，而不是从
//   边缘进入」⇒ 出生点必须落在**画面顶边略上方**（y 略小于 0），让它从画外滑入。
//   ⛔ 0.42 时 spawnFar = H·(0.62−0.42) = 0.20h ≈ 180px ⇒ 浮在顶部 1/5 处。
//   ⭐ 0.66 ⇒ spawnFar = −0.04h（顶边上方 36px）；顺带把破碎线行程从 ~459px
//   拉长到 ~640px（终点 shoreYs 实测 535~637px），海面铺开更远。
const WAVE_SPAWN_DEPTH = 0.66;
const SWASH_LEAD_ADV  = 0.85;    // 破碎线走到这个 adv 就开始驱动冲流（上涌）
const SWASH_RUNUP_MS  = 900;     // 冲流从 0 爬到满位所需时间（破碎线抵滩时恰好满位）
// ⭐ 干燥时间常数挂到出浪间隔上：两个浪之间裸露的时间就是 WAVE_GAP_MS。
const SWASH_DRY_FRAC = 0.60;
const SWASH_DRY_MIN  = 420;
const SWASH_DRY_MAX  = 2600;
const SWASH_LAG       = 0.16;  // 逐列推进滞后（占 y）⇒ 水线参差成舌
// ⭐ 相邻浪共用**同一条**浪脊剖面、只在 u 上错开一段（不是各自独立的噪声）。
//    真实涌浪是一组相干的浪列；用独立噪声会让相邻带交叉出透镜状伪影。
const CREST_LANE_SHIFT = 0.18;
// ⭐ 破碎线（后浪）浪脊相位随**该浪自己的 adv** 漂移的总量（u 单位）。
//   owner：「后浪的曲线现在是固定的，应该随着前进方向，一直在变化，但变化不要太大」。
//   ⛔ 早先挂在全局时间 t*0.0000060：后浪一生 ~10s 期间 u 仅变 0.06 ⇒ 读作固定。
//   ⭐ 0.35 ⇒ 整条旅程里曲线相位走 0.35u（等效 ≈103px），每帧 ≈0.10px。
const CREST_DRIFT_ADV = 0.35;
// ⭐ 出生淡入按**行程**计（占 adv）。owner：「后浪是凭空出现的吗？应该从最远端
//   逐渐清晰化出现」。⛔ 纯时间淡入 700ms 在后浪一生（~10s）里只占 7% ⇒ 看着像
//   「凭空出现」；加上行程淡入后，它在最远端那 1/5 行程里逐渐清晰化。
const WAVE_SPAWN_FADE_ADV = 0.20;
// ⭐⭐ 交接地形态连续化的起点（adv）。后浪从 MORPH_START 起把**整个位置**连续插值到
//   前浪的 shoreYs ⇒ 位置与曲线形态一起变成前浪的，adv=1 时严格相等。
//   ⛔ 早先的做法是在最后 15%（SWASH_LEAD_ADV=0.85）才开始，用 crestK 把 198px 的
//     起伏淡出到 0 ⇒ owner 报「接近前浪时曲线形状跳变」。
//   ⚠️ 0.55 ⇒ 过渡占行程 45%，198px 的变化摊到 ~2.5 万帧里（约 0.008px/帧）。
const MORPH_START = 0.55;
// ⭐⭐ 反馈七·4「泡沫的距离律」：泡沫强度随离岸距离衰减，到最远处与海水无异。
//    这是**次要**乘子；主要定位由「浪面倾角律」负责（见 foamSlope）。
//    0.62h → 0.12h 覆盖整个海域；pow 2.4 让最外那条几乎归零。
const FOAM_FAR_SPAN = 0.50;
// harness 实测（60fps/90s，按 adv 分桶量 kA）：⛔ pow 2.4 时第二条浪
//   adv 0..0.2 的 farLaw 只有 0.043、kA 0.061，**67% 的绘制调用 kA<0.12 被 cull**
//   （外海泡沫/扰动的下限）⇒ 它整条读作「没有白沫」；领头浪因 farLaw/slopeLaw
//   被硬编码为 1，kA 是它的 5~6 倍。
//   ⇒ 2.4 太陡：pow 1.6 让 0.043→0.08、中段 0.16→0.30，最外侧仍趋 0
//   （保留 owner「最远处与海水同样」的诉求），但中段浪全程可见。
const FOAM_FAR_POW  = 1.6;
// ⭐ 反馈七·4 的「倾角律」增益：把 |dy/dx| 归一化到 0..1
const FOAM_SLOPE_GAIN = 0.62;
const COLS            = 96;
// 外海泡沫（反馈六·5 / 七·6）
const SEA_FOAM_TILES  = 6;       // 烘出来的泡沫贴图张数（每张 256×256）
const SEA_FOAM_PATCH  = 22;      // 每条浪铺多少块贴图
const SEA_FOAM_A      = 0.46;    // 泡沫贴图的整体强度
// ⭐ 波面上的**大白沫晕**：一条浪不是只有前缘那一线白 —— 破碎之后整个浪面
//    都挂着被搅起来的水沫，前缘最亮、往后拖出长长的尾迹。
//    ��有这一层，100% 下看到的是「沿着浪脊画了一道白轮廓线」。
const SEA_FOAM_WASH_A = 0.34;
const SEA_FOAM_WASH_BACK = 2.4;  // 往后拖几个浪带宽
const SEA_FOAM_WASH_FRONT = 0.30; // 前缘往前出多少个浪带宽
// ⭐ 反馈八·5a「离岸浪读成苍白的水脊」：每条推进中的浪都必须把**前缘前方**的
//    水搅出碎沫（a wake-like band of agitation ahead of a moving crest），
//    浪才读成「正在破碎移动的水」，而不是一条静止的淡色脊。
//    这一层把烘好的泡沫贴图**前置**到浪脊前方 0.3~1.45 个带宽处：贴图本身是
//    撕碎的丝缕，前方就是翻涌的碎沫、拖到浪后变成尾迹；逐块吃 slopeLaw×farLaw
//    ⇒ 陡的浪面多搅、最远处照旧归零。⚠ 只对海里的浪画（贴岸领头浪的前缘
//    就是水线本身，那里的泡沫由贴岸各层负责）。
const DISTURB_PATCH = 18;      // 每条浪的扰动块数
const DISTURB_DEP0  = 0.30;    // 距浪脊前缘最近（占带宽）
const DISTURB_DEP1  = 1.45;    // 最远
const DISTURB_A     = 2.40;    // 扰动强度（碎沫贴图比拖尾小 ⇒ 需要更高 alpha 才看得见）

const SAND_TEX_TOP = 0.46;
const SAND_GRAIN_A  = 0.062;   // 细颗粒（像素尺度，主导纹理）

const SAND_RIPPLE_A = 0.040;   // 宽而柔的沿岸起伏带

/** 确定性 2D 值噪声（hash 晶格 + 双线性），用于沙的斑驳与条纹扭曲 */
function vnoise2(x, y, seed){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
  const h = function (a, b){
    return hash32((Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663) ^ seed) | 0);
  };
  return lerp(lerp(h(xi, yi), h(xi + 1, yi), sx),
              lerp(h(xi, yi + 1), h(xi + 1, yi + 1), sx), sy);
}

const PAL = {
  seaFar:'#2E9AA8', seaNear:'#1E7A8C', seaDeep:'#14586B',
  ridge:'#6FD0CC', trough:'#0E4A5C', shoal:'#A6D8C4',
  wet:'#B08A5E', sandNear:'#C9A063', sandMid:'#C4A876', sandFar:'#D9BE8C',
  foam:'#F2F7F5', foamCore:'#CBE7E3', foamTail:'#B4DEDA', caustic:'#EAF6FF',
  // 沙滩偶客：一只小螃蟹。陶土橙压一点灰 —— 纯饱和橙会在暖沙上炸成一小块广告。
  crabShell:'#B4603A', crabShellHi:'#D4905F', crabRim:'#6A3520',
  crabLeg:'#83422A', crabLegFar:'#63301D', crabClaw:'#C97245', crabShadow:'#4A3520'
};

/* ── deterministic hash / RNG (⛔ never Math.random) ──────────────────── */
function hash32(x){
  x = (x ^ 61) ^ (x >>> 16); x = (x + (x << 3)) | 0;
  x = Math.imul(x, 0x27d4eb2d); x ^= x >>> 15;
  return (x >>> 0) / 4294967296;
}
function hash2(i, salt){ return hash32(Math.imul(i + 1, 2654435761) ^ Math.imul(salt + 7, 40503)); }
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ── math helpers ─────────────────────────────────────────────────────── */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
function smoothstep(e0, e1, x){ const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
function wrap01(v){ const r = v % 1; return r < 0 ? r + 1 : r; }

// sin LUT — hot loop in the water field calls this hundreds of thousands of times
const LUT_N = 4096, LUT_MASK = 4095, LUT_SCALE = 4096 / (Math.PI * 2);
const SIN = new Float32Array(LUT_N + 1);
for (let i = 0; i <= LUT_N; i++) SIN[i] = Math.sin(i / LUT_SCALE);
function fsin(a){ return SIN[(a * LUT_SCALE | 0) & LUT_MASK]; }

function hexRgb(h){
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

/* ══════════════════════════════════════════════════════════════════════════
   1 · CANVAS
   ══════════════════════════════════════════════════════════════════════════ */
const cvs = document.getElementById('stage');
const ctx = cvs.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;
let kScale = 1;                 // keeps the scallop count stable across window sizes

const fieldCvs = document.createElement('canvas');
const fieldCtx = fieldCvs.getContext('2d', { alpha: false });
let fieldImg = null, fw = 0, fh = 0, fieldData = null;
// 反馈六·4：粗糙度场与行级对比度场（沿 x / 沿 y 各一份，O(fw)+O(fh)）
let roughX = null, rowAmp = null, roughY = null;

// cached geometry (rebuilt on resize only)
let vignetteGrad = null;
let grainPattern = null, mottlePattern = null;
let colPhase = null, colMid = null, colFine = null;
let rowPhase = null, rowMid = null, rowFine = null;

function buildGeometry(){
  DPR = clamp(window.devicePixelRatio || 1, 1, 2);
  W = cvs.clientWidth || window.innerWidth;
  H = cvs.clientHeight || window.innerHeight;
  cvs.width  = Math.max(2, Math.round(W * DPR));
  cvs.height = Math.max(2, Math.round(H * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
  if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';

  kScale = 1920 / Math.max(W, 1);

  const seaPx = Math.max(4, Math.round(H * SEA_BOTTOM_K * DPR));
  const scale = clamp(Math.ceil(Math.sqrt((W * DPR * seaPx) / 52000)), 4, 14);
  fw = Math.max(2, Math.ceil((W * DPR) / scale));
  fh = Math.max(2, Math.ceil(seaPx / scale));
  fieldCvs.width = fw; fieldCvs.height = fh;
  fieldImg = fieldCtx.createImageData(fw, fh);
  fieldData = fieldImg.data;

  colPhase = new Float32Array(fw);   // x-dependent phase of the big swell
  colMid   = new Float32Array(fw);   // x-dependent phase of the mid ripple
  colFine  = new Float32Array(fw);   // x-dependent phase of the fine chop
  rowPhase = new Float32Array(fh);   // y-dependent phase of the big swell
  rowMid   = new Float32Array(fh);   // y-dependent phase of the mid ripple
  rowFine  = new Float32Array(fh);   // y-dependent phase of the fine chop
  // 反馈六·4：行/列级粗糙度与对比度场
  roughX   = new Float32Array(fw);   // x-dependent roughness (calm gaps vs trains)
  rowAmp   = new Float32Array(fh);   // y-dependent crest contrast
  roughY   = new Float32Array(fh);   // y-dependent roughness

  // ⛔ 干沙底色不再用 CanvasGradient —— 反馈三要求沙有像素级颗粒/起伏带/
  //    潮湿斑，那只能走 ImageData。渐变已由 buildSandTexture() 烘成纹理。
  // ⛔ 湿沙不再用固定渐变 —— 反馈二要求它随涌浪周期逐列变化：
  //    宽度/深浅来自 per-column 的 wetEdge/wetAmt，由 drawWetWash() 现场生成。

  const vr = Math.hypot(W, H) * 0.62;
  vignetteGrad = ctx.createRadialGradient(W * 0.5, H * 0.46, vr * 0.30, W * 0.5, H * 0.5, vr);
  vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vignetteGrad.addColorStop(0.72, 'rgba(3,10,12,.10)');
  vignetteGrad.addColorStop(1, 'rgba(3,10,12,.34)');

  buildGrain();
  buildSandTexture();
  buildFoamTiles();   // 反馈六·5：外海泡沫贴图，resize 时烘一次
  buildLaceNet();     // 反馈八·5b：水线蕾丝的「网」拓扑，resize 时烘一次
  buildCausticNet();  // 反馈八·5c：焦散胞格网的格壁拓扑，resize 时烘一次
  resetWaves();     // 反馈七·5：换尺寸时不留半个浪队列
}

/* ══════════════════════════════════════════════════════════════════════════
   沙面纹理（反馈三）—— ⭐ 烘一次，之后每帧只 blit
   分层：底色渐变 + 像素级细颗粒 + 第二层细砂 + 宽柔沿岸起伏带 + 潮湿斑块
   ══════════════════════════════════════════════════════════════════════════ */
const sandTex = document.createElement('canvas');
let sandTexTop = 0;
function buildSandTexture(){
  const tw = Math.max(4, Math.round(W * DPR));
  const top = H * SAND_TEX_TOP;
  sandTexTop = top;
  const th = Math.max(4, H - top);
  // 一次性开销要可控：像素太多就按比例降采样
  const k = Math.min(1, Math.sqrt(3200000 / (tw * th)));
  const sw = Math.max(4, Math.round(tw * k)), sh = Math.max(4, Math.round(th * k));
  sandTex.width = sw; sandTex.height = sh;
  const c = sandTex.getContext('2d');
  const id = c.createImageData(sw, sh);
  const d = id.data;

  const cNear = hexRgb(PAL.sandNear), cMid = hexRgb(PAL.sandMid), cFar = hexRgb(PAL.sandFar);
  const cDamp = hexRgb('#8E7048');
  let p = 0;
  for (let y = 0; y < sh; y++){
    const v = y / (sh - 1);                       // 0 = 靠水, 1 = 画面下缘
    const t = Math.pow(v, 0.86);
    // ① 底色：靠水更暗更湿，下缘更亮更干
    let r = t < 0.42 ? lerp(cNear[0], cMid[0], t / 0.42) : lerp(cMid[0], cFar[0], (t - 0.42) / 0.58);
    let g = t < 0.42 ? lerp(cNear[1], cMid[1], t / 0.42) : lerp(cMid[1], cFar[1], (t - 0.42) / 0.58);
    let b = t < 0.42 ? lerp(cNear[2], cMid[2], t / 0.42) : lerp(cMid[2], cFar[2], (t - 0.42) / 0.58);
    const dampDrift = 1 - 0.10 * (1 - v);        // 整体湿→干的微渐变

    for (let x = 0; x < sw; x++){
      const u = x / (sw - 1);

      // ② 宽而柔的沿岸起伏带：被低频噪声扭曲，所以不是等距直线
      const warp = vnoise2(u * 3.1, v * 2.2, 7717) * 2.6 + vnoise2(u * 7.7, v * 5.0, 3313) * 1.1;
      const rip = Math.sin((v * SAND_RIPPLE_N + warp) * Math.PI * 2);
      const ripK = 1 + SAND_RIPPLE_A * rip;

      // ③ 潮湿斑块：软边低频斑。近水处更多，但整块干沙也有零星几片
      const dv = vnoise2(u * 4.3, v * 3.1, 9151) * 0.62 + vnoise2(u * 11.0, v * 7.0, 4423) * 0.38;
      const damp = smoothstep(0.54, 0.82, dv)
                 * (0.30 + 0.70 * (1 - smoothstep(0.10, 0.80, v))) * SAND_DAMP_A;

      let rr = r * ripK, gg = g * ripK, bb = b * ripK;
      rr = lerp(rr, cDamp[0], damp); gg = lerp(gg, cDamp[1], damp); bb = lerp(bb, cDamp[2], damp);

      // ④ 像素级细颗粒（主导纹理）+ 更细的第二层
      const g1 = hash32(Math.imul(y, 374761393) + Math.imul(x, 668265263) + 12345) - 0.5;
      const g2 = hash32(Math.imul(y, 1274126177) + Math.imul(x, 2654435761) + 777) - 0.5;
      const grain = g1 * SAND_GRAIN_A + g2 * SAND_GRAIN2_A;
      const gain = dampDrift;

      const R = (rr + grain * 255 * gain) * (1 - damp * 0.10);
      const G = (gg + grain * 255 * gain) * (1 - damp * 0.10);
      const B = (bb + grain * 255 * gain) * (1 - damp * 0.10);
      d[p]     = R < 0 ? 0 : R > 255 ? 255 : R;
      d[p + 1] = G < 0 ? 0 : G > 255 ? 255 : G;
      d[p + 2] = B < 0 ? 0 : B > 255 ? 255 : B;
      d[p + 3] = 255;
      p += 4;
    }
  }
  c.putImageData(id, 0, 0);
}

// fine film grain — a 128px tile, offsets cycle so it never crawls
const GRAIN_N = 128;
const grainCvs = document.createElement('canvas');
grainCvs.width = grainCvs.height = GRAIN_N;
// ⭐ low-frequency mottle: bilinear value-noise on a 16×16 lattice, so it holds
// NO high frequencies at all — it adds tonal variation without any moiré risk
const MOTTLE_N = 256, MOTTLE_CELLS = 16;
const mottleCvs = document.createElement('canvas');
mottleCvs.width = mottleCvs.height = MOTTLE_N;
function buildGrain(){
  const g = grainCvs.getContext('2d');
  const id = g.createImageData(GRAIN_N, GRAIN_N);
  const rnd = mulberry32(0x9E3779B9);
  for (let i = 0; i < GRAIN_N * GRAIN_N; i++){
    const v = clamp(128 + (rnd() - 0.5) * 96, 0, 255) | 0;
    id.data[i*4] = id.data[i*4+1] = id.data[i*4+2] = v;
    id.data[i*4+3] = 255;
  }
  g.putImageData(id, 0, 0);
  grainPattern = ctx.createPattern(grainCvs, 'repeat');

  // value noise: random lattice, bilinear interpolation, ⛔ never Math.random
  const m = mottleCvs.getContext('2d');
  const mid = m.createImageData(MOTTLE_N, MOTTLE_N);
  const mr = mulberry32(0x1D3A5C7);
  const lat = new Float32Array(MOTTLE_CELLS * MOTTLE_CELLS);
  for (let i = 0; i < lat.length; i++) lat[i] = mr();
  const step = MOTTLE_N / MOTTLE_CELLS;
  for (let y = 0; y < MOTTLE_N; y++){
    const gy = y / step, y0 = gy | 0, fy = gy - y0;
    const sy = fy * fy * (3 - 2 * fy);
    for (let x = 0; x < MOTTLE_N; x++){
      const gx = x / step, x0 = gx | 0, fx = gx - x0;
      const sx = fx * fx * (3 - 2 * fx);
      const a = lat[(y0 % MOTTLE_CELLS) * MOTTLE_CELLS + (x0 % MOTTLE_CELLS)];
      const b = lat[(y0 % MOTTLE_CELLS) * MOTTLE_CELLS + ((x0 + 1) % MOTTLE_CELLS)];
      const c = lat[((y0 + 1) % MOTTLE_CELLS) * MOTTLE_CELLS + (x0 % MOTTLE_CELLS)];
      const d = lat[((y0 + 1) % MOTTLE_CELLS) * MOTTLE_CELLS + ((x0 + 1) % MOTTLE_CELLS)];
      const n = lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
      const v = clamp(96 + n * 96, 0, 255) | 0;
      const p = (y * MOTTLE_N + x) * 4;
      mid.data[p] = v; mid.data[p+1] = v; mid.data[p+2] = v; mid.data[p+3] = 255;
    }
  }
  m.putImageData(mid, 0, 0);
  mottlePattern = ctx.createPattern(mottleCvs, 'repeat');
}

/* ══════════════════════════════════════════════════════════════════════════
   2 · SCATTERED POINTS — 飞沫 / 残沫，⛔ 确定性烘焙，绝不 Math.random
   ══════════════════════════════════════════════════════════════════════════ */
const SPLASH = [];
for (let i = 0; i < SPLASH_MAX; i++){
  SPLASH.push({
    u:      hash2(i, 1),                                   // column 0..1
    period: 900 + 1500 * hash2(i, 2),                      // life cycle ms
    phase:  hash2(i, 3) * 4000,
    reach:  0.008 + 0.075 * hash2(i, 4),                   // travel distance (fraction of h)
    lift:   (hash2(i, 5) - 0.5) * 0.022,                   // lateral scatter
    size:   0.9 + 2.8 * hash2(i, 6),
    bright: 0.30 + 0.70 * hash2(i, 7)
  });
}

// residue dots: seeded LCG with a minimum-separation rejection ⇒ 孤立、不成纹.
// v is biased toward the wet-sand edge (residue foam collects where the water
// last reached) rather than spread evenly over the dry sand.
const RESIDUE = [];
{
  const rnd = mulberry32(0x5EA51DE);
  const MIN_SEP2 = 0.092 * 0.092;
  let tries = 0;
  while (RESIDUE.length < RESIDUE_MAX && tries < 8000){
    tries++;
    const u = 0.03 + 0.94 * rnd();
    const v = Math.pow(rnd(), 0.62) * 0.94;        // sqrt-ish ⇒ denser near the top
    let ok = true;
    for (let k = 0; k < RESIDUE.length; k++){
      const du = RESIDUE[k].u - u, dv = RESIDUE[k].v - v;
      if (du*du + dv*dv < MIN_SEP2){ ok = false; break; }
    }
    if (!ok) continue;
    RESIDUE.push({ u, v, s: 1.0 + 2.6 * rnd(), a: 0.5 + 0.5 * rnd() });
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   3 · PURE GEOMETRY (mirrors the plan's companion object)
   ══════════════════════════════════════════════════════════════════════════ */
let t0 = 0;

/** 确定性 1-D 值噪声（hash 晶格 + smoothstep 插值）—— 沿shore轴的随机性来源 */
function noise1(x, seed){
  const xi = Math.floor(x), xf = x - xi;
  const s = xf * xf * (3 - 2 * xf);
  return lerp(hash2(xi, seed), hash2(xi + 1, seed), s);
}
/** 分形叠加（fBm），八度比 2.07 ⇒ 频率互不成整数比 ⇒ 没有可察觉的重复。
 *  ⛔ 衰减用 0.5 时能量几乎全在最低八度 ⇒ 浪脊波长很长、幅度很小，
 *    看起来就是几条平缓的带子。把衰减放缓到 0.60，能量更多地留在
 *    中间八度 ⇒ 浪脊才有「起伏」而不是「一条斜线」。 */
function fbm1(x, seed, oct){
  let a = 0, amp = 0.5, f = 1;
  for (let o = 0; o < oct; o++){
    a += amp * (noise1(x * f, seed + o * 977) * 2 - 1);
    f *= 2.07; amp *= 0.60;
  }
  return a;
}

/** ⭐⭐ 把 fbm1 的输出**拉满到 0..1**，供各种包络/密度场使用。
 *
 *  ⛔⛔ fbm1 的实际 p10..p90 只有 ±0.39（oct=2 实测，见 range.js），
 *    而不是理论上的 ±0.5。反馈六里我到处写 `0.5 + 0.62*fbm1(...)`，
 *    结果所有包络都被压在 0.26~0.74：既到不了 0（这条浪列消失 ⇒
 *    「局地浪列 / 平静空档」做不出来），也到不了 1（最强处不够强）。
 *    这就是「加了包络但看起来没变化」的原因。
 *  0.5 + 1.45·fbm1 ⇒ p10..p90 覆盖 0..1，p1..p99 略微溢出、交给 clamp。 */
function fbmNorm(x, seed, oct){
  return clamp(0.5 + 1.45 * fbm1(x, seed, oct), 0, 1);
}
/** 同上，但返回 −1..1（给需要双向偏移的场合，例如逐列相位滞后） */
function fbmSigned(x, seed, oct){
  return (fbmNorm(x, seed, oct) - 0.5) * 2;
}

/** ⭐ 浪脊横向剖面（反馈一 a/b）—— 域扭曲的 fBm，不是正弦叠加。
 *  ⛔ 之前是 5 个正弦 ⇒ 视觉上「一排等距平行波」，像碗里的涟漪。
 *  ① 域扭曲（两个低频 fBm 偏移采样坐标）⇒ 浪脊自己会拐弯、成 S，
 *     局部在推进、局部在后退，而不是整齐的平行正弦
 *  ② 四段八度、频率互不成整数比 ⇒ 眼睛找不到重复
 *  ③ env 包络 ⇒ 有的岸段浪脊又长又强，有的短而碎（间距/长度/曲率都在变）
 *  ④ u 里含 t ⇒ 整个图案沿shore缓慢漂移，任何时刻都不会两次相同 */
function crestProfile(u, seed){
  const wx = fbm1(u * 0.83, seed + 511, 2);
  const wy = fbm1(u * 0.61, seed + 733, 2);
  const v  = u + wx * 1.70 + wy * 0.85;
  // ⛔ 包络下限 0.30 → 0.12：反馈六·3「有的地方弧得很高、有的地方一直很低」。
  //    0.30~1.00 时所有岸段的浪脊强度差不多，读起来还是「一条平缓的带」。
  const env = 0.12 + 0.88 * (0.5 + 0.5 * fbm1(u * 0.37, seed + 613, 2));
  return (0.62 * fbm1(v, seed + 101, 4) + 0.38 * fbm1(v * 2.9, seed + 211, 2)) * env;
}

/** ⭐ 水位场 —— 浪脊由 crestProfile 给出，横向形状随机且连续演化。
 *  ⭐ `layer` 只用来在剖面上**错开**一段（CREST_LANE_SHIFT）：四条浪带是
 *    同一条剖面的平移副本 ⇒ 看起来是一组相干的浪列（真实涌浪就是这样），
 *    而且相邻带的差值只有「局部斜率 × 错开量」，绝不会互相穿越。
 *  ⛔ 早先每条带一个独立 seed（811 + L*104729）⇒ 要么交叉产生透镜伪影，
 *    要么根本不像同一组浪。
 *  ⛔ 漂移 0.000060 → 0.0000060：**10× 更慢**（19.4 px/s → 1.9 px/s）。
 *    反馈六·1「海浪太快了」；反馈一的「图案沿shore缓慢漂移、任何时刻不重复」
 *    靠的是分钟量级 —— 这个速率下 60 s 走 117px，仍在变，但一帧一帧看不出来。 */
/* ⛔ 已删除 `waveFrontY(x, t, baseY, h, layer)` 与 `waveDepthK(w, adv)`（反馈八·9）。
 *   它们给非领头浪的前缘用**破碎线尺度**（行程约 340px），而领头浪用水线尺度
 *   （H·swashReachNow ≈ 81px）—— 两套**互不兼容的坐标定义**。交接判据
 *   `front.y >= a` 于是变成拿两个不同参数化空间的 adv 直接比较，交接发生在
 *   「破碎线还远在海外」的时刻（实测 adv 0.41~0.77），整条带瞬移 150~267px。
 *   owner 选方案 B 后，两端统一到水线空间定位，见 drawSwellBands 的 bfy 计算。
 *   ⚠️ 不要把破碎线尺度的定位加回来 —— 它与交接连续性天然冲突。 */
/** ⭐ 岸线（= 0 号浪带前缘）的**平均**位置：不含涌浪周期，
 *  真正的水线 = 这里 + 涌浪推进量（见 computeShore）
 *  ⚠ 振幅克制：±0.02·h 左右。早先按 WAVE_A 原样叠加出 ±0.10·h，岸线像山脉。 */
function swashFrontY(x, t, h){
  let y = h * SHORE_K;
  y += h * 0.0060 * Math.sin(t * 0.000042);                     // 潮汐：极慢整体升降
  // ⛔ 漂移速率 0.000052 → 0.0000105（约 5× 更慢）。反馈六·1：「海浪太快了」。
  const u = x * 0.00310 * kScale + t * 0.0000105;
  y += crestProfile(u, 2711) * h * CREST_AMP_SHORE;
  return y;
}
/* ══════════════════════════════════════════════════════════════════════════
   反馈七·5 + 反馈三·3 · ⭐⭐ 浪队列 —— 离散的浪，一条一条走完一生
   ══════════════════════════════════════════════════════════════════════════
   为什么不能用相位三角：所有者要的是**个体**。
     「N 到达滩上 → 原地消散 → 水线后退（露出湿沙、干燥锋面跟进）→
       N+1 的前缘追上退中的水线 → 水线随 N+1 重新上涌 → N+1 到滩消散 → 再退 …」
   相位三角（sin 曲线）永远做不到「后退 / 前缘追上」的离散交接。

   ⛔ 反馈三·3：**海里没有「被追上顶替」这回事** —— 一条浪只有走到滩上
      （y ≥ W_REACH_Y）才算终点，中途**绝不会**被消耗。
   ⭐ 不相交保证（跟随者更慢 ⇒ 比早先「T 跨度 < 出浪间隔」强得多）：
      领头浪 T ≤ WAVE_T_MAX 5800ms；跟随者 T ≥ FOLLOW_T_SLOW × WAVE_T_MIN
      = 2.0 × 4200 = 8400ms ⇒ 相邻到达至少相隔 **≥2600ms**
      ⇒ 后面那条永远追不上前面那条，自然不需要顶替。

   数据结构：定长池 WAVE_POOL 个槽位，每个槽位就是一条浪：
   ┌──────────────────────────────────────────────────────────────────┐
   │ state   生命周期状态（见下）                                     │
   │ y       行程 0 = 外海出生线，1.0 = 到达滩上                       │
   │ v       推进速度（每 ms 的 Δy，出生时定死，途中不变）              │
   │ reach   这条浪自己的涌高系数（每条浪舌头形状不同）                  │
   │ seed    这条浪自己的 hash 种子（形状/长度各不相同）                 │
   │ aliveT  出生后已过的毫秒数（泡沫淡入用）                          │
   │ fadeT   消散已进行的毫秒数                                       │
   │ hit     到过滩上？= 会留湿沙                                     │
   │ peak[]  到达滩上那一瞬、逐列的水线 y（= 湿沙高水位）               │
   └──────────────────────────────────────────────────────────────────┘

   状态转移（唯一允许的边）：
     (空槽) ──spawn──▶ ADVANCING
     ADVANCING ──y ≥ W_REACH_Y──▶ REACHED        到达滩上
     REACHED  ──同一帧──▶ FADING                   消散（**留**湿沙）
     FADING   ──fadeT ≥ WAVE_FADE_MS──▶ DEAD        淡出完毕，槽位回收
     DEAD     ──▶ (空槽)
   ⛔ 只有 REACHED 才写湿沙（commitWetMarks）—— 上冲途中一个字都不写，
     这正是反馈七·1「湿沙只在退水之后出现」。
   ⛔ 滩上最后一条浪 DEAD 之后，水线进入**退水**（SWASH_RETREAT_MS，见
     waterlineAdvance）：后退到被下一条 ADVANCING 浪的前缘追上为止（交接），
     若海面暂时没有浪则钉在海缘等待 —— 这就是「退水 + 干燥锋面」的节奏源。

   ⛔⛔ 反馈六·2 的时钟约束依然成立：这里只吃 dt（以及 hash）。
      dt 在暂停时是 0，所以暂停会真正冻结整个队列。
   ══════════════════════════════════════════════════════════════════════════ */
const W_EMPTY = 0, W_ADVANCING = 1, W_REACHED = 2, W_FADING = 3;
const W_REACH_Y = 1.00;   // y 到 1.0 = 「到达滩上」⇒ 消散
// ⛔⛔ **不设「到达间隔」常量**。这里曾有 MIN_ARRIVE_GAP_MS = 1300，用于强行
//   保证后浪比前浪晚到 ≥1300ms。owner 指出这是错的：两条浪本来就该**独立**，
//   「第二条浪来得早就退得短、来得晚就退得长」正是要保留的自然变化。强行等间隔
//   既抹掉了变化，又把后浪顶到离滩很近的位置 ⇒ 退水恒为 117ms/20.7px。
//   ⛔ 位置钳位（WAVE_SPACING_Y）更早被移除：它把后浪冻在 0.45，adv 从未超过 0.6。
//   ⇒ 现在两条浪之间**没有任何人为的时间或位置约束**，只有各自独立的 T。
// ⭐ 补浪时机：前一条走过 WAVE_FOLLOW_Y（**约 1/3 行程**，⛔ 不是大半程）就补
//   下一条排在它后面 ⇒ 稳态恒为「1 条在最前 + 1 条排队」（owner）。
//   定时器（WAVE_GAP_MS）只做海面全空时的最小间隔闸。
const WAVE_FOLLOW_Y = 0.62;
// ⭐ 跟随者（海面上第二条浪）的行程倍率 —— >1 即更慢。
//   owner：「第二条浪走的太快了，前浪还没来得及回退」+「靠近前浪时还是会消失」。
//   ⛔ 不是到达间隔硬约束（那条被 owner 明确否定），只是把后浪的 T 分布后移。
//   ⚠️ 调大幅度会同时拉长周期：1.5 ⇒ 周期约 +50%，浪更稀疏。
const FOLLOW_T_SLOW = 2.0;
const waves = [];
let waveSerial = 0, spawnAcc = 0;
let retreatT = -1;        // 退水已进行的毫秒数；<0 = 不在退水（水线由浪驱动）
for (let i = 0; i < WAVE_POOL; i++) waves.push({ state: W_EMPTY, y: 0, v: 0, reach: 1, seed: 0, serial: -1, aliveT: 0, fadeT: 0, hit: false, swashT: 0 });
/* ══════════════════════════════════════════════════════════════════════════
   ⭐⭐ 单浪模式（临时看「一条浪的完整生命周期」）—— 键 `1` / 面板按钮
   ──────────────────────────────────────────────────────────────────────────
   ⛔ **只过滤绘制，完全不动模拟**：队列照旧补浪、间距钳位、交接、退水全保留。
      若改成「只发一条浪」，那条浪消散后海上会空一段（退水钉在海缘等它），
      看到的就不是真实节奏了 —— 而 owner 要看的是**真实模型里**一条浪的一生。
   ⭐ 跟踪用 **serial** 而不是对象引用：waves[] 是定长池、槽位会回收复用，
      引用会把「下一条浪」误认成同一条。serial 每出生 +1，天然区分。 */
let soloWave = false;     // 单浪模式开关
let soloSerial = -1;      // 当前跟踪的那条浪的 serial；-1 = 还没选
const soloInfo = { on: false, have: false, phase: '', state: 0, adv: 0, fade: 0,
                   v: 0, reach: 0, ser: -1, ms: 0, wline: 0, retreating: false,
                   wetMax: 0, nextIn: -1 };
const SOLO_PHASE = ['空槽', '推进中', '抵滩', '消散', '已回收'];
/** 选一条浪跟踪：优先最靠岸的那条（owner 关注的是最前浪），否则最靠外海的。 */
function soloPick(){
  let beach = null, front = null;
  for (let i = 0; i < WAVE_POOL; i++){
    const w = waves[i];
    if (w.state === W_EMPTY) continue;
    const b = (w.state === W_REACHED || w.state === W_FADING);
    if (b && !beach) beach = w;
    if (!front || w.y > front.y) front = w;
  }
  const pick = beach || front;
  if (pick) soloSerial = pick.serial;
}
/** 每帧更新单浪读数。⛔ 严格只读：绝不调用任何有副作用的模拟函数。 */
function soloTick(){
  soloInfo.on = soloWave;
  soloInfo.have = false;
  if (!soloWave) return;
  const find = () => {
    for (let i = 0; i < WAVE_POOL; i++)
      if (waves[i].state !== W_EMPTY && waves[i].serial === soloSerial) return waves[i];
    return null;
  };
  let w = find();
  if (!w){
    soloPick();                       // 跟踪对象消散了 ⇒ 换下一条
    w = find();
    // ⛔ 海上可能**一条浪都没有**（初始态 / 两条浪之间的空窗）⇒ soloPick 挑不到，
    //   serial 不变 ⇒ 这里若递归回去就是**无限递归**（实测 Maximum call stack
    //   size exceeded，frame 0 直接崩）。故：找不到就留空，下一帧再挑。
    if (!w) return;
  }
  soloInfo.have = true;
  soloInfo.ser = w.serial;
  soloInfo.state = w.state;
  soloInfo.phase = SOLO_PHASE[w.state] || '?';
  soloInfo.adv = clamp(w.y, 0, 1);
  soloInfo.fade = waveFade(w);
  soloInfo.v = w.v;
  soloInfo.reach = w.reach;
  soloInfo.ms = w.aliveT;
  // ⛔ 水线读数取 swashPos 的均值，**不能调 waterlineAdvance()**：那个函数
  //   有副作用（beach 分支会写 retreatT = -1，retreat 分支会做交接），
  //   在 HUD 里调它等于每帧偷偷改模拟状态 —— 与「只过滤绘制」的承诺矛盾，
  //   也会让「单浪开关不改变模拟」的对照实验因错误原因失败。
  let sum = 0;
  for (let c = 0; c <= COLS; c++) sum += swashPos[c];
  soloInfo.wline = COLS > 0 ? sum / (COLS + 1) : 0;
  soloInfo.retreating = retreatT >= 0 && retreatT < retreatDur;
  let wm = 0, nw = -1;
  for (let c = 0; c <= COLS; c++) if (wetMark[c] > wm) wm = wetMark[c];
  soloInfo.wetMax = wm;
  for (let i = 0; i < WAVE_POOL; i++){
    const o = waves[i];
    if (o.state === W_ADVANCING && o.serial !== soloSerial && (nw < 0 || o.y > nw)) nw = o.y;
  }
  soloInfo.nextIn = nw;
}
for (let i = 0; i < WAVE_POOL; i++) waves[i].peak = new Float32Array(COLS + 1);

function spawnWave(){
  let slot = -1;
  for (let i = 0; i < WAVE_POOL; i++) if (waves[i].state === W_EMPTY){ slot = i; break; }
  if (slot < 0) return false;                 // 池满：这一拍不出浪（不丢帧、不跳变）
  const w = waves[slot], sd = 3300 + waveSerial * 733;
  // ⭐⭐ **到达间隔** —— 替代曾经的 WAVE_SPACING_Y 位置钳位。
  //   把这条浪的行程**抬高**，使它至少比前浪晚到 MIN_ARRIVE_GAP_MS。
  //   ⇒ 后浪全程**自由推进**（位置不被冻结，符合 owner「中间不停顿」），且必定
  //     晚到 ⇒ 前浪消散 + 水退完之后它才抵达，退水窗口才看得见。
  //   ⛔ 不抬高 T 的话，两条浪几乎同时到滩，后浪贴在 y=1.0 等岸，前浪一消散就被
  //     接管 ⇒ 退水被压成闪动（harness 实测 83ms/13.5px = 满程的 14%）。
  //   ⛔ 也因此不再有「T 散布 < 出浪间隔 ⇒ 次序永不翻转」那条保证：现在的保证是
  //     **构造出来的到达间隔**，比散布强 —— 前浪的剩余时间被显式算了进去。
  // ⛔⛔ 扫描「前浪」必须在这条浪被写成 ADVANCING **之前**，并且按身份排除自身。
  //   否则会扫到**刚创建的自己**：那时 w.y=0、w.v 还是上一条浪残留的 0 ⇒
  //   frontRemainMs = (1-0)/0*1000 = Infinity ⇒ T=Infinity ⇒ w.v=0 ⇒ 这条浪
  //   永远不动；而且它一直挂在池里，之后每次发浪都再算出一个 Infinity
  //   （harness 实测：ser0 T=Infinity v=0 front=ser0，海上只剩 1 条不会动的浪）。
  // ⭐⭐ **跟随者减速**（owner：「第二条浪走的太快了，前浪还没来得及回退」）。
  //   ⛔ 这**不是**硬性到达间隔 —— owner 明确否定过那种「强行限制」（它把退水
  //     压成恒定的 117ms/20.7px，抹掉了「来得早就退得短、来得晚就退得长」）。
  //     这里只把**后浪的行程分布整体后移**，每条浪仍然抽自己的随机 T。
  //   ⭐ 为什么这同时修掉「靠近前浪时消失」：后浪不再在领头浪消散前就推进到
  //     adv 0.9+、深进领头浪那条更亮的泡沫带 —— 两条带重叠合并后，后浪就失去
  //     可辨识性（它一直在被画，只是画在别人里面）。
  //   ⚠️ 判据必须在写 w.state 之前算：否则会把自己算成跟随者（下面 front 扫描
  //     已经踩过这个坑，见 T=Infinity 那条注释）。
  let follower = false;
  for (let i = 0; i < WAVE_POOL; i++)
    if (waves[i].state === W_ADVANCING){ follower = true; break; }
  const f = fbmNorm(waveSerial * 1.37, sd, 3);
  const T = lerp(WAVE_T_MIN, WAVE_T_MAX, f) * (follower ? FOLLOW_T_SLOW : 1);
  // ── 字段一次性写完（v 必须与 state 同批落地，不能留 0 给上面的扫描）────────
  w.serial = waveSerial;                    // ⭐ 单浪模式靠它区分「同槽位复用 = 不同的浪」
  waveSerial++;
  w.state  = W_ADVANCING;
  w.y      = 0;
  w.v      = 1 / T;                         // ⭐ 速度出生时定死、途中不变
  w.reach  = 0.62 + 0.78 * fbmNorm(waveSerial * 2.11, sd + 7, 2);   // 0.62..1.40
  w.seed   = sd;
  w.aliveT = 0;
  w.fadeT  = 0;
  w.hit    = false;
  w.swashT = 0;                // ⭐ 冲流计时（反馈八·10）：出生时为 0
  return true;
}

/** 推进整个队列一帧（第一段：出浪 / 推进 / 到达）。
 *  ⛔ 这里**不做** REACHED→FADING：那一步必须等 computeShore 把当帧的逐列
 *    水线写进 w.peak[] 之后才能做，否则 peak 永远是空的、湿沙永远不出现
 *    （这个顺序错误真实发生过：wetMark 一列都没被写过）。
 *  ⛔⛔ 反馈三·3：**没有「被追上/顶替」** —— ADVANCING 的浪不会被任何东西
 *    消耗，唯一的终点就是 y ≥ W_REACH_Y。T 值域跨度 < 出浪间隔，所以
 *    后面那条永远追不上前面那条，这个不变式由构造保证（见 spawnWave）。 */
function stepWaves(dt){
  const dms = dt * 1000;
  // ── 出浪调度：稳态恒为「1 条在最前 + 1 条排队」（owner）───────────────
  //   判据是**前浪是否过半程**，不是固定出浪定时器：
  //   ⛔ 定时器与行程不同步 ⇒ 补浪时早时晚，实测「两个槽位同时存在」的帧
  //       只占 16%，读作「海上只有 1 条浪」。
  //   ⛔ 滩上正有浪在消散时不补：此时「最前」已被占住，再补就变成 3 条。
  spawnAcc += dms;
  let advN = 0, beachAny = false, front = null;
  for (let i = 0; i < WAVE_POOL; i++){
    const o = waves[i];
    if (o.state === W_REACHED || o.state === W_FADING) beachAny = true;
    if (o.state !== W_ADVANCING) continue;
    advN++;
    if (!front || o.y > front.y) front = o;
  }
  let want = false;
  if (beachAny) want = false;                                   // 前槽已占
  else if (advN === 0) want = spawnAcc >= WAVE_GAP_MS;          // 海面空：受最小间隔闸
  else if (advN === 1 && front.y >= WAVE_FOLLOW_Y) want = true; // 前浪过半程：补一条排队
  if (want && spawnWave()) spawnAcc = 0;

  // ① 推进 + 到达判定。
  //    ⛔ 防御性闸门：滩上还有浪在消散（REACHED/FADING）时，后来的浪贴岸
  //    **等待**（y 钳在 1.0，但不转入 REACHED）—— 只是等，不是被消耗；
  //    滩上一空，下一帧立即到达。正常情况下相邻到达至少相隔 ≥2600ms
  //    （见上「不相交保证」），闸门只在边角情形短暂生效。
  let shoreBusy = false;
  for (let i = 0; i < WAVE_POOL; i++){
    const s = waves[i].state;
    if (s === W_REACHED || s === W_FADING){ shoreBusy = true; break; }
  }
  for (let i = 0; i < WAVE_POOL; i++){
    const w = waves[i];
    if (w.state === W_EMPTY) continue;
    w.aliveT += dms;
    // ⭐ 反馈八·10：破碎线进入上涌区（adv ≥ SWASH_LEAD_ADV）后开始**驱动冲流**。
    //   ⚠️ 对 REACHED/FADING 也累积（它们 y 保持 1.0 ≥ 0.85）—— 冲流要在浪
    //   抵滩后继续爬到满位，于是「破碎线到达滩上」与「冲线满位」同时发生。
    if (w.y >= SWASH_LEAD_ADV) w.swashT += dms;
    if (w.state !== W_ADVANCING) continue;
    // ⭐⭐ **自由推进，不做位置钳位**。owner 要求后浪「一直向沙滩推进，直到遇上
    //   回退的海水，中间不停顿」「应该一直推进到沙滩的」。
    //   浪与浪的分开靠**发浪时的到达间隔**（MIN_ARRIVE_GAP_MS），不是靠冻结位置。
    //   ⛔ 冻结位置（曾用 WAVE_SPACING_Y）实测有害：后浪 adv **从未超过 0.6**、
    //   永远到不了滩，且 67% 的绘制调用因 kA 过低被 cull ⇒ 读作「走到中间就消失」。
    //   ⛔ shoreBusy 闸门保留（正常情况下已不会触发）：滩上有浪在消散时贴岸的浪
    //   **等待**，只是等、不是被消耗，滩上一空下一帧立即到达。
    w.y += w.v * dms;
    if (w.y >= W_REACH_Y){
      w.y = W_REACH_Y;
      if (!shoreBusy) w.state = W_REACHED;
    }
  }
}
/** ⭐ 把队列恢复到「海上一条浪都没有」的初始态。
 *  resize() 会调用它（换尺寸时不该留半个队列）；harness 也用它来证明
 *  「音频不进时间轴」—— 从同一个初态跑两遍，状态必须逐字相同。 */
function resetWaves(){
  for (let i = 0; i < WAVE_POOL; i++){
    const w = waves[i];
    w.state = W_EMPTY; w.y = 0; w.v = 0; w.reach = 1; w.seed = 0; w.serial = -1;
    w.aliveT = 0; w.fadeT = 0; w.hit = false; w.swashT = 0;
    for (let c = 0; c <= COLS; c++) w.peak[c] = -1e9;
  }
  waveSerial = 0; spawnAcc = 0; retreatT = -1; soloSerial = -1; soloInfo.have = false;
}
/** 第二段：REACHED → FADING、淡出、回收、起退水。
 *  必须在 computeShore 写完 peak[] 之后调用。 */
function finishWaves(dt){
  const dms = dt * 1000;
  for (let i = 0; i < WAVE_POOL; i++){
    const w = waves[i];
    if (w.state !== W_REACHED) continue;
    w.state = W_FADING; w.fadeT = 0; w.hit = true;
    // ⭐ owner：「然后浪花消失同时海水回退」—— ⛔ 早先是**先后**：抵滩后先淡出
    //   WAVE_FADE_MS(900ms)，等浪死透才起退水 ⇒ 泡沫早已消失，退水才开始。
    //   ⭐ 改为**抵滩即起退水**：泡沫在 WAVE_FADE_MS 里淡出、退水在 retreatDur 里
    //   回落，两者**并行** ⇒ 视觉上「浪花消失」与「海水回退」同时发生。
    //   ⚠️ 只在滩上**最后**一条时起退（否则前一条还在，前一条的水线该继续主导）。
    // ⛔⛔ 且**退水已在进行时不得重新起退**（harness 实测的 78.79px 跳变根因）：
    //   若此时把 retreatT 重置为 0，下一帧的退水推进量会从「已接近完全退回」
    //   （实测 meanAdv 0.0685）被瞬间拽回满位（0.9611）⇒ 水线一帧跳 78px。
    {
      let stillBeach = false;
      for (let j = 0; j < WAVE_POOL; j++){
        const o = waves[j];
        if (o !== w && (o.state === W_REACHED || o.state === W_FADING)){ stillBeach = true; break; }
      }
      if (!stillBeach && retreatT < 0) retreatT = 0;
    }
    // ⛔ 补浪**不在这里**做：出浪调度统一由 stepWaves 按「前浪过半程」判定，
    //    在此再发一次会绕过「滩上不补」的约束 ⇒ 海上多出一条。
  }
  for (let i = 0; i < WAVE_POOL; i++){
    const w = waves[i];
    if (w.state !== W_FADING) continue;
    w.fadeT += dms;
    if (w.fadeT >= WAVE_FADE_MS){
      w.state = W_EMPTY; w.y = 0; w.fadeT = 0; w.hit = false;
      // ⭐ **兜底触发**：若这条浪抵滩时前一条还在滩上（见上段的 stillBeach 守卫），
      //   那次「抵滩即起退水」会被跳过；而它的 REACHED 转换已经发生过了、不会
      //   再触发 ⇒ 整轮退水被吞掉（harness 实测：90 秒只剩 1 次退水）。
      //   ⇒ 滩上最后一条消失时补一次。⛔ 同样要求退水未在进行（否则会把水线
      //   从已退回的位置瞬间拽回满位 —— 那就是 78.79px 跳变的根因）。
      let left = false;
      for (let j = 0; j < WAVE_POOL; j++){
        const s = waves[j].state;
        if (s === W_REACHED || s === W_FADING){ left = true; break; }
      }
      if (!left && retreatT < 0) retreatT = 0;
    }
  }
}
/** 领头的浪 —— 水线就跟着它。
 *  ⛔ 必须把 FADING 也算进来：到达滩上正在消散的那条，**仍然定义着水线**，
 *    否则会出现「有浪在消散却没有 lead」⇒ 泡沫前缘与沙面脱开 100px。
 *  ⭐ 滩上的浪（REACHED/FADING）**优先**于海里的浪：同一帧里若有一条在滩上
 *    消散、另一条贴岸等待（y 都到 1.0），那条**正在消散的**才是水线的定义者。 */
function leadWave(){
  let best = null;
  for (let i = 0; i < WAVE_POOL; i++){
    const w = waves[i];
    if (w.state === W_EMPTY) continue;
    if (!best) { best = w; continue; }
    const bBeach = best.state === W_REACHED || best.state === W_FADING;
    const wBeach = w.state === W_REACHED || w.state === W_FADING;
    if (wBeach && !bBeach){ best = w; continue; }
    if (wBeach === bBeach && w.y > best.y) best = w;
  }
  return best;
}
/** ⭐⭐ 队列级水线推进量 0..1 —— 新生命周期下全队列的**单一驱动**：
 *  ① 有浪在滩上（REACHED/FADING）：钉在 1（浪在原地消散，水线停在涌高顶点）；
 *  ② 前浪已亡、退水进行中：按 SWASH_RETREAT_MS 后退；后退途中若最靠岸的
 *     ADVANCING 浪的前缘（行程）追上退中的水线 ⇒ 交接，水线随它重新上涌；
 *     退到海缘（=0）而浪还很远 ⇒ 钉在海缘等它（交接判定持续生效）；
 *  ③ 无滩上浪、也不在退水：水线跟着最靠岸的 ADVANCING 浪走（0..1），
 *     没有浪则为 0（海平面）。
 *  ⛔ 交接点按构造连续：交接发生的那一帧，浪的行程恰好追上退水推进量。 */
function waterlineAdvance(dms){
  // ⭐⭐ 反馈八·10（方案 3）：冲流线由「**冲流拥有者**」定义，而拥有者是一条
  //   **破碎线已经走上涌区**的浪 —— 交接不再是位置突变，而是职责增加。
  //   优先级：滩上的浪（REACHED/FADING）> 破碎线已进上涌区的浪（取 y 最大的）。
  // ⛔⛔ 这里**不再**有任何 `front.y >= a` 这类比较：那是拿破碎线 adv（459px 尺度）
  //   与冲流 adv（81px 尺度）直接比 —— 两种参数化空间不可比，正是 150~267px 瞬移
  //   的根源（实测交接发生在 adv 0.41~0.77，即破碎线还远在海外时）。
  let owner = null, ownerBeach = false, front = null;
  for (let i = 0; i < WAVE_POOL; i++){
    const w = waves[i];
    if (w.state === W_EMPTY) continue;
    const isBeach = (w.state === W_REACHED || w.state === W_FADING);
    if (isBeach){ if (!ownerBeach){ owner = w; ownerBeach = true; } continue; }
    if (w.state === W_ADVANCING && (!front || w.y > front.y)) front = w;
    if (w.swashT <= 0) continue;                        // 破碎线还没进上涌区
    if (!owner || (!ownerBeach && w.y > owner.y)) owner = w;
  }
  const push = owner ? clamp(owner.swashT / SWASH_RUNUP_MS, 0, 1) : 0;
  if (retreatT >= 0){                                   // 退水：冲流回落，露出湿沙
    retreatT += dms;
    // ⭐⭐ 退水**自适应**：让它恰好在「后浪抵达上涌区」那一刻收尾。
    //   owner：「前浪回退不应该退到中间就停止了，应该继续回退，直到碰到后浪」。
    //   ⛔ 固定 SWASH_RETREAT_MS 的病：水线 440ms 就退完，然后**静止等**后浪
    //     （实测等 ~2s）—— 视觉上就是「退到一半停住不动了」。
    //   ⭐ 用后浪进入上涌区的 ETA 作退水时长下限（w.v 是 adv/ms，故 ETA 直接是 ms）。
    const eta = front ? Math.max(0, (SWASH_LEAD_ADV - front.y) / front.v) : 0;
    retreatDur = Math.max(SWASH_RETREAT_MS, Math.min(SWASH_RETREAT_MAX, eta));
    const a = Math.max(0, 1 - retreatT / retreatDur);
    // ⭐ **同空间**比较：a 与后浪的 nextPush 都是「冲流 adv」（0=完全退回，1=满位），
    //   两者交叉时交接 ⇒ 水线连续。
    //   ⛔ 早先的 `front.y >= a` 是拿**破碎线 adv**（459px 尺度）比**冲流 adv**
    //   （81px 尺度）—— 两个参数化空间不可比，那才是 150~387px 瞬移的根源。
    // ⛔⛔ 交接必须拿**非滩上**的 owner（即正在进来的后浪）的 push 比：
    //   · 排除 ownerBeach：退水改为「抵滩即起」后，起退水时 owner 正是那条刚
    //     抵滩的浪、swashT 已满 ⇒ push = 1，而 a 起始也是 1 ⇒ `push >= a` 立刻
    //     成立 ⇒ 退水在第一帧就被取消（harness 实测：退水只剩 1 次）。
    //   ⛔⛔ 但⛔ **不能**写成 `front !== owner`：后浪进上涌区后自己就成了 owner，
    //     于是条件永远不成立 ⇒ 交接永不触发 ⇒ retreatT 永远不重置为 −1 ⇒
    //     之后所有起退水的守卫（retreatT < 0）全被挡住 ⇒ 整轮退水被吞。
    const incoming = (owner && !ownerBeach) ? owner : null;
    const nextPush = (incoming && incoming.swashT > 0)
                   ? clamp(incoming.swashT / SWASH_RUNUP_MS, 0, 1) : 0;
    if (nextPush > 0 && nextPush >= a){ retreatT = -1; return nextPush; }
    return a;
  }
  if (owner) return push;
  return 0;                                             // 无拥有者 ⇒ 冲流完全退回
}
/** 浪的泡沫可见度：出生淡入（WAVE_SPAWN_RAMP_MS，no pop），淡出时线性归零 */
function waveFade(w){
  if (!w) return 0;
  // ⭐ 出生淡入 = 时间淡入 × **行程淡入**。
  //   owner：「后浪是凭空出现的吗？应该从最远端逐渐清晰化出现」。
  //   ⛔ 只用时间：700ms 在后浪一生（~10s）里只占 7% ⇒ 视觉上就是「凭空出现」。
  //   ⭐ 行程淡入让它在**最远端那 WAVE_SPAWN_FADE_ADV（20%）段里逐渐清晰化**，
  //     到岸附近时 rampIn 已满（y=1），与从前一致。
  const rampIn = clamp(w.aliveT / WAVE_SPAWN_RAMP_MS, 0, 1)
               * clamp(w.y / WAVE_SPAWN_FADE_ADV, 0, 1);
  if (w.state !== W_FADING) return rampIn;
  return rampIn * clamp(1 - w.fadeT / WAVE_FADE_MS, 0, 1);
}
/* ⛔ `waveDepthK(w, adv)` 已删除（反馈八·9）。它把出生水深（0.42h）与上滩距离
 *   解耦，撑起了「浪列铺开 340px」的破碎线尺度 —— 但那套尺度与水线尺度不兼容，
 *   正是交接瞬移 150~267px 的根源。删除说明见 waveFrontY 处的注释块。 */
/** ⭐ 反馈七·1：湿沙高水位**只在浪到达滩上那一瞬**写入。
 *  ⛔ 上冲途中一个字都不写 —— 那里的沙还在水下。 */
function commitWetMarks(){
  for (let i = 0; i < WAVE_POOL; i++){
    const w = waves[i];
    if (w.state !== W_FADING || !w.hit) continue;
    for (let c = 0; c <= COLS; c++){
      if (w.peak[c] > wetMark[c]) wetMark[c] = w.peak[c];
      if (w.peak[c] > -1e8) wetAmt[c] = 1;
    }
  }
}

/** ⭐ 层序强度（反馈七·5 后不再按「层号」而是按**离岸进度**）。
 *  反馈六的版本按层号 rank 递减，那是「四条固定泳道」的遗产；
 *  现在一条浪离岸越近越强 —— 这既是物理，也让远处的浪自然淡出。 */
function layerAlpha(adv, energy){
  const nearness = clamp(adv, 0, 1);                          // 0 = 最外海，1 = 到滩上
  // ⭐ 近岸项的下限 0.22 → 0.32。harness 实测：⛔ 0.22 时第二条浪**起步段**
  //   （adv 0..0.2）的 kA 只有 0.055，87.7% 的绘制调用被外海泡沫的
  //   `kA < 0.12` 丢弃 ⇒ owner 读作「关掉单浪模式白沫就没了」。
  //   ⚠️ 只抬高**下限**，不改斜率与距离律（FOAM_FAR_POW）—— 「最远处与海水
  //   同样」这个诉求由距离律负责，两件事分开调。
  const strength = 0.32 + 0.68 * nearness;                     // ⭐ 越靠岸越强
  const thresh   = ENERGY_TO_LAYERS * 0.5 * (1 - nearness);
  const appear   = 0.30 + 0.70 * smoothstep(thresh, 1, energy);
  return clamp(strength * appear, 0, 1);
}
/** ⭐ 浪心（heart）的 alpha：⛔ 两端都低于中部 ⇒ 帐篷形，与前缘合成「双峰」。
 *  宽平台而非尖峰 —— 参考图里大片白水体才是浪带的主体。峰值锁在 FOAM_CORE_A 以内。 */
function foamCoreAt(n){
  if (n <= HEART_IN || n >= HEART_OUT) return 0;
  return FOAM_CORE_A
       * smoothstep(HEART_IN, HEART_FULL, n)
       * (1 - smoothstep(HEART_HOLD, HEART_OUT, n));
}
/** ⭐ 前缘（crest）：唇口最实（≈FOAM_EDGE_A）并保持 CREST_HOLD 那么宽，
 *  之后才衰减。早期版本从 n=0 就开始掉，前段只剩几像素亮线，
 *  整体读成「玻璃带」而不是白沫 —— 这是「不真实」的主因之一。 */
function foamEdgeAt(n){
  if (n >= CREST_OUT) return 0;
  return FOAM_EDGE_A * 0.94 * (1 - smoothstep(CREST_HOLD, CREST_OUT, n));
}
/** 拖尾（tail）的 alpha：先平滑接入浪心，再二次渐隐，正好归零 */
function foamTailAt(n){
  if (n >= TAIL_OUT) return 0;
  const ramp = smoothstep(TAIL_IN, TAIL_IN + 0.16, n);
  const u = clamp((n - TAIL_IN) / (TAIL_OUT - TAIL_IN), 0, 1);
  return 0.175 * ramp * (1 - u) * (1 - u);
}
/** 泡沫总剖面（供生成阶梯） */
function foamTargetAt(n){ return foamEdgeAt(n) + foamCoreAt(n) + foamTailAt(n); }

/** ⭐ 把解析剖面量化为若干条「互不重叠」的窄带 —— 逐条填充即得该剖面。
 *  前缘处边界更密（唇口是眼睛读得最细的地方），后段可用半分辨率采样。
 *  14 段 rmsErr 0.026；只用 10 段会升到 0.038，浪带内部显出「等高线」分层。 */
const FOAM_EDGES = [0, .035, .075, .125, .185, .255, .335, .425, .525, .635, .765, .905, 1.07, 1.25];
function buildLadder(edges){
  const out = [];
  for (let i = 0; i < edges.length - 1; i++){
    const mid = (edges[i] + edges[i + 1]) / 2;
    const a = foamTargetAt(mid);
    if (a < 0.006) continue;                       // ⛔ 丢弃不可见窄带
    out.push({ n0: edges[i], n1: edges[i + 1], a });
  }
  return out;
}
function fillTears(L){
  const slow = (L & 1) === 0;
  for (let i = 0; i <= COLS; i++){
    const x = W * i / COLS;
    if (slow){
      ragA[i] = 1 + 0.22 * Math.sin(x * 0.0410 * kScale + L * 1.73)
                   + 0.12 * Math.sin(x * 0.1490 * kScale + L * 0.41);
    } else {
      ragB[i] = 1 + 0.15 * Math.sin(x * 0.0885 * kScale + L * 2.91)
                   + 0.08 * Math.sin(x * 0.2630 * kScale + L * 1.09);
    }
  }
}
const FOAM_LADDER = buildLadder(FOAM_EDGES);
// 外侧两条弱浪带用隔一取二的粗阶梯：它们本就淡到看不清剖面，省一半开销
const FOAM_LADDER_COARSE = buildLadder(FOAM_EDGES.filter((_, i) => i % 2 === 0));

/* ══════════════════════════════════════════════════════════════════════════
   4 · AUDIO — AnalyserNode + in-page demo synth + optional mic
   ══════════════════════════════════════════════════════════════════════════ */
const A = {
  low:0, mid:0, high:0, energy:0,     // smoothed (显示通道)
  rawLow:0, bassAvg:0.20, setImp:0, beat:false,
  sLow:0, sMid:0, sHigh:0, sEnergy:0
};

let actx = null, analyser = null, freqData = null;
let demo = null, micStream = null;
let mode = 'demo';                       // 'demo' | 'mic' | 'off'
let paused = false;
let noiseBuf = null;

function makeNoiseBuffer(ctx){
  const len = Math.floor(ctx.sampleRate * 2);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  const rnd = mulberry32(0xB16B00B5);
  let last = 0;
  for (let i = 0; i < len; i++){
    const w = rnd() * 2 - 1;
    last = 0.82 * last + 0.18 * w;        // slightly pink-ish, less harsh
    d[i] = w * 0.55 + last * 0.9;
  }
  return buf;
}

function ensureCtx(){
  if (actx) return actx;
  const AC = window.AudioContext || window.webkitAudioContext;
  actx = new AC();
  analyser = actx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.68;
  analyser.minDecibels = -95;
  analyser.maxDecibels = -20;
  // some engines will not process a graph that never reaches the destination,
  // so hang a zero-gain sink off the analyser to keep currentTime advancing
  const sink = actx.createGain(); sink.gain.value = 0; sink.connect(actx.destination);
  analyser.connect(sink);
  freqData = new Uint8Array(analyser.frequencyBinCount);
  noiseBuf = makeNoiseBuffer(actx);
  return actx;
}

/** In-page demo music: a low drone with scheduled kicks, a mid pad, and airy noise.
 *  Everything is routed into the analyser only — the output gain is 0, so it is silent. */
function buildDemo(){
  const ac = ensureCtx();
  const out = ac.createGain(); out.gain.value = 1; out.connect(analyser);

  const master = ac.createGain(); master.gain.value = 0.62; master.connect(out);

  // BASS: two sines → drone gain → scheduled kick envelope → lowpass
  const bLp = ac.createBiquadFilter(); bLp.type = 'lowpass'; bLp.frequency.value = 185; bLp.Q.value = 1.05;
  bLp.connect(master);
  const kick = ac.createGain(); kick.gain.value = 0.03; kick.connect(bLp);
  const drone = ac.createGain(); drone.gain.value = 0.055; drone.connect(kick);
  const b1 = ac.createOscillator(); b1.type = 'sine'; b1.frequency.value = 55; b1.connect(drone); b1.start();
  const b2 = ac.createOscillator(); b2.type = 'sine'; b2.frequency.value = 82.4; b2.connect(drone); b2.start();

  // MID: saw + triangle → bandpass
  const mBp = ac.createBiquadFilter(); mBp.type = 'bandpass'; mBp.frequency.value = 780; mBp.Q.value = 0.75;
  mBp.connect(master);
  const midGain = ac.createGain(); midGain.gain.value = 0.055; midGain.connect(mBp);
  const m1 = ac.createOscillator(); m1.type = 'sawtooth'; m1.frequency.value = 330; m1.connect(midGain); m1.start();
  const m2 = ac.createOscillator(); m2.type = 'triangle'; m2.frequency.value = 1320; m2.connect(midGain); m2.start();

  // HIGH: noise → highpass
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4200; hp.Q.value = 0.6;
  const hiGain = ac.createGain(); hiGain.gain.value = 0.05; hp.connect(hiGain); hiGain.connect(master);
  const nz = ac.createBufferSource(); nz.buffer = noiseBuf; nz.loop = true; nz.connect(hp); nz.start();

  // slow LFOs so mid / high / master breathe — this is the "section energy"
  const lfoM = ac.createOscillator(); lfoM.type = 'sine'; lfoM.frequency.value = 0.131;
  const ampM = ac.createGain(); ampM.gain.value = 0.034; lfoM.connect(ampM); ampM.connect(midGain.gain); lfoM.start();
  const lfoH = ac.createOscillator(); lfoH.type = 'sine'; lfoH.frequency.value = 0.373;
  const ampH = ac.createGain(); ampH.gain.value = 0.030; lfoH.connect(ampH); ampH.connect(hiGain.gain); lfoH.start();
  const lfoS = ac.createOscillator(); lfoS.type = 'sine'; lfoS.frequency.value = 0.055;
  const ampS = ac.createGain(); ampS.gain.value = 0.30; lfoS.connect(ampS); ampS.connect(master.gain); lfoS.start();
  const lfoS2 = ac.createOscillator(); lfoS2.type = 'sine'; lfoS2.frequency.value = 0.083;
  const ampS2 = ac.createGain(); ampS2.gain.value = 0.20; lfoS2.connect(ampS2); ampS2.connect(master.gain); lfoS2.start();

  return { out, kick, drone, midGain, hiGain, master, b1, b2, m1, m2, nz,
           nextBeat: ac.currentTime + 0.2, beatCount: 0 };
}

function pumpBeats(){
  if (!demo || mode !== 'demo') return;
  const ac = actx, g = demo.kick.gain, now = ac.currentTime;
  while (demo.nextBeat < now + 0.15){
    const t = Math.max(demo.nextBeat, now);
    const strong = (demo.beatCount % 4) === 0;
    const peak = strong ? 0.62 : 0.34;
    g.cancelScheduledValues(t);
    g.setValueAtTime(0.03, t);
    g.linearRampToValueAtTime(peak, t + 0.014);
    g.exponentialRampToValueAtTime(0.05, t + (strong ? 0.22 : 0.13));
    g.exponentialRampToValueAtTime(0.03, t + (strong ? 0.40 : 0.26));
    // occasional octave blip for musical variety
    demo.m1.frequency.setValueAtTime(demo.beatCount % 8 === 6 ? 415.3 : 330, t);
    demo.beatCount++;
    demo.nextBeat += 0.462 + 0.02 * hash2(demo.beatCount, 11);
  }
}

/** read the three bands + overall energy out of the analyser */
function readAnalyser(dt){
  analyser.getByteFrequencyData(freqData);
  const sr = actx.sampleRate, bins = freqData.length, binHz = sr / bins;
  let lo = 0, nLo = 0, mi = 0, nMi = 0, hi = 0, nHi = 0, all = 0, nAll = 0;
  for (let i = 1; i < bins; i++){
    const f = i * binHz;
    if (f > 20000) break;
    const v = freqData[i] / 255;
    all += v; nAll++;
    if (f <= 250){ lo += v; nLo++; }
    else if (f <= 3000){ mi += v; nMi++; }
    else { hi += v; nHi++; }
  }
  const rawLow  = nLo ? lo / nLo : 0;
  const rawMid  = nMi ? mi / nMi : 0;
  const rawHigh = nHi ? hi / nHi : 0;
  const rawAll  = nAll ? all / nAll : 0;

  A.rawLow = rawLow;
  A.bassAvg += (rawLow - A.bassAvg) * (1 - Math.exp(-dt * 1000 / 700));
  if (rawLow > A.bassAvg * 1.42 + 0.055 && !paused){
    A.beat = true;
    A.setImp = clamp(A.setImp + (rawLow - A.bassAvg) * 2.4, 0, 1);
  } else A.beat = false;
  A.setImp *= Math.exp(-dt * 1000 / SET_TAU_MS);

  A.low    = clamp(rawLow  * 1.00, 0, 1);
  A.mid    = clamp(rawMid  * 1.15, 0, 1);
  A.high   = clamp(rawHigh * 1.95, 0, 1);
  A.energy = clamp(rawAll  * 1.35, 0, 1);
}

function readFallback(dt){
  // If no analyser is available (very old browser, blocked context), synthesize
  // the same values from the same music script so the scene still moves.
  const t = performance.now() / 1000;
  const kick = Math.pow(Math.max(0, Math.sin(t * 6.8)), 8);
  A.rawLow = 0.22 + 0.55 * kick + 0.10 * Math.sin(t * 1.7);
  A.bassAvg += (A.rawLow - A.bassAvg) * (1 - Math.exp(-dt * 1000 / 700));
  if (A.rawLow > A.bassAvg * 1.42 + 0.055){ A.beat = true; A.setImp = clamp(A.setImp + 0.5, 0, 1); }
  else A.beat = false;
  A.setImp *= Math.exp(-dt * 1000 / SET_TAU_MS);
  A.low    = clamp(A.rawLow, 0, 1);
  A.mid    = clamp(0.30 + 0.28 * Math.sin(t * 0.81), 0, 1);
  A.high   = clamp(0.16 + 0.30 * Math.pow(Math.max(0, Math.sin(t * 2.34)), 2), 0, 1);
  A.energy = clamp(0.34 + 0.34 * Math.sin(t * 0.345), 0, 1);
}

function smoothAudio(dt){
  const up = 55, down = 260;
  // ⛔ both bounds matter: a negative dt (clock going backwards, tab restore,
  //    a harness replaying an old timestamp) made 1-exp(-dt*1000/up) huge and the
  //    one-pole smoother diverged to ±1e81, poisoning every downstream value.
  const k = (cur, tgt) => {
    const tau = tgt > cur ? up : down;
    const f = 1 - Math.exp(-Math.max(0, dt) * 1000 / tau);
    const v = cur + (tgt - cur) * f;
    return v > 0 ? (v < 1 ? v : 1) : 0;      // ⛔ never let a non-finite leak out
  };
  A.sLow    = k(A.sLow, A.low);
  A.sMid    = k(A.sMid, A.mid);
  A.sHigh   = k(A.sHigh, A.high);
  A.sEnergy = k(A.sEnergy, A.energy);
}

async function startDemo(){
  stopMic();
  try {
    ensureCtx();
    if (actx.state === 'suspended') await actx.resume();
    if (!demo) demo = buildDemo();
    mode = 'demo';
  } catch (err){
    // no Web Audio at all (very old browser, or a blocked file:// context):
    // fall back to the in-page synth, the scene still moves
    mode = 'fallback';
    flash('无法启用音频引擎，已切到内置合成：' + (err && err.name ? err.name : 'error'));
  }
  paused = false; frozenT = null;
  syncButtons();
}

async function startMic(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    flash('此浏览器在 file:// 下不提供麦克风（需 https / localhost）');
    return;
  }
  try {
    ensureCtx();
    if (actx.state === 'suspended') await actx.resume();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const src = actx.createMediaStreamSource(micStream);
    src.connect(analyser);
    if (demo) demo.master.gain.value = 0;
    mode = 'mic'; paused = false;
    syncButtons(); flash('');
  } catch (err){
    flash('麦克风不可用：' + (err && err.name ? err.name : 'error'));
  }
}

function stopMic(){
  if (micStream){ micStream.getTracks().forEach(tr => tr.stop()); micStream = null; }
  if (demo) demo.master.gain.value = 0.62;
}

/** ⭐ 单浪模式开关：只隐藏绘制，**不改模拟**（队列/间距/交接/退水照旧）。 */

}
function syncSolo(){

    + ` ｜ 涌高 ${soloInfo.reach.toFixed(2)} ｜ 行程 ${Math.round(soloInfo.ms)}ms`
    + (soloInfo.nextIn >= 0 ? ` ｜ 下一条 ${pct(soloInfo.nextIn)}` : ' ｜ 下一条 —')

document.querySelectorAll('.btn').forEach(b => {
  b.addEventListener('click', () => {

    if (act === 'demo') startDemo();
    else if (act === 'mic') startMic();
    else if (act === 'solo') toggleSolo();
    else togglePause();

addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'd') startDemo();
  else if (k === 'm') startMic();
